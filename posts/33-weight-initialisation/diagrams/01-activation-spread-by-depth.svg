<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-activation-spread-by-depth-title" aria-describedby="nn-01-activation-spread-by-depth-desc">
<title id="nn-01-activation-spread-by-depth-title">At 0.01 the signal vanishes; He keeps it through ten layers</title>
<desc id="nn-01-activation-spread-by-depth-desc">A chart on a log axis of the standard deviation of each layer's activations, layers 1 to 10, for ten 64-neuron layers with ReLU on the spiral, seed 0, under three weight scales on the same draws. Scale 0.01: 3.565 times 10 to the minus 3, 1.705 times 10 to the minus 4, 9.798 times 10 to the minus 6, 4.836 times 10 to the minus 7, 3.096 times 10 to the minus 8, 1.674 times 10 to the minus 9, 1.049 times 10 to the minus 10, 5.888 times 10 to the minus 12, 2.875 times 10 to the minus 13, 1.337 times 10 to the minus 14. Glorot: 6.205 times 10 to the minus 2, 3.710 times 10 to the minus 2, 2.665 times 10 to the minus 2, 1.644 times 10 to the minus 2, 1.316 times 10 to the minus 2, 8.890 times 10 to the minus 3, 6.963 times 10 to the minus 3, 4.887 times 10 to the minus 3, 2.983 times 10 to the minus 3, 1.734 times 10 to the minus 3. He: 3.565 times 10 to the minus 1, 3.014 times 10 to the minus 1, 3.062 times 10 to the minus 1, 2.672 times 10 to the minus 1, 3.024 times 10 to the minus 1, 2.889 times 10 to the minus 1, 3.200 times 10 to the minus 1, 3.176 times 10 to the minus 1, 2.742 times 10 to the minus 1, 2.254 times 10 to the minus 1. A table below gives the factor per layer on the mean square for layers 2 to 10, mean over seeds 0 to 99, with the weights' standard deviation: 0.01, predicted 0.0032, measured 0.0031 to 0.0032 forward and 0.0032 to 0.0032 backward; Glorot, 0.125, predicted 0.5, measured 0.4846 to 0.5077 forward and 0.4922 to 0.5024 backward; He, 0.177, predicted 1, measured 0.9692 to 1.0153 forward and 0.9896 to 1.0091 backward.</desc>
