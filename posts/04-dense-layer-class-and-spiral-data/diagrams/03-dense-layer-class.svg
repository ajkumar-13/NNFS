<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-03-dense-layer-class-title" aria-describedby="nn-03-dense-layer-class-desc">
<title id="nn-03-dense-layer-class-title">One class, two instances, each with its own weights</title>
<desc id="nn-03-dense-layer-class-desc">At the top, a card holding the six lines of the Layer_Dense class: __init__, which runs once when an instance is created, sets self.weights to 0.01 times np.random.randn(n_inputs, n_neurons) and self.biases to zeros of shape (1, n_neurons); forward, which runs on every call, stores np.dot(inputs, self.weights) plus self.biases in self.output. Below, the two instances of section 6 in a chain: X of shape (300, 2) goes into dense1 = Layer_Dense(2, 3), with weights (2, 3) and biases (1, 3); dense1.output, (300, 3), goes into dense2 = Layer_Dense(3, 3), with weights (3, 3) and biases (1, 3); dense2.output is (300, 3). Dashed lines labelled instance of the class join the class to both instances. The weight and bias cells are drawn without values, one cell per number: dense1 holds 9 parameters, 6 weights and 3 biases, and dense2 12, 9 weights and 3 biases.</desc>
