<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title">One class, two instances, each with its own weights</text>
<text x="40" y="76" class="t-subtitle">The class of section 5 and the two layers section 6 builds from it on the spiral data.</text>
<text x="40" y="128" class="t-head">The class: a blueprint</text>
<rect x="40" y="144" width="880" height="168" rx="8" class="card"/>
<text x="64" y="176" class="t-code">class Layer_Dense:</text>
<text x="96" y="200" class="t-code">def __init__(self, n_inputs, n_neurons):</text>
<text x="128" y="224" class="t-code">self.weights = 0.01 * np.random.randn(n_inputs, n_neurons)</text>
<text x="128" y="248" class="t-code">self.biases = np.zeros((1, n_neurons))</text>
<text x="96" y="272" class="t-code">def forward(self, inputs):</text>
<text x="128" y="296" class="t-code">self.output = np.dot(inputs, self.weights) + self.biases</text>
<path d="M608,184 H616 V252 H608" class="brace"/>
<g data-grid="skip">
<text x="624" y="223" class="t-note">runs once, when an instance is made</text>
</g>
<path d="M608,260 H616 V300 H608" class="brace"/>
<g data-grid="skip">
<text x="624" y="285" class="t-note">runs on every call</text>
</g>
