<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-weight-convention-title" aria-describedby="nn-02-weight-convention-desc">
<title id="nn-02-weight-convention-title">Same weights, two layouts: a row or a column per neuron</title>
<desc id="nn-02-weight-convention-desc">Two grids of the same 12 weights, the first layer of post 03. On the left, weights_old of shape (3, 4), one row per neuron and one column per input, used as np.dot(inputs, weights_old.T) + biases. On the right, weights_new of shape (4, 3), one row per input and one column per neuron, used as np.dot(inputs, weights_new) + biases. Neuron 1's weights, 0.20, 0.80, minus 0.50, 1.00, are the first row on the left and the first column on the right, both shaded and outlined. An arrow labelled transpose joins the two. Both calls give the same (3, 3) output, whose first row is 4.8, 1.21, 2.385.</desc>
<style>
