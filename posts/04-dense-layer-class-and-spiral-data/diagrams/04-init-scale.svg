<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-04-init-scale-title" aria-describedby="nn-04-init-scale-desc">
<title id="nn-04-init-scale-title">With 0.01 the spread fades; with 1.0 it explodes</title>
<desc id="nn-04-init-scale-desc">A line chart of the standard deviation of each layer's output, layers 1 to 6 across, on a log scale from 10 to the minus 9 to 10 to the 5, for six stacked 64-neuron Layer_Dense layers on the spiral data with weights scale times randn. Scale 1.0 climbs from 5.651 times 10 to the -1 to 2.151 times 10 to the 4, times 8.243 per layer. Scale 0.125 stays level, from 7.063 times 10 to the -2 to 8.204 times 10 to the -2, times 1.030 per layer. Scale 0.01 falls from 5.651 times 10 to the -3 to 2.151 times 10 to the -8, times 0.082 per layer.</desc>
