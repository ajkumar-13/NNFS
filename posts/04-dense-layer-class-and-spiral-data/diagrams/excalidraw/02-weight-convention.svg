<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">Two weight conventions: rows per neuron versus columns per neuron</title>
  <desc id="d">Two hand-drawn panels comparing the two weight-matrix layouts for a dense layer with two inputs and three neurons. The left panel, labelled old and covering Parts 01 to 03, stores one row per neuron: W has shape three by two, each neuron is drawn as a horizontal block running across the columns, and the forward pass is np.dot of X and W transposed plus b. The right panel, labelled new and covering Part 04 onward, stores one column per neuron: W has shape two by three, each neuron is drawn as a vertical block running down the rows, and the forward pass is np.dot of X and W with no transpose. Each of the three neurons is coloured consistently across both panels. A band states that the arithmetic is identical and the output numbers are the same, and that only the layout of W in memory and the shape of the call site change, with a footer noting that the new layout is also the shape the weights are allocated in.</desc>

