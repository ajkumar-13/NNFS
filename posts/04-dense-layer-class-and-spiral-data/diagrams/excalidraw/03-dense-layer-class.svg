69.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink)">self.weights = 0.01 * np.random.randn(</text><text xml:space="preserve" x="82" y="181.7" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink)">                   n_inputs, n_neurons)</text><text xml:space="preserve" x="82" y="194.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink)">self.biases  = np.zeros((1, n_neurons))</text><text xml:space="preserve" x="82" y="225.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">allocates the state · runs once, at construction</text><path d="M513.85 126.45C604.39 128.34 694.78 128.51 876.11 126.96C892.08 128.15 896.39 133.06 899.4 148.05C898.71 169.55 896.8 185.87 899.52 229.77C897.27 243.76 891.17 252.31 878.92 252.34C747.39 248.61 619.36 249.65 511.98 250.12C496.38 250.93 492.2 242.85 490.28 230.45C492.87 203.02 491.23 176.47 491.71 147.24C492.11 131.83 499.61 126.54 515.08 124.1C512.67 126 512.67 126 512.67 126" fill="var(--ce-neutral-1)" stroke="none"/><path d="M513.89 125.95C644.72 126.39 776.64 126 877.11 125.61M512.98 125.48C589.03 125.01 665.02 124.98 877.82 125.57M877.33 126C892.3 124.31 896.93 132.06 898.2 145.73M877.73 127.43C891.6 124.98 898.71 133.16 896.84 144.39M898.35 147.78C895.68 170.52 896.13 194.07 899.97 228.71M897.52 145.99C898.09 163.59 896.92 180.37 897.89 228.81M898 229.33C898.87 244.37 891.22 249.8 876.58 248.26M896.76 230.33C898.27 243.98 890.06 248.72 875.93 249.22M876.38 248.99C746.11 249.31 616.95 251.07 513.3 251.13M877.32 249.46C780.52 252.29 683.25 251.91 512.04 250.09M512.67 250C498.58 249.16 490.02 242.84 490.37 229.15M514.13 250.43C498.49 247.83 491.79 244.87 492.06 231.4M492.33 229.32C491.33 207.28 494.4 182.57 492.92 147.93M491.49 228.58C491.35 21