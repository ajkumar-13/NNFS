'"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">dense1.weights and dense2.weights are different arrays. Nothing about one instance reaches the other.</text><text xml:space="preserve" x="40" y="511.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">That encapsulation is what the class buys: state travels with the layer instead of being smeared across the script.</text>
