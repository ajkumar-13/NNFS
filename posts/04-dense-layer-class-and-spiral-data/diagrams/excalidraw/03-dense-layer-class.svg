<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">The Layer_Dense class: anatomy and lifecycle</title>
  <desc id="d">A hand-drawn schematic of the Layer_Dense class. The upper card holds the blueprint with its two methods. The constructor, taking n_inputs and n_neurons, allocates self.weights as zero-point-zero-one times a standard normal draw of shape n_inputs by n_neurons and self.biases as zeros of shape one by n_neurons; it is annotated as allocating the state and running once at construction. The forward method computes self.output as np.dot of inputs and self.weights plus self.biases, annotated as stored on self rather than returned because the backward pass needs it again. Below, two instance cards: dense1 built as Layer_Dense of two and three, holding weights of shape two by three and biases of shape one by three for the two spiral features; and dense2 built as Layer_Dense of three and three, taking three inputs because that is what dense1 emits. An arrow labelled dense1.output runs from the first instance to the second. A footer notes that the two weight arrays are entirely separate and that this encapsulation is what the class buys.</desc>

