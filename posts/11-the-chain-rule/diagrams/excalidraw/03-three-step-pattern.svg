<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">The chain rule as a three-step procedure, worked on a polynomial</title>
  <desc id="d">Three hand-drawn step cards working the derivative of three times two x squared, all to the fifth. Step one, split it: name the inner function g of x equals two x squared and the outer function f of z equals three z to the fifth, which is just reading the expression. Step two, differentiate each locally: g prime of x is four x and f prime of z is fifteen z to the fourth, one ordinary derivative per function, and this is where the remaining posts do their work. Step three, multiply: evaluate f prime at what g produced and multiply by g prime, giving fifteen times two x squared to the fourth times four x, which expands to fifteen times sixteen x to the eighth times four x, equalling nine hundred and sixty x to the ninth. A band maps the same three steps onto the network: read the architecture, derive each layer’s local derivative, multiply the factors, noting that only the second is actual work and it is what Parts 12 to 21 do one class at a time.</desc>

