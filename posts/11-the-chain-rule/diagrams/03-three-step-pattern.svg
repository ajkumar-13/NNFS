<text x="56" y="168" class="t-label">inner: <tspan class="i">g</tspan>(<tspan class="i">x</tspan>) = 2<tspan class="i">x</tspan><tspan class="sub" dy="-6">2</tspan><tspan dy="6">​</tspan></text>
<text x="56" y="192" class="t-label">outer: <tspan class="i">f</tspan>(<tspan class="i">z</tspan>) = 3<tspan class="i">z</tspan><tspan class="sub" dy="-6">5</tspan><tspan dy="6">​</tspan></text>
<rect x="40" y="236" width="304" height="108" rx="8" class="card"/>
