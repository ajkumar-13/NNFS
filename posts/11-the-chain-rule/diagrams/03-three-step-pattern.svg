<text x="56" y="300" class="t-label"><tspan class="i">g</tspan>′(<tspan class="i">x</tspan>) = 4<tspan class="i">x</tspan></text>
<text x="56" y="324" class="t-label"><tspan class="i">f</tspan> ′(<tspan class="i">z</tspan>) = 15<tspan class="i">z</tspan><tspan class="sub" dy="-6">4</tspan><tspan dy="6">​</tspan></text>
<rect x="40" y="368" width="304" height="108" rx="8" class="card"/>
<text x="56" y="400" class="t-head">3. Multiply, with <tspan class="i">f</tspan> ′ at <tspan class="i">z</tspan> = <tspan class="i">g</tspan>(<tspan class="i">x</tspan>)</text>
<text x="56" y="432" class="t-label">15(2<tspan class="i">x</tspan><tspan class="sub" dy="-6">2</tspan><tspan dy="6">​</tspan>)<tspan class="sub" dy="-6">4</tspan><tspan dy="6">​</tspan> · 4<tspan class="i">x</tspan> = 960<tspan class="i">x</tspan><tspan class="sub" dy="-6">9</tspan><tspan dy="6">​</tspan></text>
<text x="56" y="456" class="t-label">at <tspan class="i">x</tspan> = 1: <tspan class="i">f</tspan> ′(2) · <tspan class="i">g</tspan>′(1) = 240 · 4 = <tspan class="b">960</tspan></text>
