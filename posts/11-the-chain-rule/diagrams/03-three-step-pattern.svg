<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-three-step-pattern-title" aria-describedby="nn-03-three-step-pattern-desc">
<title id="nn-03-three-step-pattern-title">Take the outer slope at the inner value</title>
<desc id="nn-03-three-step-pattern-desc">Left, three cards work the derivative of 3 times (2x squared) to the fifth. Step 1, split it: the inner function g(x) = 2x squared and the outer function f(z) = 3z to the fifth. Step 2, differentiate each: g prime (x) = 4x and f prime (z) = 15z to the fourth. Step 3, multiply, with f prime taken at z = g(x): 15 (2x squared) to the fourth times 4x = 960x to the ninth, which at x = 1, where z = 2, is f prime (2) times g prime (1) = 240 times 4 = 960. Right, the curve y = 3(2x squared) to the fifth for x from 0.85 to 1.15, with the point (1, 96). The tangent there has slope 960. A second line through the point has slope 60, f prime (1) times g prime (1), the outer derivative taken at x instead of z, and runs almost flat.</desc>
