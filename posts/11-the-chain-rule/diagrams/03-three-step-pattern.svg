<text x="40" y="48" class="t-title">Take the outer slope at the inner value</text>
<text x="40" y="76" class="t-subtitle">Section 4's <tspan class="i">y</tspan> = 3(2<tspan class="i">x</tspan><tspan class="sub" dy="-6">2</tspan><tspan dy="6">​</tspan>)<tspan class="sub" dy="-6">5</tspan><tspan dy="6">​</tspan> at <tspan class="i">x</tspan> = 1, where the inner value is <tspan class="i">z</tspan> = <tspan class="i">g</tspan>(1) = 2.</text>
<rect x="40" y="104" width="304" height="108" rx="8" class="card"/>
