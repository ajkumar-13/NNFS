<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-single-neuron-backprop-title" aria-describedby="nn-01-single-neuron-backprop-desc">
<title id="nn-01-single-neuron-backprop-title">One upstream gradient, scaled by each input</title>
<desc id="nn-01-single-neuron-backprop-desc">The forward pass on the top row, left to right: the inputs 1, minus 2, 3 and the bias input 1 times the weights minus 3, minus 1, 2 and the bias 1 give the products minus 3, 2, 6 and 1; their sum is z = 6, ReLU gives y hat = 6, and the squared error against the target 0 gives L = 36. The backward pass on the bottom row, right to left, in the gradient colour: factor 1, 2 times (y hat minus y), is 12; factor 2, the ReLU derivative at z &gt; 0, is 1; factor 3, the sum, is 1; so the upstream gradient 12 reaches the parameters. Factor 4 is each parameter's input: the gradients are 12 times 1 = 12, 12 times minus 2 = minus 24, 12 times 3 = 36 for the weights, and 12 times 1 = 12 for the bias.</desc>
