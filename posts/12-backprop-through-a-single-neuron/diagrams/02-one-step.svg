<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-one-step-title" aria-describedby="nn-02-one-step-desc">
<title id="nn-02-one-step-title">One step with α = 0.01 takes the loss from 36 to 17.64</title>
<desc id="nn-02-one-step-desc">On the left, the update w new = w old minus 0.01 times the gradient, row by row: w1 minus 3 with gradient 12 becomes minus 3.12, w2 minus 1 with gradient minus 24 becomes minus 0.76, w3 2 with gradient 36 becomes 1.64, and the bias 1 with gradient 12 becomes 0.88; the note says w2's gradient is negative, so the step raises it. On the right, a table of the four terms of z before and after the step: minus 3 to minus 3.12, 2 to 1.52, 6 to 4.92 and 1 to 0.88, changes minus 0.12, minus 0.48, minus 1.08 and minus 0.12. Their sum z goes from 6 to 4.20, a change of minus 1.80, so 4.20 is 0.7 times 6; the loss L = z squared goes from 36 to 17.64, which is 0.49 times 36.</desc>
