<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-loss-decay-title" aria-describedby="nn-03-loss-decay-desc">
<title id="nn-03-loss-decay-title">Every step multiplies the loss by 0.49, until rounding</title>
<desc id="nn-03-loss-decay-desc">A chart of the loss of the 200-iteration loop against the iteration, 0 to 120, on a log axis from 10 to the minus 35 up to 100. The run falls on the dashed straight line 36 times 0.49 to the power t, from 36 at iteration 0. A dotted horizontal line at 5 times 10 to the minus 5 marks where the loss rounds to 0.0000 in four decimals; the run crosses it at iteration 19. From about iteration 100 the run leaves the straight line in steps near 10 to the minus 30, and a dotted vertical line marks iteration 113, from which the loss is exactly 0.0, which a log axis cannot show. A table lists what the loop prints at iterations 0, 16, 20, 100 and 120: 36.0000, 0.0004, 0.0000, 0.0000 and 0.0000, against the values 36, 3.976 times 10 to the minus 4, 2.292 times 10 to the minus 5, 3.155 times 10 to the minus 30, and 0.</desc>
