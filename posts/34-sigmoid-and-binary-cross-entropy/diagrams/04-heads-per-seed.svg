<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-04-heads-per-seed-title" aria-describedby="nn-04-heads-per-seed-desc">
<title id="nn-04-heads-per-seed-title">The two heads tie on nine seeds of ten</title>
<desc id="nn-04-heads-per-seed-desc">One row per seed, 0 to 9, for the two-moons network trained 2,000 epochs with each head. Left, test points correct of 200 on an axis from 196 to 200; right, the test data loss on a log axis from 10 to the minus 4 to 10 to the minus 1, the two heads joined by a line. Sigmoid head, 1 output, blue diamonds, test points correct and test data loss: seed 0 200, 0.0045; seed 1 200, 0.0004; seed 2 200, 0.0007; seed 3 200, 0.0036; seed 4 200, 0.0049; seed 5 200, 0.0007; seed 6 197, 0.0333; seed 7 200, 0.0009; seed 8 199, 0.0053; seed 9 200, 0.0005. Softmax head, 2 outputs, hollow ink circles: seed 0 200, 0.0042; seed 1 200, 0.0005; seed 2 200, 0.0008; seed 3 199, 0.0047; seed 4 200, 0.0052; seed 5 200, 0.0004; seed 6 197, 0.0433; seed 7 200, 0.0005; seed 8 199, 0.0048; seed 9 200, 0.0003. The counts are equal on every seed but seed 3, where the sigmoid head has 200 and the softmax head 199; the test loss is lower with the sigmoid head on five seeds and with the softmax head on five.</desc>
