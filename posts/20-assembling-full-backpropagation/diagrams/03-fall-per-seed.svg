<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-fall-per-seed-title" aria-describedby="nn-03-fall-per-seed-desc">
<title id="nn-03-fall-per-seed-title">One step's fall depends on the batch, not the seed</title>
<desc id="nn-03-fall-per-seed-desc">Two ranges on a logarithmic axis from 10 to the minus 7 to 10 to the minus 3: the fall in loss after one update with learning rate 0.01, one tick per seed, seeds 0 to 9. On the post's batch of four, labels 0, 1, 2, 1, the ten falls lie between 4.169 times 10 to the minus 4 and 4.191 times 10 to the minus 4, all in one place at this scale. On a balanced batch of six, labels 0, 1, 2, 1, 0, 2, they range from 2.723 times 10 to the minus 7 to 1.409 times 10 to the minus 6. A note says that on the balanced batch the bias gradient of dense2 nearly cancels, and what is left is small because the weights of the 0.01 initialisation are.</desc>
<style>
