<text x="40" y="48" class="t-title" data-w="565">Four calls forward, four calls back, one update</text>
<text x="40" y="76" class="t-subtitle" data-w="605">The network of section 2 on its batch of <tspan class="i">N</tspan> = 4 samples. Shapes are (rows, columns).</text>
