<text x="496" y="368" text-anchor="end" class="t-label" data-w="35">(4, 3)</text>
<path d="M432,280 L432,325" class="s-purple w15 nofill" marker-end="url(#nn-01-full-backprop-pipeline-arrow-purple)"/>
<rect x="556" y="336" width="160" height="104" rx="8" class="card"/>
<text x="572" y="368" class="t-code" data-w="69"><tspan class="mono f-purple-ink">dweights</tspan></text>
<text x="700" y="368" text-anchor="end" class="t-label" data-w="35">(3, 3)</text>
<text x="572" y="392" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dbiases</tspan></text>
<text x="700" y="392" text-anchor="end" class="t-label" data-w="35">(1, 3)</text>
<text x="572" y="416" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dinputs</tspan></text>
<text x="700" y="416" text-anchor="end" class="t-label" data-w="35">(4, 3)</text>
<path d="M636,280 L636,325" class="s-purple w15 nofill" marker-end="url(#nn-01-full-backprop-pipeline-arrow-purple)"/>
<rect x="776" y="336" width="144" height="56" rx="8" class="card"/>
<text x="792" y="368" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dinputs</tspan></text>
<text x="904" y="368" text-anchor="end" class="t-label" data-w="35">(4, 3)</text>
<path d="M848,280 L848,325" class="s-purple w15 nofill" marker-end="url(#nn-01-full-backprop-pipeline-arrow-purple)"/>
<text x="352" y="420" class="t-note" data-w="85">zero at the 5</text>
<text x="352" y="440" class="t-note" data-w="86">closed gates</text>
<text x="776" y="420" class="t-note" data-w="85">from <tspan class="b">ŷ</tspan> and <tspan class="b">y</tspan></text>
<text x="776" y="440" class="t-note" data-w="111">divided by <tspan class="i">N</tspan> = 4</text>
<rect x="176" y="496" width="512" height="156" rx="8" class="card"/>
<text x="192" y="528" class="t-head" data-w="263">The update, learning_rate = 0.01</text>
<text x="192" y="560" class="t-code" data-w="419"><tspan class="mono f-orange-ink">dense1.weights</tspan><tspan class="mono"> -= learning_rate * </tspan><tspan class="mono f-purple-ink">dense1.dweights</tspan></text>
<text x="192" y="584" class="t-code" data-w="402"><tspan class="mono f-orange-ink">dense1.biases</tspan><tspan class="mono"> -= learning_rate * </tspan><tspan class="mono f-purple-ink">dense1.dbiases</tspan></text>
<text x="192" y="608" class="t-code" data-w="419"><tspan class="mono f-orange-ink">dense2.weights</tspan><tspan class="mono"> -= learning_rate * </tspan><tspan class="mono f-purple-ink">dense2.dweights</tspan></text>
<text x="192" y="632" class="t-code" data-w="402"><tspan class="mono f-orange-ink">dense2.biases</tspan><tspan class="mono"> -= learning_rate * </tspan><tspan class="mono f-purple-ink">dense2.dbiases</tspan></text>
<path d="M228,448 L228,485" class="s-purple w15 nofill" marker-end="url(#nn-01-full-backprop-pipeline-arrow-purple)"/>
<path d="M636,448 L636,485" class="s-purple w15 nofill" marker-end="url(#nn-01-full-backprop-pipeline-arrow-purple)"/>
<rect x="744" y="496" width="176" height="136" rx="8" class="card"/>
<text x="760" y="528" class="t-head" data-w="69">The loss</text>
<text x="760" y="560" class="t-label" data-w="44">before</text>
<text x="904" y="560" text-anchor="end" class="t-label" data-w="62">1.098629</text>
<text x="760" y="584" class="t-label" data-w="32">after</text>
<text x="904" y="584" text-anchor="end" class="t-label" data-w="62">1.098210</text>
<text x="760" y="608" class="t-label" data-w="152">change −4.190 × 10<tspan class="sub" dy="-6">−4</tspan><tspan dy="6">​</tspan></text>
<path d="M696,568 L733,568" class="flow" marker-end="url(#nn-01-full-backprop-pipeline-arrow)"/>
<text x="40" y="684" class="t-note" data-w="551">Only the two dense layers store parameter gradients, so the update has four lines.</text>
