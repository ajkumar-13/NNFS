<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-full-backprop-pipeline-title" aria-describedby="nn-01-full-backprop-pipeline-desc">
<title id="nn-01-full-backprop-pipeline-title">Four calls forward, four calls back, one update</title>
<desc id="nn-01-full-backprop-pipeline-desc">The network of the post, on its batch of N = 4 samples, as a row of five cards: the data X of shape (4, 2), dense1 (a Layer_Dense), activation1 (an Activation_ReLU), dense2 (a Layer_Dense) and loss_activation (softmax and the loss). Grey forward arrows run left to right, labelled Z1, A1 and Z2, each of shape (4, 3). Purple backward arrows run right to left, labelled dL/dZ2, dL/dA1, dL/dZ1 and, dashed, dL/dX, which nothing reads. Under each object, what its backward call stores: dense1 dweights (2, 3), dbiases (1, 3) and dinputs (4, 2); activation1 dinputs (4, 3), zero at 5 closed gates; dense2 dweights (3, 3), dbiases (1, 3) and dinputs (4, 3); loss_activation dinputs (4, 3), computed from the predictions y-hat and the labels y and divided by N = 4. The parameter gradients of the two dense layers go down to a card with the four update lines, each parameter minus learning_rate times its gradient, with learning_rate = 0.01, and a second forward pass gives the loss before, 1.098629, and after, 1.098210, a change of minus 4.190 times 10 to the minus 4.</desc>
