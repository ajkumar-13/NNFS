<text x="732" y="260" text-anchor="middle" class="t-note f-purple-ink" data-w="47">∂<tspan class="i">L</tspan>/∂<tspan class="b">Z</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan></text>
<path d="M176,236 L91,236" class="s-purple w15 nofill d-proj" marker-end="url(#nn-01-full-backprop-pipeline-arrow-purple)"/>
