<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">The three classes and eight methods a classification network needs</title>
  <desc id="d">Three hand-drawn class cards, sorted by whether they hold parameters. Layer_Dense is marked trainable: its forward computes Z as X matrix-multiplied by W plus b and caches self.inputs, its backward writes dweights, dbiases and dinputs, and it has two instances in this network holding twenty-one parameters between them. Activation_ReLU is marked as having no parameters: its forward is max of nought and Z and caches self.inputs, its backward writes dinputs alone, and it is described as a gate that decides which gradients survive and changes none of them. The fused softmax and cross-entropy class is likewise parameterless: its forward runs softmax then the loss and caches self.output, its backward writes dinputs, and it starts the backward pass. A band states that every one of the network’s twenty-one parameters lives in the two Layer_Dense instances, and that the other two classes exist to move gradients through, which is why the optimiser in Part 22 only ever touches Layer_Dense.</desc>

