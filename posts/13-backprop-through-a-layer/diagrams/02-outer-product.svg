<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d">
  <title id="t">The weight-gradient matrix as an outer product of upstream gradient and input</title>
  <desc id="d">A hand-drawn outer product. On the left, a three-by-one column of upstream gradients, each forty-three point two, labelled dL_dZ. In the middle, a one-by-four row of the inputs one, two, three and four. On the right, the resulting three-by-four matrix of weight gradients, every row reading forty-three point two, eighty-six point four, one hundred and twenty-nine point six and one hundred and seventy-two point eight. One cell of the result is outlined and traced by dotted leaders back to the two numbers that produced it, with the arithmetic written out: forty-three point two times four equals one hundred and seventy-two point eight, from row one of the column and column four of the row. A band gives the line of code that computes it, explains that the reshape makes a three-by-one column which broadcasting stretches against the four-element row to fill a three-by-four result, and notes that Part 14 replaces both with a single np.dot that does the same thing for a whole batch.</desc>

