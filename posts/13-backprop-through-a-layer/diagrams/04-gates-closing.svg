<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-04-gates-closing-title" aria-describedby="nn-04-gates-closing-desc">
<title id="nn-04-gates-closing-title">The smallest pre-activation runs out first</title>
<desc id="nn-04-gates-closing-desc">A line chart of the three pre-activations z1, z2 and z3 over iterations 0 to 24 of the training loop, learning rate 0.001, on a vertical axis from minus 4 to 12. They start at 3.1, 7.2 and 11.3 and fall by the same amount per step while their gates are open; a brace at iteration 8 marks z2 and z3 as 4.1 apart. z1 crosses zero first: at iteration 3 it is minus 0.2167, its gate closes and the line stays flat. z2 crosses next: at iteration 12 it is minus 0.2477 and stays there. Two red diamonds mark the closings, labelled gate 1 closes at iteration 3 and gate 2 closes at iteration 12. z3 keeps falling towards zero, at 1.79 by iteration 24, labelled as the only open gate. A dotted line marks zero.</desc>
