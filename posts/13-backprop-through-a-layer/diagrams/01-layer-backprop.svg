<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-layer-backprop-title" aria-describedby="nn-01-layer-backprop-desc">
<title id="nn-01-layer-backprop-title">One upstream value reaches every gradient</title>
<desc id="nn-01-layer-backprop-desc">The worked layer drawn left to right. Four input nodes x1 to x4 hold 1, 2, 3 and 4 and are joined to three neuron cards. Neuron 1 reads z1 = 3.1, a1 = 3.1, gate 1 and dL/dz1 = 43.2; neuron 2 reads z2 = 7.2, a2 = 7.2, gate 1, dL/dz2 = 43.2; neuron 3 reads z3 = 11.3, a3 = 11.3, gate 1, dL/dz3 = 43.2. The three activations meet in the layer sum, y-hat = 21.6, whose derivative with respect to each activation is 1, and the sum feeds the loss L = y-hat squared = 466.56, whose derivative is 2 y-hat = 43.2. An arrow under the network runs right to left, labelled: backward, one value, 43.2, reaches all three neurons.Below, a 3 by 4 table of weight gradients, dL/dw_kj = dL/dz_k times x_j, with one row per neuron and one column per input, reads 43.2, 86.4, 129.6 and 172.8 in every row, and a column of bias gradients, dL/db_k, reads 43.2 three times. A key gives the colours: input, forward value, gradient, loss.</desc>
