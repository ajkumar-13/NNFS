<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-02-where-backprop-starts-title" aria-describedby="nn-02-where-backprop-starts-desc">
<title id="nn-02-where-backprop-starts-title">The loss is the one class with nothing after it</title>
<desc id="nn-02-where-backprop-starts-desc">Top: the classifier of section 1 as a row of cards, Dense, ReLU, Dense, Softmax and Loss, with forward arrows left to right, y-hat entering the loss and L leaving it, and backward arrows right to left in purple, the first being the loss's dinputs to the softmax. To the right of the loss a dashed box holds nothing. Below, the class Loss_CategoricalCrossentropy enlarged: forward(self, y_pred, y_true) clips a copy and returns the per-sample losses, whose mean is L; backward(self, dvalues, y_true) converts integer labels with np.eye, divides minus y_true by dvalues and then by samples. From the left, y-hat of shape (N, K) and y_true arrive at both methods, y-hat as backward's dvalues, and dinputs of shape (N, K) goes back to the softmax as its dvalues. From the right nothing arrives: the upstream gradient is dL/dL = 1, so the dvalues slot carries y-hat. Nothing is cached.</desc>
