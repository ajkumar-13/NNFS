<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="548">The loss is the one class with nothing after it</text>
<text x="40" y="76" class="t-subtitle" data-w="696">The classifier of section 1 and the loss class of section 5, for a batch of <tspan class="i">N</tspan> samples and <tspan class="i">K</tspan> classes.</text>
<rect x="40" y="128" width="104" height="64" rx="8" class="card"/>
<text x="92" y="168" text-anchor="middle" class="t-head" data-w="51">Dense</text>
<rect x="184" y="128" width="96" height="64" rx="8" class="card"/>
<text x="232" y="168" text-anchor="middle" class="t-head" data-w="44">ReLU</text>
<rect x="320" y="128" width="104" height="64" rx="8" class="card"/>
<text x="372" y="168" text-anchor="middle" class="t-head" data-w="51">Dense</text>
<rect x="464" y="128" width="112" height="64" rx="8" class="card"/>
<text x="520" y="168" text-anchor="middle" class="t-head" data-w="69">Softmax</text>
<rect x="656" y="128" width="104" height="64" rx="8" class="card"/>
<text x="708" y="168" text-anchor="middle" class="t-head" data-w="40">Loss</text>
<rect x="816" y="128" width="104" height="64" rx="8" class="w1 nofill s-ink-muted d-lead" data-fit="skip"/>
<text x="868" y="168" text-anchor="middle" class="t-note" data-w="51">nothing</text>
<rect x="656" y="128" width="104" height="64" rx="8" class="emph s-purple" data-fit="skip"/>
<path d="M144,148 L181,148" class="flow" marker-end="url(#nn-02-where-backprop-starts-arrow)"/>
<path d="M280,148 L317,148" class="flow" marker-end="url(#nn-02-where-backprop-starts-arrow)"/>
<path d="M424,148 L461,148" class="flow" marker-end="url(#nn-02-where-backprop-starts-arrow)"/>
<path d="M576,148 L653,148" class="flow" marker-end="url(#nn-02-where-backprop-starts-arrow)"/>
<text x="616" y="136" text-anchor="middle" class="t-note" data-w="10"><tspan class="b">ŷ</tspan></text>
<path d="M760,148 L813,148" class="flow" marker-end="url(#nn-02-where-backprop-starts-arrow)"/>
<text x="788" y="136" text-anchor="middle" class="t-note" data-w="9"><tspan class="i">L</tspan></text>
<path d="M184,172 L147,172" class="s-purple w15 nofill" marker-end="url(#nn-02-where-backprop-starts-arrow-purple)"/>
<path d="M320,172 L283,172" class="s-purple w15 nofill" marker-end="url(#nn-02-where-backprop-starts-arrow-purple)"/>
<path d="M464,172 L427,172" class="s-purple w15 nofill" marker-end="url(#nn-02-where-backprop-starts-arrow-purple)"/>
<path d="M656,172 L579,172" class="s-purple w15 nofill" marker-end="url(#nn-02-where-backprop-starts-arrow-purple)"/>
<text x="616" y="196" text-anchor="middle" class="t-code f-purple-ink" data-w="60">dinputs</text>
<rect x="216" y="224" width="560" height="388" rx="8" class="card"/>
<text x="232" y="256" class="t-code" data-w="351">class Loss_CategoricalCrossentropy(Loss):</text>
<text x="248" y="284" class="t-code" data-w="291">def forward(self, y_pred, y_true):</text>
<text x="264" y="312" class="t-code" xml:space="preserve" data-w="240">samples        = len(y_pred)</text>
<text x="264" y="340" class="t-code" data-w="410">y_pred_clipped = np.clip(y_pred, 1e-7, 1 - 1e-7)</text>
<text x="264" y="368" class="t-code" data-w="26">...</text>
<text x="264" y="396" class="t-code" data-w="265">return negative_log_likelihoods</text>
<text x="248" y="424" class="t-code" data-w="308">def backward(self, dvalues, y_true):</text>
<text x="264" y="452" class="t-code" data-w="188">samples = len(dvalues)</text>
<text x="264" y="480" class="t-code" xml:space="preserve" data-w="214">labels  = len(dvalues[0])</text>
<text x="264" y="508" class="t-code" data-w="223">if len(y_true.shape) == 1:</text>
<text x="280" y="536" class="t-code" data-w="265">y_true = np.eye(labels)[y_true]</text>
<text x="264" y="564" class="t-code" data-w="274">self.dinputs = -y_true / dvalues</text>
<text x="264" y="592" class="t-code" data-w="316">self.dinputs = self.dinputs / samples</text>
<path d="M40,280 L205,280" class="flow" marker-end="url(#nn-02-where-backprop-starts-arrow)"/>
<text x="124" y="268" text-anchor="middle" class="t-note" data-w="128"><tspan class="b">ŷ</tspan> (<tspan class="i">N</tspan>, <tspan class="i">K</tspan>) and <tspan class="mono">y_true</tspan></text>
<path d="M40,420 L205,420" class="flow" marker-end="url(#nn-02-where-backprop-starts-arrow)"/>
<text x="124" y="388" text-anchor="middle" class="t-note" data-w="132"><tspan class="b">ŷ</tspan> (<tspan class="i">N</tspan>, <tspan class="i">K</tspan>) as <tspan class="mono">dvalues</tspan>,</text>
<text x="84" y="408" class="t-note" data-w="26">and</text>
<text x="112" y="408" class="t-code" data-w="52">y_true</text>
<path d="M208,588 L43,588" class="s-purple w15 nofill" marker-end="url(#nn-02-where-backprop-starts-arrow-purple)"/>
<text x="40" y="576" class="t-code f-purple-ink" data-w="103">self.dinputs</text>
<text x="152" y="576" class="t-note" data-w="39">(<tspan class="i">N</tspan>, <tspan class="i">K</tspan>)</text>
<text x="40" y="616" class="t-note" data-w="137">to the softmax as its</text>
<text x="40" y="636" class="t-code" data-w="60">dvalues</text>
<path d="M784,280 L901,280" class="flow" marker-end="url(#nn-02-where-backprop-starts-arrow)"/>
<text x="844" y="268" text-anchor="middle" class="t-note" data-w="123">per-sample losses</text>
<text x="784" y="308" class="t-note" data-w="99">their mean is <tspan class="i">L</tspan></text>
<rect x="808" y="396" width="112" height="48" rx="8" class="w1 nofill s-ink-muted d-lead" data-fit="skip"/>
<text x="864" y="424" text-anchor="middle" class="t-note" data-w="51">nothing</text>
<text x="808" y="472" class="t-note" data-w="89">∂<tspan class="i">L</tspan>/∂<tspan class="i">L</tspan> = 1, so</text>
<text x="808" y="492" class="t-code" data-w="60">dvalues</text>
<text x="872" y="492" class="t-note" data-w="50">holds <tspan class="b">ŷ</tspan></text>
<text x="216" y="640" class="t-note" data-w="346">Nothing is cached: both inputs arrive as arguments.</text>
<path d="M576,636 H600" class="s-arrow w15 nofill"/>
<text x="608" y="640" class="t-label" data-w="103">forward: values</text>
<path d="M744,636 H768" class="s-purple w15 nofill"/>
<text x="776" y="640" class="t-label" data-w="136">backward: gradients</text>
<text x="40" y="684" class="t-note" data-w="602">Every other <tspan class="mono">backward</tspan> is handed a gradient from the right; the loss computes the first one.</text>
</svg>
