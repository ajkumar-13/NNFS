<text x="592" y="512" class="t-label">a different product, of shape (4, 4)</text>
<text x="592" y="584" class="t-label">in general:</text>
<text x="592" y="620" class="t-math">(<tspan class="f-green-ink"><tspan class="i">m</tspan></tspan>, <tspan class="f-purple-ink"><tspan class="i">n</tspan></tspan>) · (<tspan class="f-purple-ink"><tspan class="i">n</tspan></tspan>, <tspan class="f-green-ink"><tspan class="i">p</tspan></tspan>)  →  (<tspan class="f-green-ink"><tspan class="i">m</tspan></tspan>, <tspan class="f-green-ink"><tspan class="i">p</tspan></tspan>)</text>
<text x="40" y="684" class="t-note">Inner sizes, in purple, must be equal and are summed away; outer sizes, in green, form the result.</text>
