<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-03-shape-rule-title" aria-describedby="nn-03-shape-rule-desc">
<title id="nn-03-shape-rule-title">Inner sizes must match; outer sizes make the result</title>
<desc id="nn-03-shape-rule-desc">Two rows. Top, np.dot(A, B): A of shape (3, 4), holding 1 to 12 row by row, times B of shape (4, 3), holding 1 to 12 row by row, equals the 3 by 3 result 70, 80, 90; 158, 184, 210; 246, 288, 330. Row 1 of A and column 1 of B are outlined, 70 is bold, and the worked line reads 1 times 1 plus 2 times 4 plus 3 times 7 plus 4 times 10 equals 70. Bottom, np.dot(B, A): the same two matrices swapped give a 4 by 4 result, drawn without values. Under every grid its shape, with the inner sizes, the 4s in the top row and the 3s in the bottom row, in purple and the outer sizes in green. A last line states the rule in general: (m, n) times (n, p) gives (m, p).</desc>
