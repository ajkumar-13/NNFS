<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-three-forms-title" aria-describedby="nn-01-three-forms-desc">
<title id="nn-01-three-forms-title">One function, three forms: the shapes decide</title>
<desc id="nn-01-three-forms-desc">Three equations, one per form of np.dot, drawn neurons-first with the weights and inputs of section 8 and no bias: the two vector forms side by side at the top, each with its call, shapes and meaning under it, and the matrix form across the bottom with its text beside the result. Vector by vector, np.dot(w, x): the weights of neuron 1, 0.20, 0.80, minus 0.50, 1.00, as a row, meet sample 1, 1.0, 2.0, 3.0, 2.5, as a column, and give the scalar 2.800; shapes (4,) and (4,), one neuron and one sample. Matrix by vector, np.dot(W, x): the 3 by 4 weight matrix, rows 0.20, 0.80, minus 0.50, 1.00; 0.50, minus 0.91, 0.26, minus 0.50; minus 0.26, minus 0.27, 0.17, 0.87, meets the same column and gives the column 2.800, minus 1.790, 1.885; shapes (3, 4) and (4,) give (3,), a layer of 3 neurons on one sample. Matrix by matrix, np.dot(W, X.T): the same weights meet a 4 by 3 matrix whose columns are labelled samples 1 to 3 and give a 3 by 3 result with one column per sample, rows 2.800, 6.900, minus 0.590; minus 1.790, minus 4.810, minus 1.949; 1.885, minus 0.300, minus 0.474; shapes (3, 4) and (4, 3) give (3, 3). Row 1 of the weights and column 1 of the samples are outlined, and 2.800 is bold in every result. A caption line says every form sums over the 4 inputs.</desc>
