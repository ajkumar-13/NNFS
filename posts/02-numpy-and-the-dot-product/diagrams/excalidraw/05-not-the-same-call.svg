<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">np.dot, element-wise multiply, and matmul are three different calls</title>
  <desc id="d">Three hand-drawn cards separating calls that look alike. The first, np.dot of A and B, is a contraction: m by n dotted with n by p gives m by p, summing over the shared axis, whose inner dimensions must be equal and then vanish; this is the layer call. The second, A star B, is element-wise: m by n times m by n gives m by n, multiplying position by position with nothing summed, and it is circled and labelled shape in equals shape out because it is the only one of the three that contracts nothing; it is never a layer call. The third, A at B, is matmul: identical to np.dot at one and two dimensions, but broadcasting leading axes at rank three and above. A band at the bottom notes that every array in this series is at most two-dimensional so np.dot and the at operator agree throughout, and that reaching for star where np.dot belongs returns an array of the wrong shape rather than an error, which is why the mistake survives to training time.</desc>

