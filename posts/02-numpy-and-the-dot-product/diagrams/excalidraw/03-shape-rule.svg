<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">The shape rule for matrix multiplication: inner dimensions match, outer dimensions survive</title>
  <desc id="d">A hand-drawn statement of the shape rule for np.dot. The generic expression m by n dotted with n by p giving m by p is written large across the top. Two cards below split it: the inner pair, the two n values, must be equal or the call raises, and they are summed over so they do not appear in the result; the outer pair, m and p, are never compared and never summed, and pass straight through to become the result shape. A worked example underneath reads three by four dotted with four by three giving three by three, with the two fours tinted and joined by a dashed link labelled equal and contracted away. A band at the bottom states the rule in one sentence: inner dimensions match, outer dimensions become the result, and notes that a one-dimensional vector counts as a row on the left of the call and a column on the right.</desc>

