<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-04-batch-transpose-title" aria-describedby="nn-04-batch-transpose-desc">
<title id="nn-04-batch-transpose-title">The transpose lets a batch meet the weights</title>
<desc id="nn-04-batch-transpose-desc">Section 8's batch, samples-first. Top left, the stored weights, shape (3, 4), one row per neuron: 0.20, 0.80, minus 0.50, 1.00; 0.50, minus 0.91, 0.26, minus 0.50; minus 0.26, minus 0.27, 0.17, 0.87. An arrow labelled transpose leads to weights.T, shape (4, 3), one column per neuron. Under the transpose sits the bias row 2.0, 3.0, 0.5, added to every row, and under that the outputs, shape (3, 3): 4.800, 1.210, 2.385; 8.900, minus 1.810, 0.200; 1.410, 1.051, 0.026. Left of the outputs are the inputs, shape (3, 4), one row per sample: 1.0, 2.0, 3.0, 2.5; 2.0, 5.0, minus 1.0, 2.0; minus 1.5, 2.7, 3.3, minus 0.8. The row of sample 1 and the column of neuron 1 are outlined and meet in the output cell 4.800, which is bold; the worked line reads 1.0 times 0.20 plus 2.0 times 0.80 plus 3.0 times minus 0.50 plus 2.5 times 1.00, plus the bias 2.0, equals 4.800. A note says that without the transpose, np.dot(inputs, weights) pairs (3, 4) with (3, 4), the 4 meets a 3, and NumPy raises ValueError.</desc>
