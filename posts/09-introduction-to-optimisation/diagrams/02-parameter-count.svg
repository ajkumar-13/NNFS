<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">The twenty-one parameters, and why random search cannot find them</title>
  <desc id="d">A hand-drawn figure in two halves. The left card draws every parameter in the network as a grid of cells: W1 of shape two by three holding six weights, b1 of shape one by three holding three biases, W2 of shape three by three holding nine weights, and b2 of shape one by three holding three biases, totalling twenty-one parameters. The right card gives the scaling argument in three rows: this network at twenty-one parameters, where a hundred thousand random draws moved the loss by four thousandths; a small ResNet at around ten million, where the same search runs in ten million dimensions; and GPT-3 at a hundred and seventy-five billion, where the same update rule still has to work. A band states that random search has to land in a good region by luck and that region is a vanishing fraction of the space, that doubling the draws does not double the odds, and that knowing which way is downhill before stepping is what replaces the luck.</desc>

