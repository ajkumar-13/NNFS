    --nn-blue-ink: #005A8C;
    --nn-blue-soft: #E3F0F8;
    --nn-blue-line: #9CC6E0;
    --nn-orange: #C98500;
    --nn-orange-ink: #8A5B00;
    --nn-orange-soft: #FBF0D9;
    --nn-orange-line: #E5C27A;
    --nn-green: #008F68;
    --nn-green-ink: #006B4E;
