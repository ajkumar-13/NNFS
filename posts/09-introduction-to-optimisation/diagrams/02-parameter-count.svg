    --nn-bg: #FAFAF7;
    --nn-surface: #FFFFFF;
    --nn-ink: #1A1A1A;
    --nn-ink-muted: #5C5C5C;
    --nn-ink-subtle: #9A9A9A;
    --nn-border: #D9D9D4;
    --nn-primary: #5B7FBF;
