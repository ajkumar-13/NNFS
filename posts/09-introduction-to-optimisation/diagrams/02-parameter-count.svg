<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-parameter-count-title" aria-describedby="nn-02-parameter-count-desc">
<title id="nn-02-parameter-count-title">Every parameter is one number to move</title>
<desc id="nn-02-parameter-count-desc">Top: the 21 parameters of the network with 3 hidden neurons, one cell each, in their array shapes: W1 of shape (2, 3), 6 weights; b1 of shape (1, 3), 3 biases; W2 of shape (3, 3), 9 weights; b2 of shape (1, 3), 3 biases; 6 plus 3 plus 9 plus 3 is 21. Bottom: both networks as bars on one axis from 0 to 400 parameters. With 3 hidden neurons the bar is 21 long; with 64 it is 387: 128 weights in W1, 64 biases in b1, 192 weights in W2 and 3 biases in b2. If every parameter had to land in the right half of its range, one random draw would succeed with chance 1 in 2,097,152 for 21 parameters and about 3 times 10 to the minus 117 for 387.</desc>
<style>
