<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-03-learning-rate-title" aria-describedby="nn-03-learning-rate-desc">
<title id="nn-03-learning-rate-title">Too small crawls, too large bounces or diverges</title>
<desc id="nn-03-learning-rate-desc">Four small charts of the loss f(w) = w squared for w from minus 6 to 6, each with the start w = 5 and the first three steps of gradient descent drawn as dots on the curve joined by straight jumps, and w after 100 steps as a ring. Learning rate 0.001: the dots 5, 4.99, 4.98, 4.97 sit on top of one another, and after 100 steps w is 4.093. Learning rate 0.1: w goes 5, 4, 3.2, 2.56 down the right side of the valley and is 1.019 times 10 to the minus 9 after 100 steps. Learning rate 1: w jumps between 5 and minus 5 at loss 25, and is 5 again after 100 steps. Learning rate 10: the first jump leaves the chart, to minus 95 and then 1,805, and w is 3.753 times 10 to the 128 after 100 steps.</desc>
