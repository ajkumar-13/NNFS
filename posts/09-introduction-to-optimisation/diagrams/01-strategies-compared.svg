<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-strategies-compared-title" aria-describedby="nn-01-strategies-compared-desc">
<title id="nn-01-strategies-compared-title">Only gradient descent uses the 387 parameters</title>
<desc id="nn-01-strategies-compared-desc">A dot chart of the final loss on the spiral data after 10,000 iterations from the same start, on a loss axis from 0.85 to 1.10, with a dotted line at ln 3, 1.0986, the loss of a uniform guess. With 21 parameters: random selection's best draw 1.0981; random perturbation, the printed run 1.0435 and 20 other streams of nudges, one tick each in a band, from 1.0321 to 1.0793, median 1.0684; gradient descent 1.0776 at learning rate 1 and 1.0797 at 0.1. With 387 parameters: random perturbation, the printed run 1.0730 and 20 streams from 1.0442 to 1.0666, median 1.0595; gradient descent 0.8737 at learning rate 1 and 1.0226 at 0.1.</desc>
<style>
