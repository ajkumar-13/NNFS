<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-loss-vs-accuracy-title" aria-describedby="nn-03-loss-vs-accuracy-desc">
<title id="nn-03-loss-vs-accuracy-title">Same accuracy, different loss</title>
<desc id="nn-03-loss-vs-accuracy-desc">Two panels, each a batch of three softmax rows with true classes 0, 1 and 1, the true-class cell outlined and a bar per sample for its loss on one shared scale, with a solid bar for the mean and a row of three solid squares, one per correctly predicted sample. Left, the worked batch of section 4: softmax rows 0.70, 0.10, 0.20; 0.10, 0.50, 0.40; 0.02, 0.90, 0.08, on the true classes 0.70, 0.50, 0.90, per-sample losses 0.357, 0.693, 0.105, accuracy 1.000 (3 of 3) and mean loss 0.385. Right, a confident batch: softmax rows 0.95, 0.03, 0.02; 0.02, 0.96, 0.02; 0.01, 0.97, 0.02, on the true classes 0.95, 0.96, 0.97, per-sample losses 0.051, 0.041, 0.030, accuracy 1.000 (3 of 3) and mean loss 0.041. The caption gives the ratio of the means, 9.4.</desc>
