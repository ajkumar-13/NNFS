<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-cross-entropy-curve-title" aria-describedby="nn-01-cross-entropy-curve-desc">
<title id="nn-01-cross-entropy-curve-title">The loss is the negative log of the true-class probability</title>
<desc id="nn-01-cross-entropy-curve-desc">A line chart of the loss minus log p against the probability p on the true class, p from 0.01 to 1. The curve falls from 4.605 at p = 0.01 through 2.303 at 0.10 and 0.693 at 0.50 to 0 at p = 1. A blue diamond marks p = 1/3, the uniform guess over three classes, at ln 3 = 1.099. Two shaded steps of the same width in p: from 0.01 to 0.10 the loss falls by 2.303, from 0.90 to 0.99 by 0.095. A dashed straight line, 1 minus p, falls by 0.09 on each step. The caption adds that at the clip bound p = 10 to the minus 7 the loss is 16.118.</desc>
