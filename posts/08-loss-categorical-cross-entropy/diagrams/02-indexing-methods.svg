<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-02-indexing-methods-title" aria-describedby="nn-02-indexing-methods-desc">
<title id="nn-02-indexing-methods-title">Two label formats, one vector of true-class probabilities</title>
<desc id="nn-02-indexing-methods-desc">Two rows on the worked batch of softmax outputs 0.70, 0.10, 0.20; 0.10, 0.50, 0.40; 0.02, 0.90, 0.08. Top, integer labels: class_targets 0, 1, 1 picks row 0 column 0, row 1 column 1 and row 2 column 1, the cells outlined. Bottom, one-hot labels: the rows 1, 0, 0; 0, 1, 0; 0, 1, 0 times the softmax outputs element by element give 0.70, 0.00, 0.00; 0.00, 0.50, 0.00; 0.00, 0.90, 0.00. Both paths end in the same correct_confidences 0.70, 0.50, 0.90; minus log of it gives the losses 0.357, 0.693, 0.105 and the mean 0.385.</desc>
