<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-05-leakage-title" aria-describedby="nn-05-leakage-desc">
<title id="nn-05-leakage-title">Selecting features before the split finds signal in noise</title>
<desc id="nn-05-leakage-desc">Three rows on an accuracy axis from 0.3 to 1.0 with a dotted line at 0.5, chance on these random labels; each row is a band over ten seeds with a tick per seed and a dot at the mean. 5-fold cross-validation with the 20 features selected on all 100 rows: 0.82 to 0.92, mean 0.887. Selected inside each fold on its 80 training rows: 0.38 to 0.62, mean 0.523. The leaky pipeline's model on 2,000 new rows: 0.49 to 0.52, mean 0.503.</desc>
