<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-04-learning-rates-over-seeds-title" aria-describedby="nn-04-learning-rates-over-seeds-desc">
<title id="nn-04-learning-rates-over-seeds-title">Large gaps hold in every seed; 0.05 against 0.1 does not</title>
<desc id="nn-04-learning-rates-over-seeds-desc">Seven rows, each a band over seeds 0 to 4 of the 5-fold mean accuracy on the spiral, with a tick per seed and a dot for seed 0, on an axis from 0.3 to 0.85 with a dotted line at 0.333, guessing among three classes. Learning rate 0.01: 0.640 to 0.730, seed 0 0.720; learning rate 0.05: 0.603 to 0.770, seed 0 0.770; learning rate 0.1: 0.713 to 0.797, seed 0 0.773; learning rate 0.5: 0.350 to 0.453, seed 0 0.423; learning rate 1.0: 0.343 to 0.403, seed 0 0.347; learning rate 0.05 with 16 neurons: 0.423 to 0.537, seed 0 0.537; learning rate 0.1 with 16 neurons: 0.423 to 0.517, seed 0 0.423. 64 hidden neurons unless the row says 16. The highest mean of a seed is 0.1 in four seeds and 0.05 in one.</desc>
<style>
