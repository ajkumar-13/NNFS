<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-test-set-tuning-title" aria-describedby="nn-02-test-set-tuning-desc">
<title id="nn-02-test-set-tuning-title">Picking the best test score reports too high a number</title>
<desc id="nn-02-test-set-tuning-desc">A dot plot, one row per seed 0 to 4, of the mean over 200 test sets of the reported test accuracy minus the accuracy on 30,000 further points, in percentage points, for eight learning rates trained on 300 points. Chosen by test accuracy on test sets of 60 points: 3.29, 2.86, 4.74, 5.02, 3.68; on test sets of 300 points: 0.53, 0.05, 1.24, 1.82, 0.62; chosen on one set and reported on the next: 0.02, −0.21, 0.15, 0.11, −0.18. A dotted line marks zero.</desc>
