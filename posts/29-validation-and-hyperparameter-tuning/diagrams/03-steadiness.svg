<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-03-steadiness-title" aria-describedby="nn-03-steadiness-desc">
<title id="nn-03-steadiness-title">One split of 60 swings; the mean of five swings less</title>
<desc id="nn-03-steadiness-desc">Eight rows, shuffles 0 to 7 of the same 300 points of seed 0, learning rate 0.1 and the same initial weights. Each row is a band over its five fold accuracies, with a tick per fold and a dot at their mean: shuffle 0: 0.717 to 0.817, mean 0.773; shuffle 1: 0.733 to 0.833, mean 0.780; shuffle 2: 0.667 to 0.883, mean 0.773; shuffle 3: 0.600 to 0.850, mean 0.737; shuffle 4: 0.750 to 0.867, mean 0.783; shuffle 5: 0.717 to 0.867, mean 0.800; shuffle 6: 0.633 to 0.800, mean 0.723; shuffle 7: 0.683 to 0.783, mean 0.743. A last row is a band over the eight means, 0.723 to 0.800. The 40 single folds have a standard deviation of 0.064, the eight means one of 0.025, a ratio of 2.59.</desc>
