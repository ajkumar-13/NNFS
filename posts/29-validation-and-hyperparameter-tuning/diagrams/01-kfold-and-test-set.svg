<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-kfold-and-test-set-title" aria-describedby="nn-01-kfold-and-test-set-desc">
<title id="nn-01-kfold-and-test-set-title">Every point validates once; the test set is read once</title>
<desc id="nn-01-kfold-and-test-set-desc">Five rows, folds 1 to 5, each a strip of the five parts A to E of the 300 shuffled spiral points of seed 0, 60 points each. In fold i part i, in blue, is the validation part and the other four, 240 points, train a new network with learning rate 0.1 and 64 hidden neurons. The validation accuracies are 0.800, 0.817, 0.717, 0.800, 0.733, mean 0.773. A sixth row, the final model, trains on all 300 points (training accuracy 0.927) and is then scored once on the test set, 300 further points that no step of the search used: 0.793, 238 of 300.</desc>
