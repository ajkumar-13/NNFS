<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-last-epochs-per-seed-title" aria-describedby="nn-01-last-epochs-per-seed-desc">
<title id="nn-01-last-epochs-per-seed-title">Decay removes the jumps but mostly ends higher</title>
<desc id="nn-01-last-epochs-per-seed-desc">For seeds 0 to 4, two rows each: the constant rate, d = 0, in grey and decay d = 10 to the minus 3 in blue, on a loss axis from 0.3 to 2.7. Each row is a band from the lowest to the highest loss of the last 1,000 of the 10,001 epochs, a tick at their mean and a dot at the loss of epoch 10,000. Constant rate: seed 0 0.835 to 0.933, mean 0.8703, final 0.8737; seed 1 0.483 to 1.231, mean 0.5880, final 0.5091; seed 2 0.793 to 1.326, mean 0.8905, final 0.9906; seed 3 0.352 to 2.636, mean 0.4159, final 0.3943; seed 4 0.483 to 1.461, mean 0.5842, final 0.4843. Decay: seed 0 0.761 to 0.782, mean 0.7714, final 0.7612; seed 1 0.733 to 0.763, mean 0.7486, final 0.7335; seed 2 0.911 to 0.934, mean 0.9222, final 0.9107; seed 3 0.731 to 0.766, mean 0.7500, final 0.7310; seed 4 0.775 to 0.797, mean 0.7867, final 0.7750. A column gives the largest one-step rise of the loss: 0.0553, 0.2879, 0.2551, 1.1043 and 0.3507 with the constant rate, 0.0152, 0.0002, 0.0000, 0.0099 and 0.0017 with decay, a column repeats the mean loss, and a column gives the band width: 0.098, 0.748, 0.533, 2.283 and 0.978 with the constant rate, 0.021, 0.030, 0.023, 0.035 and 0.022 with decay. A key explains the band, the tick and the dot, and that grey is d = 0 and blue is d = 10 to the minus 3.</desc>
