<text x="40" y="76" class="t-subtitle" data-w="697">Five runs of 10,001 epochs with <tspan class="i">d</tspan> = 10<tspan class="sub" dy="-6">−2</tspan><tspan dy="6">​</tspan>, then 3,000 more epochs on the same network at <tspan class="i">α</tspan> = 1.</text>
