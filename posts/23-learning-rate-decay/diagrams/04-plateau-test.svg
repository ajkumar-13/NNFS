<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-04-plateau-test-title" aria-describedby="nn-04-plateau-test-desc">
<title id="nn-04-plateau-test-title">Restoring the rate ends the plateau on every seed</title>
<desc id="nn-04-plateau-test-desc">A dot chart, one row per seed 0 to 4, on a loss axis from 0.7 to 1.15 with a dotted line at ln 3 = 1.0986. A hollow circle marks the loss after 10,001 epochs with decay 10 to the minus 2, a diamond the loss of the same network after 3,000 more epochs at a constant rate of 1, joined by a line. Seed 0: 1.0725 to 0.9548, accuracy 39.7 to 53.3 percent. Seed 1: 1.0539 to 0.8449, 44.0 to 54.7. Seed 2: 1.0636 to 0.9019, 46.3 to 56.7. Seed 3: 1.0636 to 0.7486, 42.0 to 59.7. Seed 4: 1.0457 to 0.7384, 46.3 to 63.7. The caption gives the gradient length at the plateaus, 0.0030 to 0.0094.</desc>
<style>
