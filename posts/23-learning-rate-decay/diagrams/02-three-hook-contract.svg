ont-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--nn-ink-subtle)">recompute α</text><text xml:space="preserve" x="430" y="324.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-accent)">G += g², then θ −= α · g / √(G+ε)</text><text xml:space="preserve" x="800" y="323.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--nn-ink-subtle)">t += 1</text><path d="M50.08 339.88C264.4 340.27 479.03 340.16 906.21 339.76M49.99 340.01C348.78 339.84 647.4 339.73 906.02 339.88" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="56" y="358.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-accent)">RMSProp · Part 26</text><text xml:space="preserve" x="240" y="357.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--nn-ink-subtle)">recompute α</text><text xml:space="preserve" x="430" y="358.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-accent)">EMA of g², then θ −= α · g / √(E+ε)</text><text xml:space="preserve" x="800" y="357.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--nn-ink-subtle)">t += 1</text><path d="M49.76 373.76C245.73 374.92 441.35 375.1 906.16 373.82M49.88 373.98C372.78 372.89 695.57 372.99 905.91 373.97" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="56" y="392.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-success)">Adam · Part 27</text><text xml:space="preserve" x="240" y="391.2" text-a