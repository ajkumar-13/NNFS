<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">The three-hook optimiser contract, shared by every optimiser in the series</title>
  <desc id="d">A hand-drawn figure. Along the top, the three methods in call order: pre_update_params once per step, update_params once per trainable layer, and post_update_params once per step. Below, a six-row table with one row per optimiser. Vanilla SGD from Part 22 does nothing in pre or post and subtracts alpha times the gradient in update. SGD with decay from Part 23 recomputes alpha in pre, keeps the same update, and increments the counter in post. Momentum, AdaGrad, RMSProp and Adam all repeat that same pre and post, and differ only in the update column: momentum updates a velocity, AdaGrad accumulates squared gradients and divides by their root, RMSProp uses an exponential moving average of the same, and Adam keeps moving averages of both the gradient and its square with a bias correction. The update column is headed as the only column that moves, and dashed rules separate it from the two that do not. A band notes that the training loop is written once and never edited again, and that PyTorch, TensorFlow and Optax all separate the same three concerns.</desc>

