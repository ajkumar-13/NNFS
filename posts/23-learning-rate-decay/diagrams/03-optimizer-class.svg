<g data-grid="skip">
<rect x="40" y="175" width="280" height="56" rx="4" class="f-neutral-soft"/>
<rect x="40" y="175" width="280" height="56" rx="4" class="w1 nofill s-border" data-fit="skip"/>
<g data-grid="skip">
<text x="52" y="196" class="t-code" data-w="223">optimizer = Optimizer_SGD(</text>
<text x="60" y="220" class="t-code" data-w="257">learning_rate=1.0, decay=1e-3)</text>
</g>
