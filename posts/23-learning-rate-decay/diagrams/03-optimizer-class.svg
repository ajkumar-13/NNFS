<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="673">The rate is set once per step and applied once per layer</text>
<text x="40" y="76" class="t-subtitle" data-w="708">The class of section 4 with the symbols of section 2, and the calls the loop of section 5 makes to it.</text>
<rect x="360" y="104" width="560" height="484" rx="8" class="card"/>
<text x="376" y="136" class="t-code" data-w="171">class Optimizer_SGD:</text>
<text x="392" y="184" class="t-code" data-w="419">def __init__(self, learning_rate=1.0, decay=0.0):</text>
<text x="408" y="208" class="t-code" xml:space="preserve" data-w="359">self.learning_rate         = learning_rate</text>
<text x="408" y="232" class="t-code" data-w="359">self.current_learning_rate = learning_rate</text>
<text x="408" y="256" class="t-code" xml:space="preserve" data-w="291">self.decay                 = decay</text>
<text x="408" y="280" class="t-code" xml:space="preserve" data-w="257">self.iterations            = 0</text>
<text x="392" y="328" class="t-code" data-w="240">def pre_update_params(self):</text>
<text x="408" y="352" class="t-code" data-w="120">if self.decay:</text>
<text x="424" y="376" class="t-code" data-w="436">self.current_learning_rate = self.learning_rate / \</text>
<text x="440" y="400" class="t-code" data-w="308">(1.0 + self.decay * self.iterations)</text>
<text x="392" y="448" class="t-code" data-w="265">def update_params(self, layer):</text>
<text x="408" y="472" class="t-code" data-w="513"><tspan class="mono f-orange-ink">layer.weights</tspan><tspan class="mono"> -= self.current_learning_rate * </tspan><tspan class="mono f-purple-ink">layer.dweights</tspan></text>
<text x="408" y="496" class="t-code" xml:space="preserve" data-w="504"><tspan class="mono f-orange-ink">layer.biases</tspan><tspan class="mono">  -= self.current_learning_rate * </tspan><tspan class="mono f-purple-ink">layer.dbiases</tspan></text>
<text x="392" y="544" class="t-code" data-w="248">def post_update_params(self):</text>
<text x="408" y="568" class="t-code" data-w="171">self.iterations += 1</text>
<text x="896" y="208" text-anchor="end" class="t-label" data-w="17"><tspan class="i">α</tspan><tspan class="sub" dy="4">0</tspan><tspan dy="-4">​</tspan></text>
<text x="896" y="232" text-anchor="end" class="t-label" data-w="14"><tspan class="i">α</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan></text>
<text x="896" y="256" text-anchor="end" class="t-label" data-w="9"><tspan class="i">d</tspan></text>
<text x="896" y="280" text-anchor="end" class="t-label" data-w="5"><tspan class="i">t</tspan></text>
