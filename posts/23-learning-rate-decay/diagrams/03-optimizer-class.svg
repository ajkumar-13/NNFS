<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-03-optimizer-class-title" aria-describedby="nn-03-optimizer-class-desc">
<title id="nn-03-optimizer-class-title">The rate is set once per step and applied once per layer</title>
<desc id="nn-03-optimizer-class-desc">A card with the class Optimizer_SGD of section 4. The constructor sets learning_rate, alpha_0, current_learning_rate, alpha_t, decay, d, and iterations, t, to 0. pre_update_params computes current_learning_rate = learning_rate / (1.0 + decay * iterations). update_params subtracts current_learning_rate times layer.dweights from layer.weights and times layer.dbiases from layer.biases, parameters in orange and gradients in purple. post_update_params adds 1 to iterations. On the left, arrows run from the calls of the training loop to the methods: the constructor once before the loop, then in every step pre_update_params once, update_params twice, for dense1 and dense2, and post_update_params once.</desc>
