<text x="40" y="292" class="t-note" data-w="162">every step, in this order:</text>
<text x="40" y="164" class="t-note" data-w="148">once, before the loop:</text>
<rect x="360" y="616" width="16" height="16" class="f-orange s-orange w1"/>
<text x="392" y="628" class="t-label" data-w="77">parameters</text>
<rect x="496" y="616" width="16" height="16" class="f-purple s-purple w1"/>
<text x="528" y="628" class="t-label" data-w="63">gradients</text>
<text x="624" y="628" class="t-label" data-w="140">optimiser state in ink</text>
<text x="40" y="684" class="t-note" data-w="518">Every layer of a step reads the same <tspan class="i">α</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan>; the counter moves after the last one.</text>
</svg>
