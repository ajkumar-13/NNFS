<text x="40" y="48" class="t-title" data-w="503">Everything after this series is an addition</text>
<text x="40" y="76" class="t-subtitle" data-w="706">What sections 2 to 4 add to the forward pass, backward pass and optimiser step of posts 01 to 34.</text>
<text x="40" y="136" class="t-head" data-w="130">New layer types</text>
<rect x="40" y="152" width="264" height="148" rx="8" class="card"/>
<text x="52" y="180" class="t-head" data-w="167">Convolutional layers</text>
<text x="52" y="204" class="t-label" data-w="176">one filter's weights reused</text>
<text x="52" y="224" class="t-label" data-w="171">at every position of a grid</text>
<text x="52" y="256" class="t-note" data-w="128">LeCun et al. (1998)</text>
<text x="52" y="276" class="t-code" data-w="137">cnn-from-scratch</text>
<rect x="40" y="312" width="264" height="148" rx="8" class="card"/>
<text x="52" y="340" class="t-head" data-w="135">Recurrent layers</text>
<text x="52" y="364" class="t-label" data-w="196">one layer's weights reused at</text>
<text x="52" y="384" class="t-label" data-w="235">every timestep, with a carried state</text>
<text x="52" y="416" class="t-note" data-w="239">Hochreiter and Schmidhuber (1997)</text>
<text x="52" y="436" class="t-code" data-w="137">rnn-from-scratch</text>
<rect x="40" y="472" width="264" height="148" rx="8" class="card"/>
<text x="52" y="500" class="t-head" data-w="223">Attention and transformers</text>
<text x="52" y="524" class="t-label" data-w="220">every position reads every other,</text>
<text x="52" y="544" class="t-label" data-w="217">weighted by a softmax of scores</text>
<text x="52" y="576" class="t-note" data-w="140">Vaswani et al. (2017)</text>
<text x="52" y="596" class="t-note" data-w="172">Karpathy, Let's build GPT</text>
<text x="328" y="136" class="t-head" data-w="221">New training infrastructure</text>
<rect x="328" y="152" width="296" height="84" rx="8" class="card"/>
<text x="340" y="176" class="t-head" data-w="116">Normalisation</text>
<text x="340" y="200" class="t-label" data-w="134">activations rescaled</text>
<text x="340" y="224" class="t-note" data-w="169">Ioffe and Szegedy (2015)</text>
<rect x="328" y="248" width="296" height="84" rx="8" class="card"/>
<text x="340" y="272" class="t-head" data-w="176">Residual connections</text>
<text x="340" y="296" class="t-label" data-w="252">adds the input of a block to its output</text>
<text x="340" y="320" class="t-note" data-w="103">He et al. (2016)</text>
<rect x="328" y="344" width="296" height="84" rx="8" class="card"/>
<text x="340" y="368" class="t-head" data-w="198">Learning-rate schedules</text>
<text x="340" y="392" class="t-label" data-w="127">another formula in </text>
<g data-grid="skip">
<text x="460" y="392" class="t-code" data-w="146">pre_update_params</text>
</g>
<text x="340" y="416" class="t-note" data-w="194">Loshchilov and Hutter (2017)</text>
<rect x="328" y="440" width="296" height="84" rx="8" class="card"/>
<text x="340" y="464" class="t-head" data-w="130">Mixed precision</text>
<text x="340" y="488" class="t-label" data-w="265">forward and backward passes in 16 bits</text>
<text x="340" y="512" class="t-note" data-w="165">Micikevicius et al. (2018)</text>
<rect x="328" y="536" width="296" height="84" rx="8" class="card"/>
<text x="340" y="560" class="t-head" data-w="160">Distributed training</text>
<text x="340" y="584" class="t-label" data-w="262">every device holds a copy of the model</text>
<text x="340" y="608" class="t-code" data-w="197">DistributedDataParallel</text>
<text x="648" y="136" class="t-head" data-w="186">New problem framings</text>
<rect x="648" y="152" width="272" height="84" rx="8" class="card"/>
<text x="660" y="176" class="t-head" data-w="199">Self-supervised learning</text>
<text x="660" y="200" class="t-label" data-w="199">takes its labels from the input</text>
<text x="660" y="224" class="t-note" data-w="251">BERT, GPT-2, Masked Autoencoders</text>
<rect x="648" y="248" width="272" height="84" rx="8" class="card"/>
<text x="660" y="272" class="t-head" data-w="139">Transfer learning</text>
<text x="660" y="296" class="t-label" data-w="139">a pretrained network</text>
<text x="660" y="320" class="t-note" data-w="149">LoRA (Hu et al., 2022)</text>
<rect x="648" y="344" width="272" height="84" rx="8" class="card"/>
<text x="660" y="368" class="t-head" data-w="191">Reinforcement learning</text>
<text x="660" y="392" class="t-label" data-w="249">no labels; reward-weighted gradients</text>
<text x="660" y="416" class="t-note" data-w="162">Sutton and Barto (2018)</text>
<rect x="648" y="440" width="272" height="84" rx="8" class="card"/>
<text x="660" y="464" class="t-head" data-w="140">Diffusion models</text>
<text x="660" y="488" class="t-label" data-w="142">a denoising objective</text>
<text x="660" y="512" class="t-note" data-w="182">Ho, Jain and Abbeel (2020)</text>
<rect x="648" y="536" width="272" height="84" rx="8" class="w1 nofill s-ink-muted d-lead" data-fit="skip"/>
<text x="660" y="572" class="t-note" data-w="170">The networks, losses and</text>
<text x="660" y="592" class="t-note" data-w="107">optimisers stay.</text>
<text x="40" y="684" class="t-note" data-w="611">Under each name: what it adds, then where to read; layer cards add a from-scratch tutorial.</text>
