<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-whats-next-map-title" aria-describedby="nn-01-whats-next-map-desc">
<title id="nn-01-whats-next-map-title">Everything after this series is an addition</title>
<desc id="nn-01-whats-next-map-desc">Three columns of cards. New layer types: convolutional layers, one filter's weights reused at every position of a grid, LeCun et al. (1998) and cnn-from-scratch; recurrent layers, one layer's weights reused at every timestep with a carried state, Hochreiter and Schmidhuber (1997) and rnn-from-scratch; attention and transformers, every position reads every other weighted by a softmax of scores, Vaswani et al. (2017) and Karpathy's Let's build GPT. New training infrastructure: normalisation, activations rescaled, Ioffe and Szegedy (2015); residual connections, adds the input of a block to its output, He et al. (2016); learning-rate schedules, another formula in pre_update_params, Loshchilov and Hutter (2017); mixed precision, forward and backward passes in 16 bits, Micikevicius et al. (2018); distributed training, every device holds a copy of the model, DistributedDataParallel. New problem framings: self-supervised learning, takes its labels from the input, BERT, GPT-2 and Masked Autoencoders; transfer learning, a pretrained network, LoRA (Hu et al., 2022); reinforcement learning, no labels and reward-weighted gradients, Sutton and Barto (2018); diffusion models, a denoising objective, Ho, Jain and Abbeel (2020); and a dashed slot: the networks, losses and optimisers stay.</desc>
