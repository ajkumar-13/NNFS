<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-02-the-skeleton-is-fixed-title" aria-describedby="nn-02-the-skeleton-is-fixed-desc">
<title id="nn-02-the-skeleton-is-fixed-title">A layer answers two calls, an optimiser three</title>
<desc id="nn-02-the-skeleton-is-fixed-desc">Three columns. Left, a card Any layer: forward stores its output; backward receives dvalues and stores dinputs, both in the gradient colour; built in this series: Layer_Dense, ReLU, softmax, the sigmoid, dropout; after it: convolution, recurrence, attention, normalisation. Centre, one step of the loop of post 22 as five boxes joined by downward arrows: forward of every layer in order, backward of every layer, pre_update_params(), update_params(layer) for every layer with parameters, post_update_params(). Arrows run from the first two boxes to the layer card's two methods and from the last three to the three methods of the right card, Any optimiser, which lists gradient descent, decay, momentum, AdaGrad, RMSProp and Adam, and notes that a schedule is another formula in pre_update_params. Below, three things do change (section 8): a layer with shared weights sums gradient contributions inside its backward; training and evaluation modes, for dropout and batch normalisation, through a training argument; carried state, which a recurrent layer resets between unrelated sequences.</desc>
