<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Why nothing on the reading list requires starting again</title>
  <desc id="d">A hand-drawn figure with the training loop in the centre, labelled unchanged since Part 21, listing the epoch and batch loops, the forward pass, the loss, the backward pass and the optimiser’s three hooks, with a note that nothing in it needs editing. A card on the left, headed any layer and giving the interface as a forward taking x and a backward taking dvalues, lists what is already built — Dense, ReLU, Sigmoid, Softmax and Dropout — and what comes after: convolution, LSTM, GRU, attention, batch normalisation, and anything with those two methods. A card on the right, headed any optimiser and giving the interface as pre, update and post, lists SGD through Adam as built and AdamW, Lion, Adafactor, warmup and cosine schedules as what follows, being anything with those three hooks. Arrows run from both cards into the loop. A band states that a transformer block is a forward and a backward and AdamW is three hooks, that neither needs a line of the loop to move, and that this is what the twenty-one parameters of Part 09 grew into: not a finished model but the frame everything else is written against.</desc>

