<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-weights-shared-across-positions-title" aria-describedby="nn-03-weights-shared-across-positions-desc">
<title id="nn-03-weights-shared-across-positions-title">Each new layer reuses one set of weights</title>
<desc id="nn-03-weights-shared-across-positions-desc">Three panels. Convolution: a 28 by 28 grid of the 784 pixels with one 5 by 5 filter shaded orange at two positions, the same 25 weights at both; a table: a dense layer from 784 to 128 has 100,480 parameters, 8 filters of 5 by 5 have 208. Recurrence: three steps, each input x1, x2, x3 in blue feeding a hidden state h1, h2, h3 through W_x, and each hidden state feeding the next through W_h, orange arrows with the same labels at every step; a table: with 10 features and 64 hidden units, 4,800 parameters for 5 steps and 4,800 for 500. Attention: a 6 by 6 grid of scores, one per pair of positions, one row shaded green as one row-wise softmax; a table: 100 positions give 10,000 scores and 1,000 positions give 1,000,000. A shared weight's gradient is the sum of the contributions from every position.</desc>
