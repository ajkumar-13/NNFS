<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-draw-order-title" aria-describedby="nn-02-draw-order-desc">
<title id="nn-02-draw-order-title">When the test points are drawn decides what they are</title>
<desc id="nn-02-draw-order-desc">Three rows, one per order of the calls after np.random.seed(0); each block is as wide as the normal draws it takes. Documented order: training data draws 1 to 300, the weights of the two layers 301 to 620 (128 + 192), the training loop no draws, the test data 621 to 920; gap 14.00 points. Seed set again before the test draw: the test data takes draws 1 to 300 again and is the training set; gap 0.00 points. Test data drawn before the layers: test data 301 to 600, weights 601 to 920, so a different network is trained; train 97.33, test 78.67, gap 18.67 points. A short rule in each row marks the training loop.</desc>
<style>
