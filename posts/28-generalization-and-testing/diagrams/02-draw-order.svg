  .t-code { font-size: 14px; font-weight: 400; fill: var(--nn-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--nn-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--nn-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--nn-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--nn-surface); stroke: var(--nn-rule); stroke-width: 1; }
  .card { fill: var(--nn-neutral-soft); stroke: var(--nn-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--nn-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--nn-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--nn-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--nn-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--nn-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--nn-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--nn-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--nn-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--nn-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-blue-soft { fill: var(--nn-blue-soft); }
  .f-ink { fill: var(--nn-ink); }
  .f-neutral-soft { fill: var(--nn-neutral-soft); }
  .f-orange-soft { fill: var(--nn-orange-soft); }
  .s-blue-line { stroke: var(--nn-blue-line); }
  .s-ink { stroke: var(--nn-ink); }
  .s-orange-line { stroke: var(--nn-orange-line); }
  .s-rule { stroke: var(--nn-rule); }
</style>
<defs>
<marker id="nn-02-draw-order-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="656">When the test points are drawn decides what they are</text>
<text x="40" y="76" class="t-subtitle" data-w="641">The calls in order after the seed is set; each block is as wide as the normal draws it takes.</text>
<text x="40" y="124" class="t-head" data-w="185">The documented order</text>
<g data-grid="skip">
<rect x="40" y="136" width="195" height="48" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="136" width="195" height="48" class="w1 nofill s-rule" data-fit="skip"/>
<text x="137.5" y="165" text-anchor="middle" class="t-label" data-w="85">training data</text>
<text x="137.5" y="204" text-anchor="middle" class="t-tick" data-w="92">draws 1 to 300</text>
</g>
<g data-grid="skip">
<rect x="235" y="136" width="208" height="48" class="f-orange-soft" data-fit="skip"/>
