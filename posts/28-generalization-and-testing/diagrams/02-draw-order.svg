<path d="M471,260 L471,316" class="s-ink w15 nofill"/>
<text x="471" y="252" text-anchor="middle" class="t-code" data-w="146">np.random.seed(0)</text>
</g>
<g data-grid="skip">
<rect x="475" y="264" width="195" height="48" class="f-blue-soft" data-fit="skip"/>
<rect x="475" y="264" width="195" height="48" class="w1 nofill s-blue-line" data-fit="skip"/>
<text x="572.5" y="293" text-anchor="middle" class="t-label" data-w="163">test data = training data</text>
<text x="572.5" y="332" text-anchor="middle" class="t-tick" data-w="130">draws 1 to 300 again</text>
</g>
<text x="712" y="284" class="t-value f-ink" data-w="110">gap 0.00 points</text>
<text x="712" y="308" class="t-note" data-w="156">it reads the training set</text>
<text x="40" y="380" class="t-head" data-w="303">The test data drawn before the layers</text>
<g data-grid="skip">
<rect x="40" y="392" width="195" height="48" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="392" width="195" height="48" class="w1 nofill s-rule" data-fit="skip"/>
<text x="137.5" y="421" text-anchor="middle" class="t-label" data-w="85">training data</text>
<text x="137.5" y="460" text-anchor="middle" class="t-tick" data-w="92">draws 1 to 300</text>
</g>
<g data-grid="skip">
