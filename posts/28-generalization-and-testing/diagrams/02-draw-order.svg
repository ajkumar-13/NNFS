    --nn-blue-ink: #005A8C;
    --nn-blue-soft: #E3F0F8;
    --nn-blue-line: #9CC6E0;
    --nn-orange: #C98500;
    --nn-orange-ink: #8A5B00;
    --nn-orange-soft: #FBF0D9;
    --nn-orange-line: #E5C27A;
    --nn-green: #008F68;
    --nn-green-ink: #006B4E;
    --nn-green-soft: #DFF3EC;
    --nn-green-line: #8FCDB8;
    --nn-red: #A8322A;
    --nn-red-ink: #8F2A23;
    --nn-red-soft: #F8E3E1;
    --nn-red-line: #DDA49F;
    --nn-purple: #A14D8C;
    --nn-purple-ink: #833E72;
    --nn-purple-soft: #F4E4EF;
    --nn-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --nn-bg: #0E0F12;
