<text x="712" y="436" class="t-note" data-w="136">97.33 against 78.67,</text>
<text x="712" y="456" class="t-note" data-w="109">another network</text>
<text x="40" y="504" class="t-note" data-w="570">The short grey rule in each row is the training loop, which draws no random numbers.</text>
</svg>
