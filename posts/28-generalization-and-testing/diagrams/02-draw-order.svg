<rect x="467" y="136" width="195" height="48" class="w1 nofill s-blue-line" data-fit="skip"/>
<text x="564.5" y="165" text-anchor="middle" class="t-label" data-w="60">test data</text>
<text x="564.5" y="204" text-anchor="middle" class="t-tick" data-w="66">621 to 920</text>
</g>
<text x="712" y="156" class="t-value f-ink b" data-w="118">gap 14.00 points</text>
<text x="712" y="180" class="t-note" data-w="131">96.33 against 82.33</text>
<g data-grid="skip">
<text x="455" y="204" text-anchor="middle" class="t-tick" data-w="28">loop</text>
</g>
<text x="40" y="252" class="t-head" data-w="321">The seed set again before the test draw</text>
<g data-grid="skip">
<rect x="40" y="264" width="195" height="48" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="264" width="195" height="48" class="w1 nofill s-rule" data-fit="skip"/>
<text x="137.5" y="293" text-anchor="middle" class="t-label" data-w="85">training data</text>
<text x="137.5" y="332" text-anchor="middle" class="t-tick" data-w="92">draws 1 to 300</text>
</g>
<g data-grid="skip">
<rect x="235" y="264" width="208" height="48" class="f-orange-soft" data-fit="skip"/>
<rect x="235" y="264" width="208" height="48" class="w1 nofill s-orange-line" data-fit="skip"/>
<text x="339" y="293" text-anchor="middle" class="t-label" data-w="128">weights, 128 + 192</text>
<text x="339" y="332" text-anchor="middle" class="t-tick" data-w="66">301 to 620</text>
</g>
<g data-grid="skip">
<path d="M455,272 L455,304" class="s-rule w1 nofill"/>
