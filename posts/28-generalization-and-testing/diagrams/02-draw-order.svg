    --nn-bg: #FAFAF7;
    --nn-surface: #FFFFFF;
    --nn-ink: #1A1A1A;
    --nn-ink-muted: #5C5C5C;
    --nn-ink-subtle: #9A9A9A;
    --nn-border: #D9D9D4;
    --nn-primary: #5B7FBF;
    --nn-accent: #D98E5F;
    --nn-success: #5C9E78;
    --nn-warn: #B8895A;
    --nn-alert: #C66B5E;
    --nn-neutral-1: #EAEAE4;
    --nn-neutral-2: #CFCFC8;
    --nn-neutral-3: #8E8E88;
    --nn-on-fill: #FFFDF9;
