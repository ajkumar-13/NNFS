<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-gap-over-seeds-title" aria-describedby="nn-01-gap-over-seeds-desc">
<title id="nn-01-gap-over-seeds-title">The same weights, 10.67 to 14.00 points lower on new points</title>
<desc id="nn-01-gap-over-seeds-desc">A dot plot with one row per seed, 0 to 4, on an accuracy axis from 60 to 100 percent, for the 64-neuron network of post 27 after 10,001 epochs. A green circle marks the accuracy on its 300 training points and a hollow blue diamond the accuracy on 300 new points from the same generator, read forward-only with the same weights; a line joins the two. Training and test: seed 0 96.33 and 82.33 percent, gap 14.00 points; seed 1 83.33 and 72.00 percent, gap 11.33 points; seed 2 78.00 and 67.33 percent, gap 10.67 points; seed 3 88.00 and 77.00 percent, gap 11.00 points; seed 4 96.33 and 82.67 percent, gap 13.67 points. Seed 0 is the documented run, 289 and 247 of 300 points. The test figure is below the training figure on every seed.</desc>
