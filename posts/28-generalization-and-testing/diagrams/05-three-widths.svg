<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-05-three-widths-title" aria-describedby="nn-05-three-widths-desc">
<title id="nn-05-three-widths-title">8 neurons shrink the gap; 128 raise the test accuracy</title>
<desc id="nn-05-three-widths-desc">Three dot plots side by side for 8, 64 and 128 hidden neurons (51, 387 and 771 parameters), one row per seed, 0 to 4, on an accuracy axis from 30 to 100 percent; a green circle marks the training accuracy and a hollow blue diamond the test accuracy, joined by a line. 8 neurons: training 47.00, 50.67, 41.33, 43.33, 41.67; test 46.67, 43.67, 38.00, 39.67, 41.00; gap 0.33 to 7.00 points. 64 neurons: training 96.33, 83.33, 78.00, 88.00, 96.33; test 82.33, 72.00, 67.33, 77.00, 82.67; gap 10.67 to 14.00 points. 128 neurons: training 97.00, 95.33, 94.33, 98.00, 97.67; test 83.33, 80.67, 86.67, 81.33, 83.00; gap 7.67 to 16.67 points. The 8-neuron network has the smallest gaps and the lowest test accuracy; the 128-neuron network has the highest test accuracy on every seed.</desc>
