<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-derivative-as-slope-title" aria-describedby="nn-01-derivative-as-slope-desc">
<title id="nn-01-derivative-as-slope-title">The derivative is the slope of the tangent</title>
<desc id="nn-01-derivative-as-slope-desc">A plot of the parabola f(x) = x squared for x from minus 3 to 3, with its tangent line drawn at three points and each tangent labelled with its slope: minus 3 at x = minus 1.5, plus 1 at x = 0.5 and plus 4 at x = 2. A table beside the plot lists, for the same three points, x, the rule f prime of x = 2x, which gives minus 3, 1 and 4, and the central difference with h = 10 to the minus 5, which gives minus 3.000000, 1.000000 and 4.000000.</desc>
