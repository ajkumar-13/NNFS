<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-slope-to-update-title" aria-describedby="nn-02-slope-to-update-desc">
<title id="nn-02-slope-to-update-title">The sign of the slope decides where the weight moves</title>
<desc id="nn-02-slope-to-update-desc">On the left, the loss L(w) = (w minus 1) squared for w from minus 1 to 3, with its tangent at w = 2, w = 1 and w = 0, labelled slope plus 2, slope 0 and slope minus 2. A short arrow at w = 2 points to the left and one at w = 0 points to the right, both towards w = 1, where the loss is lowest. On the right, three cards apply the update w gets w minus alpha times dL/dw: at w = 2, w gets 2 minus 2 alpha, so w falls; at w = 1, w gets 1 minus alpha times 0, which is 1, so w stays; at w = 0, w gets 0 minus alpha times minus 2, which is 2 alpha, so w rises.</desc>
<style>
