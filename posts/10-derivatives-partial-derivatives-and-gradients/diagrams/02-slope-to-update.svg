<text x="592" y="128" class="t-head">Update: <tspan class="i">w</tspan> ← <tspan class="i">w</tspan> − α · ∂<tspan class="i">L</tspan>/∂<tspan class="i">w</tspan></text>
<rect x="592" y="144" width="328" height="88" rx="8" class="card"/>
<text x="608" y="176" class="t-head">At <tspan class="i">w</tspan> = 2, ∂<tspan class="i">L</tspan>/∂<tspan class="i">w</tspan> = +2</text>
<text x="608" y="208" class="t-math"><tspan class="i">w</tspan> ← 2 − 2α, so <tspan class="i">w</tspan> falls</text>
<rect x="592" y="248" width="328" height="88" rx="8" class="card"/>
<text x="608" y="280" class="t-head">At <tspan class="i">w</tspan> = 1, ∂<tspan class="i">L</tspan>/∂<tspan class="i">w</tspan> = 0</text>
<text x="608" y="312" class="t-math"><tspan class="i">w</tspan> ← 1 − α · 0 = 1, so <tspan class="i">w</tspan> stays</text>
<rect x="592" y="352" width="328" height="88" rx="8" class="card"/>
<text x="608" y="384" class="t-head">At <tspan class="i">w</tspan> = 0, ∂<tspan class="i">L</tspan>/∂<tspan class="i">w</tspan> = −2</text>
<text x="608" y="416" class="t-math"><tspan class="i">w</tspan> ← 0 − α · (−2) = 2α, so <tspan class="i">w</tspan> rises</text>
<text x="40" y="504" class="t-note">Every move heads for <tspan class="i">w</tspan> = 1, where the loss is lowest.</text>
