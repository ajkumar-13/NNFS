<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-04-step-size-sweep-title" aria-describedby="nn-04-step-size-sweep-desc">
<title id="nn-04-step-size-sweep-title">A smaller step helps only until rounding takes over</title>
<desc id="nn-04-step-size-sweep-desc">A log-log chart of the error of two estimates of the slope of x cubed at x = 2, whose exact value is 12, against the step h from 10 to the minus 16 up to 10 to the minus 1, in float64. From the right, the forward difference's error falls as 6h and the central difference's as h squared. Then both turn and rise along a dotted line, the rounding estimate 10 to the minus 15 over h. The smallest central error is 2.1 times 10 to the minus 10, at h = 10 to the minus 5; the smallest forward error is 7.3 times 10 to the minus 8, at h = 10 to the minus 8, 344 times larger. From h = 10 to the minus 8 to 10 to the minus 13 the two estimates agree, and at h = 10 to the minus 16 both return 0, an error of 12.</desc>
