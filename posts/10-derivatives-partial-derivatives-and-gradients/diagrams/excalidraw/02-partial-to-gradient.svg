<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">From partial derivatives to gradients</title>
  <desc id="d">A hand-drawn flow diagram. On the left, a function f of x, y and z, described as one function with three inputs. Three branches lead from it, each computing one partial derivative: partial f by partial x while holding y and z still, partial f by partial y while holding x and z still, and partial f by partial z while holding x and y still. The three branches are drawn identically apart from which variable is left free. They feed into a single column vector on the right, labelled the gradient, holding the three partials stacked. A band beneath states that the gradient points along the steepest ascent, so its negative is the direction gradient descent moves in.</desc>

