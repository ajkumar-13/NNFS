<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-03-partials-to-gradient-title" aria-describedby="nn-03-partials-to-gradient-desc">
<title id="nn-03-partials-to-gradient-title">Three slopes along three axes make the gradient</title>
<desc id="nn-03-partials-to-gradient-desc">Three panels slice f(x, y, z) = 3 x cubed z minus y squared plus 5z plus 2yz through the point (1, 2, 3), where f = 32, each along one axis with the other two variables frozen, all on the same f axis from 20 to 60. Along x, with y = 2 and z = 3, the slice is 9 x cubed plus 23 and its tangent at x = 1 has slope 9 x squared z = 27. Along y, with x = 1 and z = 3, the slice is minus y squared plus 6y plus 24, slope minus 2y plus 2z = 2. Along z, with x = 1 and y = 2, the slice is 12z minus 4, slope 3 x cubed plus 5 plus 2y = 12. Arrows carry the three slopes into one vector, the gradient of f at (1, 2, 3), (27, 2, 12). Its central differences are 27.00000000, 2.00000000 and 12.00000000, and its length is the square root of 877, about 29.61.</desc>
