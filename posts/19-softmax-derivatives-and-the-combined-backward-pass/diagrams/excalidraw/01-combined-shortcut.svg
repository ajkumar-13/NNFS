space,Menlo,monospace' font-size="12" fill="var(--nn-success)">∂L/∂Zₖ  =  −yₖ  +  ŷₖ</text><text xml:space="preserve" x="544" y="269.04" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="12" fill="var(--nn-success)">        =  ŷₖ − yₖ</text><path d="M515.65 292.18C640.72 292.27 766 292 904.14 291.97M516.07 292.14C640.33 292.22 764.45 292.31 904.04 292.02" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="522" y="311.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-muted)">The exponentials cancel before anything</text><text xml:space="preserve" x="522" y="327.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-muted)">is computed. No Jacobian is ever built.</text><text xml:space="preserve" x="522" y="351.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-success)">O(N C) time, no extra memory.</text><text xml:space="preserve" x="522" y="375.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">Correct, and what every framework ships.</text><path d="M52.37 411.67C254.76 410.9 455.89 411.55 908.37 411.38C916.01 409.7 922.02 416.04 920.97 422.01C920.45 439.99 919.05 458.76 917.41 473.75C918.19 483.34 915.55 487.79 908.84 485.45C703.15 486.9 498.23 485.2 51.49 486.71C44.37 484.76 39.08 480.61 40.59 475.62C37.74 458.57 39.07 438.51 40.7 425.34C38.43 416.99 42.72 411.36 54.73 410.52C52.33 412 52.33 412 52.33 412" fill="var(--nn-neutral-1)" stroke="none"/><path d="M52.08 412.01C309 409.71 565.8 408.43 907.83 412.14M52.12 412.23C350.14 409.87 648.08 410.01 907.39 412.35M907.67 412C915.41 411.4