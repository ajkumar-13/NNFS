<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">Softmax and cross-entropy backward: the full Jacobian against the clean shortcut</title>
  <desc id="d">Two hand-drawn panels reaching the same gradient. The left, in alert red and labelled option one, differentiates each operation in turn: it builds the softmax Jacobian, a dense C by C matrix per sample with A k times one minus A k on the diagonal and minus A k A j off it, then multiplies it by minus y over y-hat. It is annotated as a matrix product per sample, order N C squared in time and C squared in memory, correct and the way nobody does it. The right, in success green and labelled option two, substitutes first: the loss minus log of y-hat at the true class becomes minus Z at the true class plus the log of the sum of exponentials, whose derivative is minus y k plus y-hat k, which is y-hat k minus y k. It is annotated as having the exponentials cancel before anything is computed, order N C in time with no extra memory. A band gives the three-line implementation and notes that the second line is the whole derivation: subtract one where the label is one.</desc>

