1.96" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M139.79 214.58C181.91 213.89 222.95 214.7 319.61 214.36M140.28 213.96C208.53 214.4 276.33 214.24 320.25 214.12" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M140.59 248.28C187.68 248.33 236.48 247.84 320.06 247.43M139.75 248.07C187.65 248.15 235.5 248.22 319.95 248.29" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="170" y="199.78" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">A₁(1−A₁)</text><text xml:space="preserve" x="230" y="199.78" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">−A₁A₂</text><text xml:space="preserve" x="290" y="199.78" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">−A₁A₃</text><text xml:space="preserve" x="170" y="233.78" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">−A₂A₁</text><text xml:space="preserve" x="230" y="233.78" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">A₂(1−A₂)</text><text xml:space="preserve" x="290" y="233.78" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">−A₂A₃</text><text xml:space="preserve" x="170" y="267.78" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">−A₃A₁</text><text xml:space="preserve" x="230" y="267.78" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">−A₃A₂</text><text xml:space="preserve" x="290" y="267.78" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">A₃(1−A₃)</text><text xml:space="preserve" x="62" y="302.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-ink)">then multiply it by  −y / ŷ</text><text xml:space="preserve" x="62" y="327.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-muted)">A matrix product per sample.</text><text xml:space="preserve" x="62" y="345.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-alert)">O(N C²) time, O(C²) memory.</text><text xml:space="preserve" x="62" y="369.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">Correct, and the way nobody does it.</text><path d="M522.78 85.24C602.37 85.25 682.45 85.16 896.51 85.44C913.49 85.14 917.56 92.26 918.41 111.36C919.35 191.9 920.13 274.62 918.01 362.6C917.88 379.56 910.55 388.03 897.04 386.32C811.6 383.4 730.24 384.98 524.2 387.43C508.1 385.78 500.91 380.45 500.48 360.96C501.25 271.92 501.46 178.54 498.87 111.18C497.92 93.48 506.95 88.19 523.65 85.14C524 86 524 86 524 86" fill="var(--nn-surface)" stroke="none"/><path d="M523.59 85.37C660.49 88.11 794.96 86.73 896.95 85.24M524.13 85.52C622.26 85.13 720.49 85.69 896.04 86.39M896 86C911.05 86.05 918.96 93.02 920.46 110.32M895.44 87.92C911.15 85.94 919.52 92.53 920.94 109.69M919.3 109.26C917.51 162.16 919.83 212.12 920.07 361.54M919.57 109.29C917.57 178.45 918.84 247.98 919.22 361.44M920 362C919.31 377.4 913.15 385.25 895.42 386.99M921.21 363.42C920.13 379 913.18 387.25 897.61 384.25M895.02 384.88C786.06 387.2 675.96 387.86 523.12 387.13M896.49 385.82C803.56 383.7 710.17 383.8 524.47 385.96M524 386C506.42 385.46 499.18 377.36 501.54 363.