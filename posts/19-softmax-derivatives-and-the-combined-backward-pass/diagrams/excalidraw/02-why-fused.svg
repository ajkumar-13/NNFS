<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">Why softmax and cross-entropy are shipped as one fused operation</title>
  <desc id="d">A hand-drawn figure in two cards. The left tabulates the numbers each route computes per sample per backward step at three class counts: at three classes, as in the spiral set, the Jacobian needs nine and the shortcut three, a ratio of three; at a thousand classes, as in ImageNet, a million against a thousand; and at fifty thousand, a language-model vocabulary, two and a half billion against fifty thousand, a ratio of fifty thousand. It notes that the gap between order N C squared and order N C is the class count itself. The right card gives the stability reason: computed separately the two operations materialise an intermediate that can underflow before the logarithm sees it, whereas the log of softmax rewritten as Z k minus the log of the sum of exponentials is the log-sum-exp trick, which is Part 06’s max subtraction in a different form, and the unstable middle step never exists. A band notes that PyTorch ships this as nn.CrossEntropyLoss and TensorFlow as softmax_cross_entropy_with_logits, both taking raw logits rather than probabilities for exactly these two reasons.</desc>

