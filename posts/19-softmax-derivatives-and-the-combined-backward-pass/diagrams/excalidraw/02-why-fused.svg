45.33 357.01" fill="none" stroke="var(--nn-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="62" y="110.88" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="14" fill="var(--nn-alert)">Numbers per sample, per backward step</text><path d="M55.91 127.99C162.62 127.56 268.88 127.64 544.2 127.97M55.95 127.97C185.73 128.6 315.33 128.47 544.09 127.89" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="62" y="149.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">classes C</text><text xml:space="preserve" x="190" y="149.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">Jacobian · C²</text><text xml:space="preserve" x="350" y="149.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">shortcut · C</text><text xml:space="preserve" x="470" y="149.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">ratio</text><text xml:space="preserve" x="62" y="179.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-ink)">3</text><text xml:space="preserve" x="190" y="179.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-alert)">9</text><text xml:space="preserve" x="350" y="179.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-success)">3</text><text xml:space="preserve" x="470" y="179.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-ink)">3×</text><text xml:space="preserve" x="62" y="197.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">the spiral set</text><path d="M56.25 208.24C238.58 208.6 421.12 208.78 544.1 208.1M55.98 207.91C213.24 207.4 370.22 207.46 544.11 208.08" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="62" y="235.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-ink)">1 000</text><text xml:space="preserve" x="190" y="235.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-alert)">1 000 000</text><text xml:space="preserve" x="350" y="235.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-success)">1 000</text><text xml:space="preserve" x="470" y="235.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-ink)">1 000×</text><text xml:space="preserve" x="62" y="253.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">ImageNet</text><path d="M56.25 263.99C245.12 263.78 434.18 264.21 544.24 263.78M55.89 263.93C171.19 264.4 286.19 264.54 544.12 263.99" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="62" y="291.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-ink)">50 000</text><text xml:space="preserve" x="190" y="291.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-alert)">2 500 000 000</text><text xml:space="preserve" x="350" y="291.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-success)">50 000</text><text xml:space="preserve" x="470" y="291.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-ink)">50 000×</text><text xml:space="preserve" x="62" y="309.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">a language model vocabulary</text><text xml:space="preserve" x="62" y="346.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-ink-muted)">O(N C²) against O(N C). The gap is the class count itself.</text><path d="M625.91 87.24C719.97 84.13 814.52 86.36 894.04 87.92C910.19 83.56 917.46 93.87 918.06 109.83C919.29 201.72 920.13 294.53 919.09 343.43C921.39 360.59 913.13 368 896.37 365.16C821.19 363.41 744.22 363.35 623.19 365.87C610.55 365.64 598.24 356.49 602.57 341.01C598.46 290.74 599.39 242.41 600.53 107.95C600.41 92.63 605.52 87.47 623.32 86.79C624 86 624 86 624 86" fill="var(--nn-surface)" stroke="none"/><path d="M624.52 86.76C688.8 82.8 752.03 83.66 896.47 86.45M624.5 85.95C688.11 87.23 752.32 86.01 896.07 85.79M896 86C912.45 84.37 919.43 93.48 920.49 108.82M896.27 84.92C910.18 87.13 918.83 95.3 922.27 109.11M918.35 109.22C920.84 172.68 920.31 233.02 919.69 341.33M920.75 110.64C922.49 200.07 921.5 288.93 920.2 342.1M920 342C919.83 358.13 912.81 367.07 895.44 366.14M919.38 340.88C920.92 357.93 911.01 367.28 894.99 364.67M895.48 366.21C794.22 365.26 693 366.3 622.66 366.71M895.42 366.1C802.79 363.86 711.06 363.78 623.84 365.65M624 366C608.39 366.2 600.96 357.08 600.51 342.76M624.17 367.69C609.73 366.72 600.99 360.04 600.99 343.54M600.38 343.29C602.27 265.76 602.26 189 601.16 108.34M600.12 342.13C601.12 295.71 601.76 248.27 600.08 109.25M600 110C600.17 93.78 609.89 85.99 623.27 85.07M598.06 111.63C599.27 94.47 609.1 85.73 625.83 85.17M624 86C624 86 624 86 624 86M624 86C624 86 624 86 624 86" fill="none" stroke="var(--nn-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.68 94.99C603.35 166.29 604.77 238.06 604.1 357.71M605.41 95.14C605.9 178.72 606.1 263.35 604.57 357.14" fill="none" stroke="var(--nn-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="622" y="110.88" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="14" fill="var(--nn-success)">And it is more stable</text><path d="M614.15 128.45C713.24 127.27 812.92 127.29 904.26 127.84M613.84 127.78C698.54 127.47 783.4 127.18 903.81 127.86" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="622" y="152.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-ink)">Computed separately, the two ops</text><text xml:space="preserve" x="622" y="170.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-ink)">materialise an intermediate that can</text><text xml:space="preserve" x="622" y="188.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-ink)">underflow before the log sees it.</text><path d="M613.86 203.55C697.32 203.87 779.85 204.5 903.83 203.75M614.04 204.1C681.89 203.88 750.19 203.84 903.82 203.9" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="622" y="227.04" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="12" fill="var(--nn-ink-muted)">log( softmax(Z) )</text><text xml:space="preserve" x="622" y="251.04" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="12" fill="var(--nn-success)">=  Zₖ  −  log Σⱼ eᶻʲ</text><text xml:space="preserve" x="622" y="277.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">The right-hand side is the log-sum-exp</text><text xml:space="preserve" x="622" y="293.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">trick, which is Part 06’s max subtraction</text><text xml:space="preserve" x="622" y="309.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">wearing a different hat.</text><text xml:space="preserve" x="622" y="338.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-success)">The unstable middle step never exists.</text><path d="M50.26 392.23C312.45 389.53 574.38 390.78 910.7 392.06C917.96 394.11 921.97 395.85 920.79 400.84C921.08 410.79 922.29 423.5 918.1 436.63C919.95 444.26 915.24 449.77 911.5 449.47C681.51 448.02 450.41 448.91 49.26 447.17C42 446.69 40.34 446.83 41.63 438.04C39.34 425.11 41.08 410.34 39.11 403C42.28 392.96 41.01 393.6 51.57 393.95C49.33 392 49.33 392 49.33 392" fill="var(--nn-neutral-1)" stroke="none"/><path d="M48.55 391.61C337.61 389.17 627.07 389.36 911.44 392.5M49.21 392.37C251.13 391.05 452.7 390.7 910.79 391.77M910.67 392C915.11 390.62 918.74 393.76 920.7 401.66M908.73 393.91C917.48 392.3 918.66 397.41 917.78 400.99M918.47 400.4C919.57 411.25 918.57 422.06 920.43 440.27M920.73 401.45C918.97 416.18 920.64 430.26 920.59 438.4M920 438.67C919.49 446.08 915.26 449.79 910.25 446.15M918.58 439.77C921.89 446.55 919.09 449.47 909.69 449.66M911.42 447.57C654.52 447.8 396.63 447.48 49.44 447.34M910.83 447.63C578.44 445.71 247 445.73 48.94 448.36M49.33 448C41.28 449.4 41.45 446.02 41.24 439.7M48.54 449.78C44.47 450.12 39.45 446.89 38.77 440.3M40.32 439.22C39.59 429.63 39.82 423.39 40.01 402.05M39.99 437.7C40.78 425.45 41.28 410.76 39.26 402.27M40 401.33C39.95 393.51 41.68 391.65 50.29 393.81M41.99 401.58C39.44 396.19 41.91 392.79 50.88 390.6M49.33 392C49.33 392 49.33 392 49.33 392M49.33 392C49.33 392 49.33 392 49.33 392" fill="none" stroke="var(--nn-border)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="480" y="415.04" text-anchor="middle" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="12" fill="var(--nn-ink)">PyTorch ships it as nn.CrossEntropyLoss; TensorFlow as softmax_cross_entropy_with_logits.</text><text xml:space="preserve" x="480" y="438.12" text-anchor="middle" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-ink-muted)">Both take raw logits rather than probabilities, for exactly the two reasons above.</text>
