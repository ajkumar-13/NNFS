<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-two-routes-title" aria-describedby="nn-01-two-routes-desc">
<title id="nn-01-two-routes-title">Two routes to one gradient: the Jacobian collapses</title>
<desc id="nn-01-two-routes-desc">One sample with softmax output 0.70, 0.20, 0.10 and true class 0. Top, the Jacobian route: the cross-entropy gradient minus y over y-hat, −1.43, 0.00, 0.00, times the 3 by 3 softmax Jacobian with rows 0.21, −0.14, −0.07; −0.14, 0.16, −0.02; −0.07, −0.02, 0.09 gives −0.30, 0.20, 0.10. The one non-zero entry, −1/0.7, and the first Jacobian row are outlined; that row is 0.7 times 0.3, −0.2, −0.1, so −1/0.7 times 0.7 times it gives −0.3, 0.2, 0.1. Bottom, the combined route: y-hat 0.70, 0.20, 0.10 minus the one-hot label 1, 0, 0 gives the same −0.30, 0.20, 0.10, with no Jacobian and no division.</desc>
<style>
