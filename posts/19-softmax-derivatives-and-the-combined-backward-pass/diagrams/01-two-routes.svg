<text x="440" y="372" text-anchor="middle" class="t-note" data-w="134">entry (<tspan class="i">k</tspan>, <tspan class="i">j</tspan>) = ∂<tspan class="i">ŷ</tspan><tspan class="sub i" dy="4">k</tspan><tspan dy="-4">​</tspan>/∂<tspan class="i">z</tspan><tspan class="sub i" dy="4">j</tspan><tspan dy="-4">​</tspan></text>
