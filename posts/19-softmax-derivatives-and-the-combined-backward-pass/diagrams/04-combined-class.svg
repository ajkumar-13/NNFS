<text x="108" y="496" text-anchor="middle" class="t-head" data-w="79">backward</text>
<text x="108" y="532" text-anchor="middle" class="t-note" data-w="90">reads it as its</text>
<text x="108" y="556" text-anchor="middle" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dvalues</tspan></text>
