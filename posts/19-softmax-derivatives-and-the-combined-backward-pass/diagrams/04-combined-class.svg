<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-04-combined-class-title" aria-describedby="nn-04-combined-class-desc">
<title id="nn-04-combined-class-title">One class replaces two backward methods</title>
<desc id="nn-04-combined-class-desc">The class Activation_Softmax_Loss_CategoricalCrossentropy between the last dense layer and the loss. Its forward card takes the logits, shape (N, K), runs the softmax, stores self.output, shape (N, K), marked cached, and returns the loss, one number. The caller passes softmax_loss.output back as dvalues; the backward card converts one-hot labels to indices, copies dvalues, subtracts 1 at the true class and divides by samples, and sends dinputs, shape (N, K), to the dense layer, where it becomes that layer's dvalues. Neither standalone backward method is called. The dense layer is drawn twice, a forward card and a backward card joined by a dashed edge labelled the same object. A key on the bottom row: grey arrows forward, purple arrows backward, and the cached tag, kept by forward.</desc>
