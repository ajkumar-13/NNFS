<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="521">One class replaces two backward methods</text>
<text x="40" y="76" class="t-subtitle" data-w="549"><tspan class="i">N</tspan> samples, <tspan class="i">K</tspan> classes. The caller hands the cached output back to backward.</text>
<text x="288" y="144" class="t-code" data-w="402"><tspan class="mono">Activation_Softmax_Loss_CategoricalCrossentropy</tspan></text>
<rect x="288" y="160" width="480" height="124" rx="8" class="card"/>
<text x="304" y="192" class="t-code" data-w="291">def forward(self, inputs, y_true):</text>
<text x="320" y="216" class="t-code" data-w="265">self.activation.forward(inputs)</text>
<text x="320" y="240" class="t-code" data-w="308">self.output = self.activation.output</text>
<text x="320" y="264" class="t-code" data-w="402">return self.loss.calculate(self.output, y_true)</text>
<rect x="288" y="388" width="480" height="196" rx="8" class="card"/>
<text x="304" y="420" class="t-code" data-w="308">def backward(self, dvalues, y_true):</text>
<text x="320" y="444" class="t-code" data-w="188">samples = len(dvalues)</text>
<text x="320" y="468" class="t-code" data-w="223">if len(y_true.shape) == 2:</text>
<text x="336" y="492" class="t-code" data-w="291">y_true = np.argmax(y_true, axis=1)</text>
<text x="320" y="516" class="t-code" data-w="248">self.dinputs = dvalues.copy()</text>
<text x="320" y="540" class="t-code" data-w="351">self.dinputs[range(samples), y_true] -= 1</text>
<text x="320" y="564" class="t-code" data-w="197">self.dinputs /= samples</text>
<rect x="40" y="160" width="136" height="124" rx="8" class="card"/>
<rect x="40" y="460" width="136" height="124" rx="8" class="card"/>
