<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-why-combined-title" aria-describedby="nn-02-why-combined-desc">
<title id="nn-02-why-combined-title">The Jacobian route does more work and can return nan</title>
<desc id="nn-02-why-combined-desc">Two panels. Left, the numbers each route computes for one sample: at 3 classes 9 for the Jacobian route against 3 for the combined route, at 1,000 classes 1,000,000 against 1,000, and at 50,000 classes, the size of a language-model vocabulary, 2,500,000,000 against 50,000; the ratio is K. Right, logits 0, −800, 0 with true class 1 give the softmax output 0.50, 0.00, 0.50. The Jacobian route divides by it: minus y over y-hat is 0.00, minus infinity, 0.00, and the product with the Jacobian is nan, nan, nan. The combined route gives y-hat minus y = 0.50, −1.00, 0.50.</desc>
