<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">Element-wise versus coupled activation backwards: the Jacobian decides the code</title>
  <desc id="d">Two hand-drawn panels holding two three-by-three Jacobians at the same size. The left, in success green and labelled element-wise, has f prime of z on its diagonal and zeros everywhere else, drawn faint; its backward is the single line dinputs equals dvalues times f_prime of Z, because multiplying by a diagonal matrix is multiplying each entry by its own diagonal value. The right, in alert red and labelled coupled, is fully populated: a k times one minus a k on the diagonal and minus a k a j off it; its backward is a real matrix product per sample with the full Jacobian built first. A band notes that ReLU, sigmoid and tanh are diagonal while softmax is dense and is the only such activation in the series, and that Part 19 cancels the dense Jacobian away before it ever has to be built.</desc>

