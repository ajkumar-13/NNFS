<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-gradient-check-title" aria-describedby="nn-03-gradient-check-desc">
<title id="nn-03-gradient-check-title">Without the mask every seed fails; with it nine of ten pass</title>
<desc id="nn-03-gradient-check-desc">A chart of the largest relative error over the five gradients of the Dense, ReLU, Dense chain, on a log scale from 10 to the minus 12 to 10, for seeds 0 to 9. Red triangles, the ReLU backward without the mask: 1.8, 1.8, 1.6, 1.7, 1.7, 1.1, 1.1, 1.4, 1.6, 1.9, every one between 1.1 and 1.9. Blue circles, the classes as written: 1.2 times 10 to the minus 10, 5.3 times 10 to the minus 9, 4.8 times 10 to the minus 6, 5.9 times 10 to the minus 10, 4.1 times 10 to the minus 8, 1.8 times 10 to the minus 9, 7.3 times 10 to the minus 9, 5.0 times 10 to the minus 10, 1.2 times 10 to the minus 8, 1.7 times 10 to the minus 9. A dotted line marks the pass threshold 10 to the minus 7, with the region below it shaded. Nine seeds pass; seed 2 reaches 4.8 times 10 to the minus 6, at an entry of dense1.dinputs whose analytic value is minus 2.58 times 10 to the minus 6, with an absolute gap of only 1.2 times 10 to the minus 11.</desc>
