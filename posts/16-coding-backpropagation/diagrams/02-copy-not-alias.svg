<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-copy-not-alias-title" aria-describedby="nn-02-copy-not-alias-desc">
<title id="nn-02-copy-not-alias-title">Without .copy(), the mask writes into the caller's array</title>
<desc id="nn-02-copy-not-alias-desc">The ReLU backward of section 4 on inputs 1, minus 2 and 3, whose gate at minus 2 is closed, and the array 5, 6, 7 the caller hands in as dvalues. Two panels run the two lines of backward. Left, without .copy(): self.dinputs = dvalues makes dvalues and self.dinputs two names for one array, and after the masking line self.dinputs[self.inputs &lt;= 0] = 0 that one array reads 5, 0, 7, so the caller's 6 has become 0, outlined in red. Right, with .copy(): two arrays, dvalues still 5, 6, 7, unchanged, and self.dinputs 5, 0, 7, masked.</desc>
<style>
