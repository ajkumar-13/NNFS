</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="663">Without .copy(), the mask writes into the caller's array</text>
<text x="40" y="76" class="t-subtitle" data-w="566">The three-element example of section 4, after both lines of backward have run.</text>
<rect x="216" y="112" width="40" height="40" class="cell f-blue-soft"/>
<rect x="256" y="112" width="40" height="40" class="cell f-blue-soft"/>
<rect x="296" y="112" width="40" height="40" class="cell f-blue-soft"/>
<rect x="216" y="112" width="120" height="40" class="frame" data-fit="skip"/>
<g data-grid="skip">
<text x="236" y="138" text-anchor="middle" class="t-cell16" data-w="10">1</text>
<text x="276" y="138" text-anchor="middle" class="t-cell16" data-w="21">−2</text>
<text x="316" y="138" text-anchor="middle" class="t-cell16" data-w="10">3</text>
</g>
<text x="200" y="136" text-anchor="end" class="t-code" data-w="94"><tspan class="mono f-blue-ink">self.inputs</tspan></text>
<text x="352" y="136" class="t-note" data-w="118">gate closed at −2</text>
<rect x="672" y="112" width="40" height="40" class="cell f-purple-soft"/>
<rect x="712" y="112" width="40" height="40" class="cell f-purple-soft"/>
<rect x="752" y="112" width="40" height="40" class="cell f-purple-soft"/>
<rect x="672" y="112" width="120" height="40" class="frame" data-fit="skip"/>
<g data-grid="skip">
<text x="692" y="138" text-anchor="middle" class="t-cell16" data-w="10">5</text>
<text x="732" y="138" text-anchor="middle" class="t-cell16" data-w="10">6</text>
<text x="772" y="138" text-anchor="middle" class="t-cell16" data-w="10">7</text>
</g>
<text x="656" y="136" text-anchor="end" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dvalues</tspan></text>
<text x="808" y="136" class="t-note" data-w="97">from the caller</text>
<text x="40" y="216" class="t-head" data-w="71">Without </text>
<text x="104" y="216" class="t-code16" data-w="69">.copy()</text>
<rect x="40" y="232" width="424" height="76" rx="8" class="card"/>
<text x="56" y="264" class="t-code" data-w="188">self.dinputs = dvalues</text>
<text x="56" y="288" class="t-code" data-w="291">self.dinputs[self.inputs &lt;= 0] = 0</text>
<text x="496" y="216" class="t-head" data-w="44">With </text>
<text x="536" y="216" class="t-code16" data-w="69">.copy()</text>
<rect x="496" y="232" width="424" height="76" rx="8" class="card"/>
<text x="512" y="264" class="t-code" data-w="248">self.dinputs = dvalues.copy()</text>
<text x="512" y="288" class="t-code" data-w="291">self.dinputs[self.inputs &lt;= 0] = 0</text>
<rect x="216" y="368" width="40" height="40" class="cell f-purple-soft"/>
<rect x="256" y="368" width="40" height="40" class="cell"/>
<rect x="296" y="368" width="40" height="40" class="cell f-purple-soft"/>
<rect x="216" y="368" width="120" height="40" class="frame" data-fit="skip"/>
<g data-grid="skip">
<text x="236" y="394" text-anchor="middle" class="t-cell16" data-w="10">5</text>
<text x="276" y="394" text-anchor="middle" class="t-cell16" data-w="10">0</text>
<text x="316" y="394" text-anchor="middle" class="t-cell16" data-w="10">7</text>
</g>
<text x="180" y="372" text-anchor="end" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dvalues</tspan></text>
<text x="180" y="412" text-anchor="end" class="t-code" data-w="103"><tspan class="mono f-purple-ink">self.dinputs</tspan></text>
<path d="M188,356 H196 V420 H188" class="brace"/>
<rect x="256" y="368" width="40" height="40" class="emph s-red" data-fit="skip"/>
<text x="352" y="384" class="t-note" data-w="68">one array,</text>
<text x="352" y="404" class="t-note" data-w="73">two names</text>
<text x="216" y="436" class="t-note" data-w="144">the caller's 6 is now 0</text>
<rect x="672" y="336" width="40" height="40" class="cell f-purple-soft"/>
<rect x="712" y="336" width="40" height="40" class="cell f-purple-soft"/>
<rect x="752" y="336" width="40" height="40" class="cell f-purple-soft"/>
<rect x="672" y="336" width="120" height="40" class="frame" data-fit="skip"/>
<g data-grid="skip">
<text x="692" y="362" text-anchor="middle" class="t-cell16" data-w="10">5</text>
<text x="732" y="362" text-anchor="middle" class="t-cell16" data-w="10">6</text>
<text x="772" y="362" text-anchor="middle" class="t-cell16" data-w="10">7</text>
</g>
<rect x="672" y="400" width="40" height="40" class="cell f-purple-soft"/>
<rect x="712" y="400" width="40" height="40" class="cell"/>
<rect x="752" y="400" width="40" height="40" class="cell f-purple-soft"/>
<rect x="672" y="400" width="120" height="40" class="frame" data-fit="skip"/>
<g data-grid="skip">
<text x="692" y="426" text-anchor="middle" class="t-cell16" data-w="10">5</text>
<text x="732" y="426" text-anchor="middle" class="t-cell16" data-w="10">0</text>
<text x="772" y="426" text-anchor="middle" class="t-cell16" data-w="10">7</text>
</g>
<text x="656" y="360" text-anchor="end" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dvalues</tspan></text>
<text x="656" y="424" text-anchor="end" class="t-code" data-w="103"><tspan class="mono f-purple-ink">self.dinputs</tspan></text>
<text x="808" y="360" class="t-note" data-w="75">unchanged</text>
<text x="808" y="424" class="t-note" data-w="53">masked</text>
<text x="40" y="504" class="t-note" data-w="587">Both versions return the same gradient; only the copy leaves the caller's array as it was.</text>
</svg>
