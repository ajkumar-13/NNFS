<rect x="736" y="412" width="64" height="24" rx="4" class="w1 nofill s-green-line" data-fit="skip"/>
<text x="768" y="428" text-anchor="middle" class="t-tick f-green-ink" data-w="45">cached</text>
<text x="812" y="428" class="t-label" data-w="105">kept by forward</text>
<text x="812" y="452" class="t-label" data-w="87">for backward</text>
<text x="40" y="504" class="t-note" data-w="369">Every gradient has the shape of the array it belongs to.</text>
