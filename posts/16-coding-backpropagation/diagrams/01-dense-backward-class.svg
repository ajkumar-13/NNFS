<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-dense-backward-class-title" aria-describedby="nn-01-dense-backward-class-desc">
<title id="nn-01-dense-backward-class-title">One forward call, one backward call, three gradients out</title>
<desc id="nn-01-dense-backward-class-desc">A card with the two methods of Layer_Dense, forward above backward. forward stores self.inputs = inputs, tagged cached because backward reads it, and computes self.output = np.dot(inputs, self.weights) + self.biases. backward takes dvalues and computes self.dweights = np.dot(self.inputs.T, dvalues), self.dbiases = np.sum(dvalues, axis=0, keepdims=True) and self.dinputs = np.dot(dvalues, self.weights.T). Grey arrows, the forward pass, run left to right: inputs of shape (N, n) in, output of shape (N, m) out. Purple arrows, the backward pass, run right to left: dvalues of shape (N, m) in from the next layer, dinputs of shape (N, n) out to the previous layer, which reads it as its dvalues. dweights, shape (n, m), and dbiases, shape (1, m), stay on the layer for the optimiser. Each gradient has the shape of its array.</desc>
