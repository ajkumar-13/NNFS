<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="681">One forward call, one backward call, three gradients out</text>
<text x="40" y="76" class="t-subtitle" data-w="524">The class of section 2, for a batch of <tspan class="i">N</tspan> samples, <tspan class="i">n</tspan> inputs and <tspan class="i">m</tspan> neurons.</text>
<rect x="216" y="104" width="536" height="244" rx="8" class="card"/>
<text x="232" y="136" class="t-code" data-w="154">class Layer_Dense:</text>
<text x="248" y="160" class="t-code" data-w="223">def forward(self, inputs):</text>
<text x="264" y="184" class="t-code" data-w="171">self.inputs = inputs</text>
<text x="264" y="208" class="t-code" data-w="479">self.output = np.dot(inputs, self.weights) + self.biases</text>
<text x="248" y="256" class="t-code" data-w="240">def backward(self, dvalues):</text>
<text x="264" y="280" class="t-code" data-w="393"><tspan class="mono f-purple-ink">self.dweights</tspan><tspan class="mono"> = np.dot(self.inputs.T, dvalues)</tspan></text>
<text x="264" y="304" class="t-code" data-w="453"><tspan class="mono f-purple-ink">self.dbiases</tspan><tspan class="mono"> = np.sum(dvalues, axis=0, keepdims=True)</tspan></text>
<text x="264" y="328" class="t-code" data-w="393"><tspan class="mono f-purple-ink">self.dinputs</tspan><tspan class="mono"> = np.dot(dvalues, self.weights.T)</tspan></text>
<rect x="440" y="168" width="64" height="24" rx="4" class="f-green-soft"/>
<rect x="440" y="168" width="64" height="24" rx="4" class="w1 nofill s-green-line" data-fit="skip"/>
<text x="472" y="184" text-anchor="middle" class="t-tick f-green-ink" data-w="45">cached</text>
<path d="M56,180 L205,180" class="flow" marker-end="url(#nn-01-dense-backward-class-arrow)"/>
<text x="132" y="168" text-anchor="middle" class="t-code" data-w="52"><tspan class="mono">inputs</tspan></text>
<text x="132" y="204" text-anchor="middle" class="t-label" data-w="38">(<tspan class="i">N</tspan>, <tspan class="i">n</tspan>)</text>
<path d="M760,180 L901,180" class="flow" marker-end="url(#nn-01-dense-backward-class-arrow)"/>
<text x="832" y="168" text-anchor="middle" class="t-code" data-w="52"><tspan class="mono">output</tspan></text>
<text x="832" y="204" text-anchor="middle" class="t-label" data-w="42">(<tspan class="i">N</tspan>, <tspan class="i">m</tspan>)</text>
<path d="M904,288 L763,288" class="s-purple w15 nofill" marker-end="url(#nn-01-dense-backward-class-arrow-purple)"/>
<text x="832" y="276" text-anchor="middle" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dvalues</tspan></text>
<text x="832" y="312" text-anchor="middle" class="t-label" data-w="42">(<tspan class="i">N</tspan>, <tspan class="i">m</tspan>)</text>
<path d="M208,288 L59,288" class="s-purple w15 nofill" marker-end="url(#nn-01-dense-backward-class-arrow-purple)"/>
<text x="132" y="276" text-anchor="middle" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dinputs</tspan></text>
<text x="132" y="312" text-anchor="middle" class="t-label" data-w="38">(<tspan class="i">N</tspan>, <tspan class="i">n</tspan>)</text>
<text x="56" y="340" class="t-note" data-w="141">to the previous layer,</text>
<text x="56" y="360" class="t-note" data-w="92">as its <tspan class="mono">dvalues</tspan></text>
<text x="904" y="340" text-anchor="end" class="t-note" data-w="126">from the next layer</text>
<path d="M484,356 L484,385" class="s-purple w15 nofill" marker-end="url(#nn-01-dense-backward-class-arrow-purple)"/>
<text x="496" y="376" class="t-note" data-w="238">stays on the layer, for the optimiser</text>
<rect x="332" y="396" width="304" height="76" rx="8" class="card"/>
<text x="348" y="428" class="t-label" data-w="0"></text>
<text x="348" y="452" class="t-label" data-w="0"></text>
<text x="356" y="428" class="t-code" data-w="69"><tspan class="mono f-purple-ink">dweights</tspan></text>
<text x="452" y="428" class="t-label" data-w="39">(<tspan class="i">n</tspan>, <tspan class="i">m</tspan>)</text>
<text x="612" y="428" text-anchor="end" class="t-code f-ink-muted" data-w="60"><tspan class="mono">weights</tspan></text>
<text x="548" y="428" text-anchor="end" class="t-note" data-w="16">as</text>
<text x="356" y="452" class="t-code" data-w="60"><tspan class="mono f-purple-ink">dbiases</tspan></text>
<text x="452" y="452" class="t-label" data-w="39">(1, <tspan class="i">m</tspan>)</text>
<text x="612" y="452" text-anchor="end" class="t-code f-ink-muted" data-w="52"><tspan class="mono">biases</tspan></text>
<text x="556" y="452" text-anchor="end" class="t-note" data-w="16">as</text>
<path d="M40,424 H64" class="s-arrow w15 nofill"/>
<text x="72" y="428" class="t-label" data-w="101">forward: arrays</text>
<path d="M40,448 H64" class="s-purple w15 nofill"/>
<text x="72" y="452" class="t-label" data-w="136">backward: gradients</text>
