<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-learning-rates-title" aria-describedby="nn-03-learning-rates-desc">
<title id="nn-03-learning-rates-title">No learning rate is both steady and quick</title>
<desc id="nn-03-learning-rates-desc">Six rows, one per learning rate, each with a band from the smallest to the largest final loss over seeds 0 to 4 after 10,001 epochs, on an axis from 0.3 to 2.0 with a dotted line at ln 3 = 1.0986, the loss of the untrained network. 0.001: 1.0984 to 1.0985, crawls; the loss rose on 292 to 462 updates, float32 rounding; 0 to 1 dead of 64. 0.01: 1.0702 to 1.0867, never rose, 2 to 9 dead. 0.1: 1.0014 to 1.0583, never rose, 2 to 10 dead, steady and slow. 1: 0.3943 to 0.9906, rose on 4,154 to 4,765, 2 to 11 dead. 3: 0.3746 to 0.5482, rose on 4,690 to 4,907, 2 to 13 dead; both fast and unsteady. 10: 1.1854 to 1.9295, rose on 6,425 to 6,468, all 64 hidden neurons dead. The 0.001 row is a dot, all five within 0.0001.</desc>
<style>
