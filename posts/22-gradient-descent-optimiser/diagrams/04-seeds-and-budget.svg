<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-04-seeds-and-budget-title" aria-describedby="nn-04-seeds-and-budget-desc">
<title id="nn-04-seeds-and-budget-title">One seed is one draw; 50,000 epochs lift every seed tried</title>
<desc id="nn-04-seeds-and-budget-desc">Ten rows, seeds 0 to 9, on an accuracy axis from 0.35 to 1.0, learning rate 1. For each seed a band spans the lowest to the highest accuracy over epochs 9,001 to 10,000 and a circle marks the accuracy at epoch 10,000; for seeds 0 to 4 a diamond marks the accuracy at epoch 50,000. At epoch 10,000: seed 0 0.6467, seed 1 0.7467, seed 2 0.5367, seed 3 0.8700, seed 4 0.7867, seed 5 0.4300, seed 6 0.7433, seed 7 0.7167, seed 8 0.5867, seed 9 0.7800, from 0.4300 to 0.8700. Bands: 0.5633 to 0.6533, 0.5567 to 0.7967, 0.4200 to 0.6333, 0.5433 to 0.8867, 0.5167 to 0.8100, 0.4000 to 0.6900, 0.5600 to 0.7967, 0.4567 to 0.7467, 0.4733 to 0.6400, 0.4267 to 0.8433. At epoch 50,000: seed 0 0.9067, seed 1 0.9267, seed 2 0.7433, seed 3 0.9500, seed 4 0.9633, higher than at 10,000 for all five, four of them above 0.9. Seed 0 is the documented run.</desc>
