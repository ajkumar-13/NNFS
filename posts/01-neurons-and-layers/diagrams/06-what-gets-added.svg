<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">What the rest of the series adds to the Part 01 formula</title>
  <desc id="d">A hand-drawn accretion diagram. On the left, a card at full weight holds the Part 01 core: output equals the sum of w times x plus b, with the note that every learnable parameter is either a weight or a bias. An arrow leads right to three cards of equal size. The first adds activation functions, ReLU and Softmax, arriving in Part 06, because without them stacking layers collapses back to a single linear layer. The second adds loss functions, cross-entropy, arriving in Part 08, as a way to score predicted outputs against the truth. The third adds backpropagation and an optimiser, arriving across Parts 09 to 27, as a way to adjust the weights and biases so the loss goes down. A band beneath states that with all three in place the same forward pass that printed 4.8, 1.21, 2.385 becomes the inner loop of a network that classifies spirals, recognises handwritten digits, or sorts sentiment, and a footer notes that everything else in the series is detail on these three.</desc>

