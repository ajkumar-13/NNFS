<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">Shape diary: how the arrays change from a single neuron to a batched layer</title>
  <desc id="d">A hand-drawn three-row table tracking the shapes of the input X, the weight matrix W, the bias b, the operation, and the output. Row one covers a single neuron on a single sample: X of shape n, W of shape n, a scalar bias, np.dot of W and X plus b, and a scalar out. Row two covers a layer of m neurons on a single sample: X of shape n, W of shape m by n, a bias of shape m, the same call, and an output of shape m. Row three, tinted to mark it out, covers a layer of m neurons on a batch of N samples: X of shape N by n, W of shape m by n used transposed, a bias of shape m, np.dot of X and W transposed plus b, and an output of shape N by m. Captions note that row three is the only one that transposes, that the transpose changes the call signature rather than the arithmetic, and that printing shapes after every operation catches most shape-mismatch errors.</desc>

  <style><![CDATA[
    :root{--nn-bg:#FAFAF7;--nn-surface:#FFFFFF;--nn-ink:#1A1A1A;--nn-ink-muted:#5C5C5C;--nn-ink-subtle:#9A9A9A;--nn-border:#D9D9D4;--nn-primary:#5B7FBF;--nn-accent:#D98E5F;--nn-success:#5C9E78;--nn-warn:#B8895A;--nn-alert:#C66B5E;--nn-neutral-1:#EAEAE4;--nn-neutral-2:#CFCFC8;--nn-neutral-3:#8E8E88;--nn-on-fill:#FFFDF9;--nn-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--nn-bg:#0E0F12;--nn-surface:#16181C;--nn-ink:#F2F2EE;--nn-ink-muted:#B4B4AE;--nn-ink-subtle:#6E6E68;--nn-border:#2A2D33;--nn-primary:#8BA8E0;--nn-accent:#E8B088;--nn-success:#7FBF9B;--nn-warn:#D4B58A;--nn-alert:#D88880;--nn-neutral-1:#1F2229;--nn-neutral-2:#2C3038;--nn-neutral-3:#6E6E68;--nn-on-fill:#14161A;--nn-on-accent:#1A1A1A;}}
    .bg{fill:var(--nn-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

