<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">Batched forward pass: three samples through three neurons in one call</title>
  <desc id="d">A hand-drawn left-to-right shape equation. A three-by-four grid of inputs is multiplied by a four-by-three grid of transposed weights, giving a three-by-three raw result; a three-element bias vector is then added, giving the three-by-three output. Every grid carries its shape underneath, and a note points out that the inner dimensions of four and four agree only after the transpose. A band below writes the same pass out in numbers, one line per sample: the raw activations plus the bias vector two, three, nought-point-five, giving the printed outputs 4.8, 1.21, 2.385 for the first sample, 8.9, minus 1.81, 0.2 for the second, and 1.41, 1.051, 0.026 for the third. Captions note that each row of the result is one sample’s three activations and each column belongs to one neuron, and that a three-entry bias vector covers every row because the result has three columns.</desc>

