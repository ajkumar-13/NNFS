    @media (prefers-color-scheme:dark){:root{--nn-bg:#0E0F12;--nn-surface:#16181C;--nn-ink:#F2F2EE;--nn-ink-muted:#B4B4AE;--nn-ink-subtle:#6E6E68;--nn-border:#2A2D33;--nn-primary:#8BA8E0;--nn-accent:#E8B088;--nn-success:#7FBF9B;--nn-warn:#D4B58A;--nn-alert:#D88880;--nn-neutral-1:#1F2229;--nn-neutral-2:#2C3038;--nn-neutral-3:#6E6E68;--nn-on-fill:#14161A;--nn-on-accent:#1A1A1A;}}
