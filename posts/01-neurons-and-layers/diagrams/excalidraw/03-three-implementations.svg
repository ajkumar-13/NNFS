<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">The same layer computed three ways: by hand, with loops, with NumPy</title>
  <desc id="d">Three hand-drawn columns of code, each computing the output of the same three-neuron layer. The first column, marked in alert red and titled by hand, writes out every input-weight product for every neuron and is captioned hardcoded and does not scale. The second, in warn tan, uses two nested for-loops over neurons and inputs and is captioned as scaling and clean but still slow. The third, in success green, is the single line outputs equals np.dot of w and x plus biases, captioned as scaling, concise, and vectorised C. The identical result list 4.8, 1.21, 2.385 is repeated at the foot of all three columns to show the arithmetic is unchanged. A band underneath compares the three on lines of code, whether they scale, and speed: roughly thirteen lines that do not scale, seven lines running one operation per bytecode, and one line compiled over the whole array.</desc>

