<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-batch-in-one-call-title" aria-describedby="nn-03-batch-in-one-call-desc">
<title id="nn-03-batch-in-one-call-title">A batch goes through the layer in one call</title>
<desc id="nn-03-batch-in-one-call-desc">Above the grids, the equation Z equals X W transposed plus b and the call np.dot(X, W.T) + b. Four grids in a row: X, 3 by 4, one sample per row, rows 1.0, 2.0, 3.0, 2.5; 2.0, 5.0, minus 1.0, 2.0; minus 1.5, 2.7, 3.3, minus 0.8; times W transposed, 4 by 3, one neuron per column, rows 0.20, 0.50, minus 0.26; 0.80, minus 0.91, minus 0.27; minus 0.50, 0.26, 0.17; 1.00, minus 0.50, 0.87; plus b broadcast to 3 by 3, every row 2.0, 3.0, 0.5, copied from the stored b of shape (3,) drawn above it; equals Z, 3 by 3, rows 4.800, 1.210, 2.385; 8.900, minus 1.810, 0.200; 1.410, 1.051, 0.026. Sample 2's row of X, neuron 2's column of W transposed, b2 and Z entry (2, 2) are outlined: minus 4.81 plus 3.0 is minus 1.81.</desc>
