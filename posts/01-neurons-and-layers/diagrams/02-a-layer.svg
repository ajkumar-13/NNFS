<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-a-layer-title" aria-describedby="nn-02-a-layer-desc">
<title id="nn-02-a-layer-title">A layer is several neurons reading the same inputs</title>
<desc id="nn-02-a-layer-desc">Two panels for the layer of section 7. On the left, the wiring: four inputs x1 to x4, holding 1.0, 2.0, 3.0, 2.5, each connect to all three neurons, twelve lines, and each neuron box reads sigma plus its own bias b1, b2 or b3 and gives z1, z2 or z3. Neuron 2's four lines are drawn in the weight colour, and a note says they are row 2 of W. On the right, the same layer as z equals W x plus b: W is a 3 by 4 grid, one row per neuron, rows 0.20, 0.80, minus 0.50, 1.00; 0.50, minus 0.91, 0.26, minus 0.50; minus 0.26, minus 0.27, 0.17, 0.87; x is 1.0, 2.0, 3.0, 2.5; b is 2.0, 3.0, 0.5; z is 4.800, 1.210, 2.385. Row 2 of W, b2 and z2 are outlined: minus 1.79 plus 3.0 is 1.21. 3 times 4 is 12 weights, plus 3 biases, 15 parameters.</desc>
