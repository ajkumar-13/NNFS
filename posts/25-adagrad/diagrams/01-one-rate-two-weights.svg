<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-one-rate-two-weights-title" aria-describedby="nn-01-one-rate-two-weights-desc">
<title id="nn-01-one-rate-two-weights-title">One rate strands the slow weight; AdaGrad moves both alike</title>
<desc id="nn-01-one-rate-two-weights-desc">Two charts of the weights w1 and w2 of the loss w1 squared over 100 plus w2 squared, against the step, from the start (1, 1), where the gradients are 0.02 and 2.0, for 100 steps with a learning rate of 0.1. Dots mark the steps the script prints. Gradient descent, left: w2 falls to 0.8 after one step and is at 2.037 times 10 to the minus 10 after 100, while w1 moves 0.002 in the first step and ends at 0.8186. AdaGrad, right: the two weights take the same path, 0.9 after one step, 0.5537 after 10, and both end at 0.027387; their caches after 100 steps are 0.004011 and 40.11.</desc>
