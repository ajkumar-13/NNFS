<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-04-five-seeds-title" aria-describedby="nn-04-five-seeds-desc">
<title id="nn-04-five-seeds-title">Above gradient descent on all five seeds, momentum on three</title>
<desc id="nn-04-five-seeds-desc">A dot plot of the final accuracy on the spiral after 10,001 epochs, one row per seed, on an axis from 50 to 100 percent. Gradient descent with learning rate 1 reaches 64.7, 74.7, 53.7, 87.0 and 78.7 percent on seeds 0 to 4; momentum with decay 0.001 and momentum 0.9 reaches 95.7, 68.7, 73.0, 81.7 and 98.0; AdaGrad with decay 0.0001 reaches 84.0, 75.7, 81.7, 92.7 and 79.7. AdaGrad is above gradient descent on all five seeds and above momentum on seeds 1, 2 and 3.</desc>
