" fill="none" stroke="var(--nn-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="62" y="111.8" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="15" fill="var(--nn-primary)">The loss</text><text xml:space="preserve" x="62" y="137.8" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="15" fill="var(--nn-ink)">L(W₁, W₂)  =  W₁² / 100  +  W₂²</text><text xml:space="preserve" x="62" y="161.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-subtle)">evaluated at W₁ = W₂ = 1</text><path d="M56.11 176.34C168.46 175.46 280.66 175.46 444.11 176.28M56.01 176.08C148.05 175.45 239.96 175.53 444.13 176.04" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="62" y="196.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--nn-ink-subtle)">parameter</text><text xml:space="preserve" x="200" y="196.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--nn-ink-subtle)">gradient</text><text xml:space="preserve" x="320" y="196.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--nn-ink-subtle)">relative</text><text xml:space="preserve" x="62" y="223.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-success)">W₁</text><text xml:space="preserve" x="200" y="222.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-ink)">2W₁/100  =  0.02</text><text xml:space="preserve" x="320" y="223.04" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="12" fill="var(--nn-success)">1×</text><text xml:space="preserve" x="62" y="257.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-alert)">W₂</text><text xml:space="preserve" x="200" y="256.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-ink)">2W₂  =  2.0</text><text xml:space="preserve" x="320" y="257.04" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="12" fill="var(--nn-alert)">100×</text><text xml:space="preserve" x="62" y="297.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-muted)">The same surface is a hundred times steeper in one</text><text xml:space="preserve" x="62" y="313.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-muted)">direction than the other, at the very same point.</text><path d="M522.82 85.54C649.14 84.04 771.57 83.87 897.31 84.55C912.05 85.46 917.9 91.82 919.64 108.93C920.53 189.81 918.97 269.64 918.17 312C921.21 328.57 914.54 338.15 894.21 337.76C809.1 336.25 722.69 335.53 525.53 334.83C507.33 336.26 502.45 328.72 498.35 313.38C501.35 233.45 498.96 155.69 499.44 111.8C502.18 93.87 506.77 88.12 524.79 87.16C524 86 524 86 524 86" fill="var(--nn-surface)" stroke="none"/><path d="M524.4 87.2C641.52 85.19 760.39 85.23 895.32 86.27M524.42 86.45C622.98 86.61 720.93 86.36 896.58 86.49M896 86C912.17 87.92 921.3 95.44 920.35 109.57M896.54 84.43C912.24 86.35 921.9 94.33 920.89 109.43M919.04 110.98C921.55 186.51 920.69 266.11 919.72 310.42M920.49 109.5C919.07 186.16 920.1 262.34 919.87 311.55M920 312C919.48 328.87 910.37 336.89 895.35 337.98M921.61 312.3C919.64 328.13 913.88 334.85 895.29 337.35M895.47 336.52C771.71 339.34 647.5