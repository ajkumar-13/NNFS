<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Why a single learning rate cannot serve parameters with different gradient scales</title>
  <desc id="d">A hand-drawn figure in two cards. The left states the loss, W one squared over a hundred plus W two squared, evaluated at both parameters equal to one, and tabulates the two gradients: W one has two W one over a hundred, which is nought point nought two, and W two has two W two, which is two point nought, a hundred times larger. It notes that the same surface is a hundred times steeper in one direction than the other at the very same point. The right card works both candidate learning rates. At alpha of nought point one, sized for W two, W one moves nought point nought nought two which is negligible while W two moves nought point two which is about right. At alpha of ten, sized for W one, W one moves nought point two which is about right while W two moves twenty and diverges. It concludes that there is no third choice. A band explains AdaGrad’s answer: dividing by the root of each parameter’s own accumulated squared gradient means a gradient a hundred times larger accumulates a cache ten thousand times larger, whose root is a hundred times larger, so the two steps come out the same size.</desc>

