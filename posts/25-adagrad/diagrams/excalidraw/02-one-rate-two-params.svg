ml:space="preserve" x="522" y="196.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-ink-muted)">W₂ moves 0.2</text><text xml:space="preserve" x="700" y="196.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-success)">about right</text><path d="M515.88 206C621.44 205.4 727.7 205.54 903.67 206.26M516.15 206.05C640.34 206.3 764.9 206.51 903.84 206.05" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="522" y="237.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--nn-ink)">α = 10</text><text xml:space="preserve" x="600" y="236.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--nn-ink-subtle)">sized for W₁</text><text xml:space="preserve" x="522" y="260.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-ink-muted)">W₁ moves 0.2</text><text xml:space="preserve" x="700" y="260.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-success)">about right</text><text xml:space="preserve" x="522" y="280.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-ink-muted)">W₂ moves 20</text><text xml:space="preserve" x="700" y="280.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-alert)">diverges</text><text xml:space="preserve" x="522" y="318.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-alert)">There is no third choice. Every α is one of these two.</text><path d="M51.98 361.49C363.26 360.12 673.43 360.44 907.89 362.83C917.75 362.86 922.22 367.69 921.67 374.07C918.42 385.11 922.15 394.24 919.88 416.84C921.58 425.63 915.94 431.85 911.19 431.76C626.64 430.25 344.15 428.59 51.58 430.63C44.34 429.03 39.22 427.67 41.6 420.51C42.04 406.2 41.69 394.56 41.88 371.69C38.64 368.36 45.26 362.81 49.19 362.42C51.33 362 51.33 362 51.33 362" fill="var(--nn-neutral-1)" stroke="none"/><path d="M51.61 362C358.19 364.53 664.15 363.78 907.99 362.29M51.57 361.66C227.61 364.25 404.67 363.97 908.36 362.27M908.67 362C916.96 360.82 921.56 367.29 920.63 371.41M908.66 361.41C916.93 363.91 920.36 368.05 919.06 372.14M921.18 374.4C918.84 389.11 918.55 403.92 919.57 418.84M919.21 373.39C920.11 391.72 920.62 409.24 920.6 419.4M920 418.67C920.18 425.6 915.47 431.25 908.2 428.29M921.15 420.12C922.2 425.95 916.95 429.1 907.35 430.59M908.48 429.87C728.18 427.48 548.15 428.49 51.73 430.28M908.78 429.61C604.29 427.15 299.66 427.04 51.11 430.34M51.33 430C43.03 431.54 38.99 426.05 39.84 419.03M50.89 430.6C42.64 430.64 41.31 427.91 40.22 420.92M40.08 416.71C39.02 408.58 38.59 398.64 38.21 371.95M39.19 417.67C40.04 403.88 40.49 387.09 39.7 374.05M40 373.33C38.32 364.96 42.68 362.91 52.55 361.4M40.01 374.64C41.35 364.67 44.71 363.72 51.01 361.46M51.33 362C51.33 362 51.33 362 51.33 362M51.33 362C51.33 362 51.33 362 51.33 362" fill="none" stroke="var(--nn-border)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="480" y="385.04" text-anchor="middle" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--nn-ink)">AdaGrad divides each step by the root of that parameter’s own accumulated g².</text><text xml:space="preserve" x="480" y="408.12" text-anchor="middle" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-ink-muted)">A gradient 100× larger accumulates a cache 10 000× larger, whose root is 100×, so the two steps come out the same size.</text><text xml:space="preserve" x="40" y="455.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--nn-ink-muted)">The hundredfold gap in the gradients cancels itself. What survives is the sign and a step α sets once for everything.</text>
</svg>
