β = 0.0</text><text xml:space="preserve" x="138" y="391.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink-subtle)">·  1 gradient</text><text xml:space="preserve" x="248" y="391.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--ce-ink-muted)">64.7%</text><text xml:space="preserve" x="354" y="391.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--ce-warn)">β = 0.5</text><text xml:space="preserve" x="430" y="391.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink-subtle)">·  2 gradients</text><text xml:space="preserve" x="540" y="391.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--ce-warn)">78.0%</text><text xml:space="preserve" x="646" y="391.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--ce-success)">β = 0.9</text><text xml:space="preserve" x="722" y="391.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink-subtle)">·  10 gradients</text><text xml:space="preserve" x="832" y="391.96" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="13" fill="var(--ce-success)">95.7%</text><text xml:space="preserve" x="40" y="443.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">β = 0.9 averages roughly the last ten gradients: long enough to carry real inertia, short enough to still notice the current one.</text>
