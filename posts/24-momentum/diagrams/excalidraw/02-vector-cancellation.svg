<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">How momentum cancels the bounce and reinforces the descent</title>
  <desc id="d">A hand-drawn figure in two cards. The left shows two consecutive gradient steps taken separately, as vanilla SGD does: step one points down and to the right with an across component of plus one hundred and fifty and a down component of plus thirty-four, and step two points down and to the left with an across component of minus one hundred and fifty and the same down component of plus thirty-four, each decomposed with dashed component lines. The right card adds them first, which is what a velocity buffer does: the across components cancel to zero and the down components sum to plus sixty-eight, so the bounce cancels itself and the descent doubles, with a note that a plateau works the same way because the velocity inherited from a thousand steps is not tiny even when the current gradient is. A strip beneath gives three momentum factors with their effective horizons and measured accuracy: nought averages one gradient for sixty-four point seven per cent, nought point five averages two for seventy-eight, and nought point nine averages ten for ninety-five point seven.</desc>

