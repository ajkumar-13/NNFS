<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-04-beta-over-seeds-title" aria-describedby="nn-04-beta-over-seeds-desc">
<title id="nn-04-beta-over-seeds-title">On the spiral, 0.5 and 0.9 help and 0.99 does not</title>
<desc id="nn-04-beta-over-seeds-desc">Two dot charts, one row per momentum coefficient, each row a band from the lowest to the highest of five seeds with one tick per seed and a dot for seed 0. Left the final loss on an axis from 0 to 1.1, right the accuracy in percent from 30 to 100, with the mean accuracy printed at the right. beta 0: loss 0.7310 to 0.9107 (seed 0 0.7612), accuracy 58.0 to 69.3 percent (seed 0 64.7), mean 64.5; beta 0.5: loss 0.3661 to 0.7216 (seed 0 0.5531), accuracy 71.3 to 85.7 percent (seed 0 78.0), mean 80.2; beta 0.9: loss 0.0865 to 0.5986 (seed 0 0.1209), accuracy 68.7 to 98.0 percent (seed 0 95.7), mean 83.4; beta 0.99: loss 0.5612 to 1.0237 (seed 0 0.7509), accuracy 39.0 to 67.7 percent (seed 0 58.7), mean 54.5.</desc>
