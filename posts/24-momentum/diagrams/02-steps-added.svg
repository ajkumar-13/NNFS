<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-02-steps-added-title" aria-describedby="nn-02-steps-added-desc">
<title id="nn-02-steps-added-title">Momentum adds the steps before it takes them</title>
<desc id="nn-02-steps-added-desc">Two vector diagrams on the ravine, along the floor drawn at four times the scale across, each with a table of the parts along and across. Left, no momentum, from (10, 1): step 1 (minus 0.1900 along, minus 1.9000 across) and step 2 (minus 0.1864, plus 1.7100) are gradient steps taken one after the other; added, they give minus 0.3764 along and minus 0.1900 across, so the across parts nearly cancel and the along parts double. Right, momentum 0.9, from (9.81, minus 0.90): step 2 is 0.9 times step 1 (minus 0.1710, minus 1.7100) plus the same gradient step (minus 0.1864, plus 1.7100), which gives minus 0.3574 along and 0.0000 across. A key names the gradient steps (purple), the velocity carried over (grey), the step taken (black) and the sum never taken (dashed).</desc>
<style>
