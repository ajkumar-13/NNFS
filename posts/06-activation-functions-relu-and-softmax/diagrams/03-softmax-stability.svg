<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-softmax-stability-title" aria-describedby="nn-03-softmax-stability-desc">
<title id="nn-03-softmax-stability-title">Subtracting the row's maximum keeps np.exp from overflowing</title>
<desc id="nn-03-softmax-stability-desc">Two columns of three steps, rows labelled logits, np.exp and divided by the row sum, for the logits 1000, 1001, 999 in float64, where np.exp returns inf above 709.78 (88.72 in float32). Naive column: the logits themselves; np.exp gives inf, inf, inf; dividing by the row sum gives nan, nan, nan, with the two RuntimeWarnings NumPy prints, overflow encountered in exp and invalid value encountered in divide. An arrow labelled minus 1001, the row's maximum, leads to the stable column: the shifted logits are −1, 0, −2, every one at most 0; np.exp gives 0.368, 1.000, 0.135, every one at most 1; dividing by the row sum gives 0.245, 0.665, 0.090, which sum to 1.</desc>
