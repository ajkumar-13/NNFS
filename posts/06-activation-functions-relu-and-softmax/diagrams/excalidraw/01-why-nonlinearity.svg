<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">Why activations matter: linear stacks stay linear</title>
  <desc id="d">Two hand-drawn panels sharing the same axis frame and scale. The left panel, in alert red and labelled no activation, shows a Dense to Dense stack producing a single straight diagonal line, annotated as the only shape available whatever the weights are set to, with a note that Part 03 showed the two layers collapse into one. The right panel, in success green and labelled with ReLU between, shows a Dense to ReLU to Dense stack producing a piecewise-linear curve with four marked bends, annotated as one kink per neuron, with a note that enough of them approximate any continuous shape. A band underneath states that the depth was already there and what the activation adds is the ability to bend, and that without it a fifty-layer stack is still one line.</desc>

