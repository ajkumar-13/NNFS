<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">End-to-end forward pass: spiral data through Dense, ReLU, Dense, Softmax</title>
  <desc id="d">A hand-drawn left-to-right pipeline of five stages. Spiral data X of shape N by two enters a Dense layer of two in and three out, giving shape N by three; that passes through a ReLU activation computing max of nought and x, which leaves the shape unchanged; then a second Dense layer of three in and three out; then Softmax, whose rows sum to one, again leaving the shape at N by three. Annotations mark the first dense layer as the only place the shape changes and both activations as changing values only. A band records the calling convention, that every object writes its result to self.output and the next object reads it, and spells out the four calls in order. A footer notes that only the two dense layers hold parameters, while the two activations have no weights and nothing to learn.</desc>

