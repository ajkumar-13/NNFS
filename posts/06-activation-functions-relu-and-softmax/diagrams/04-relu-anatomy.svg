<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">ReLU: the kink at zero, and the four things it does not do</title>
  <desc id="d">A hand-drawn plot of the rectified linear unit on the left: a flat line along the x axis for negative inputs, a sharp kink at the origin marked with a circle and an arrow, and a straight diagonal rising for positive inputs, labelled f of x equals max of nought and x, with negative in giving nought out and positive in passing through unchanged. Four boundary cards on the right list what ReLU does not do: it is not smooth, since the derivative jumps at zero, though an input is never exactly zero in practice; it is not zero-centred, since every output is non-negative and that biases the next layer; it is not safe from dying, since weights that drive every input negative leave a neuron at zero with zero gradient, never updating again; and it is not a probability, since outputs can be nought, five or ten thousand, which is what the output layer needs softmax for. A footer notes that one kink is not much, but a layer of them shifted and scaled by their own weights can bend any continuous shape.</desc>

