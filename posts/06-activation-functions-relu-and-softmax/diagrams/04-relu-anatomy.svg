,"Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-alert)">Not a probability</text><text xml:space="preserve" x="522" y="375.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Outputs can be 0, 5, or 10000. Turning them into a</text><text xml:space="preserve" x="522" y="387.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">distribution is what the output layer needs softmax for.</text><text xml:space="preserve" x="40" y="431.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">One kink is not much. A layer of them, shifted and scaled by their own weights, is enough to bend any continuous shape.</text>
