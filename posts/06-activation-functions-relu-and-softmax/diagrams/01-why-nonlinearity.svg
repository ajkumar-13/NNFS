<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-why-nonlinearity-title" aria-describedby="nn-01-why-nonlinearity-desc">
<title id="nn-01-why-nonlinearity-title">Two layers make a line; with ReLU between them, a zigzag</title>
<desc id="nn-01-why-nonlinearity-desc">Two line charts of the output against the input x, from minus 1 to 3, for the post's network of one input, three hidden neurons and one output, 10 parameters, with the nine outputs of the snippet as dots. Left, without an activation: the two layers collapse to one layer with W star = 1 and b star = minus 2, and the output is the straight line x minus 2, from minus 3 to 1, written output = x minus 2, slope 1, in the empty upper left. Right, with ReLU between the same layers: the output is 0 up to x = 0, rises to 1 at x = 1, falls to 0 at x = 2 and rises to 1 at x = 3, slopes 0, 1, minus 1 and 1. Diamonds mark the three kinks, at x = 0, 1 and 2, one per hidden neuron, where its weighted sum crosses zero. Under the zigzag: output = a1 minus 2 a2 plus 2 a3, with a k = max(0, x + b k) and b1 = (0, minus 1, minus 2).</desc>
<style>
