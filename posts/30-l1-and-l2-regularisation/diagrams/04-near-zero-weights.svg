<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-04-near-zero-weights-title" aria-describedby="nn-04-near-zero-weights-desc">
<title id="nn-04-near-zero-weights-title">Only L1 leaves near-zero weights in neurons that fire</title>
<desc id="nn-04-near-zero-weights-desc">Two stacked bar charts of the number of the 128 weights of the first layer with |w| below 0.001 after training, one bar per seed, 0 to 4, on an axis from 0 to 24. Each bar splits into weights of dead neurons, grey, and of live neurons, in the weight colour. L2 at 5 times 10 to the minus 4, dead and live: seed 0 18 and 0; seed 1 0 and 0; seed 2 4 and 0; seed 3 12 and 0; seed 4 6 and 0. L1 at the same strength: seed 0 7 and 9; seed 1 2 and 4; seed 2 3 and 11; seed 3 6 and 16; seed 4 3 and 8. Under L2 every near-zero weight belongs to a dead neuron. Without a penalty no weight is below 0.001, and no run has a weight exactly 0.</desc>
