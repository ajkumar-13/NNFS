<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-03-train-and-test-per-seed-title" aria-describedby="nn-03-train-and-test-per-seed-desc">
<title id="nn-03-train-and-test-per-seed-title">Each penalty raised test accuracy on all five seeds</title>
<desc id="nn-03-train-and-test-per-seed-desc">One row per run for seeds 0 to 4, three runs per seed: no penalty, L2 at 5 times 10 to the minus 4 and L1 at the same strength on the first layer, on an accuracy axis from 70 to 100 percent. Each run is a line from its test accuracy, a solid mark, to its training accuracy, a hollow mark; the length is the gap. No penalty, test to training accuracy in percent: seed 0 78.67 to 95.33; seed 1 73.00 to 84.67; seed 2 77.33 to 92.67; seed 3 81.33 to 96.33; seed 4 82.33 to 97.67. L2: seed 0 84.00 to 95.33; seed 1 85.67 to 92.67; seed 2 81.00 to 93.33; seed 3 84.67 to 95.00; seed 4 86.67 to 96.33. L1: seed 0 80.33 to 96.33; seed 1 86.67 to 96.00; seed 2 83.00 to 95.00; seed 3 83.33 to 97.00; seed 4 83.33 to 97.33. Two columns print the test accuracy and the gap in points of each run. On every seed both penalties have the higher test accuracy and the shorter line.</desc>
