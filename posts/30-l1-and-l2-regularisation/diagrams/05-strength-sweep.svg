<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-05-strength-sweep-title" aria-describedby="nn-05-strength-sweep-desc">
<title id="nn-05-strength-sweep-title">Three strengths tie in test accuracy; the largest underfits</title>
<desc id="nn-05-strength-sweep-desc">Two dot charts, one row per L2 strength on the first layer, each row a band from the lowest to the highest of seeds 0 to 4 with one tick per seed and a dot at the mean of the five. Left the training accuracy in percent on an axis from 80 to 100, right the test accuracy from 70 to 95, with the mean test accuracy printed at the right. In percent, no penalty: training 95.33, 84.67, 92.67, 96.33, 97.67; test 78.67, 73.00, 77.33, 81.33, 82.33, mean 78.53; 10 to the minus 4: training 96.33, 95.00, 95.00, 96.33, 98.67; test 84.67, 88.33, 78.33, 84.33, 87.67, mean 84.67; 5 times 10 to the minus 4: training 95.33, 92.67, 93.33, 95.00, 96.33; test 84.00, 85.67, 81.00, 84.67, 86.67, mean 84.40; 10 to the minus 3: training 95.00, 93.33, 93.67, 94.67, 95.67; test 82.33, 86.33, 81.33, 81.00, 86.67, mean 83.53; 10 to the minus 2: training 85.00, 84.33, 87.33, 89.00, 81.00; test 76.67, 79.67, 76.67, 76.00, 77.67, mean 77.33. No penalty in grey, the four strengths in blue.</desc>
