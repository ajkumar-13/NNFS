      --nn-ink-subtle: #6E6E68;
      --nn-border: #2A2D33;
      --nn-primary: #8BA8E0;
      --nn-accent: #E8B088;
      --nn-success: #7FBF9B;
      --nn-warn: #D4B58A;
      --nn-alert: #D88880;
      --nn-neutral-1: #1F2229;
      --nn-neutral-2: #2C3038;
      --nn-neutral-3: #6E6E68;
      --nn-on-fill: #14161A;
      --nn-on-accent: #1A1A1A;
      --nn-grid: rgba(241, 238, 232, 0.08);
      --nn-contour: rgba(139, 168, 224, 0.10);
      --nn-contour-line: rgba(139, 168, 224, 0.35);
      --nn-rule: #6A6D74;
      --nn-arrow: #9A9A94;
      --nn-neutral-soft: #1C1E23;
      --nn-blue: #5AA8E0;
      --nn-blue-ink: #7DBBE8;
      --nn-blue-soft: #14283A;
      --nn-blue-line: #2E5878;
      --nn-orange: #E8B040;
      --nn-orange-ink: #F0C060;
      --nn-orange-soft: #33260F;
      --nn-orange-line: #6E5222;
      --nn-green: #3CC497;
      --nn-green-ink: #62D1AC;
      --nn-green-soft: #10302A;
      --nn-green-line: #2A6A55;
      --nn-red: #E8796E;
      --nn-red-ink: #F09A90;
      --nn-red-soft: #3A1A18;
      --nn-red-line: #7A3A34;
      --nn-purple: #D58CC4;
      --nn-purple-ink: #E2A6D3;
      --nn-purple-soft: #331F2E;
      --nn-purple-line: #6E4466;
    }
