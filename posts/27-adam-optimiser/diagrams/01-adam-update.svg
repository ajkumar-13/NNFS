<defs>
<marker id="nn-01-adam-update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="524">Two averages, two corrections, one update</text>
<text x="40" y="76" class="t-subtitle" data-w="680">One parameter, <tspan class="i">t</tspan> counted from 1. The numbers: the first update of a constant gradient <tspan class="i">g</tspan> = 0.5.</text>
<rect x="40" y="224" width="96" height="112" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="88" y="276" text-anchor="middle" class="t-math f-purple-ink" data-w="16"><tspan class="i">g</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan></text>
<text x="88" y="304" text-anchor="middle" class="t-note" data-w="56">gradient</text>
<rect x="168" y="112" width="280" height="136" rx="8" class="card"/>
<text x="184" y="144" class="t-head" data-w="183">First moment, <tspan class="i">β</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> = 0.9</text>
<text x="184" y="184" class="t-math" data-w="206"><tspan class="i">m</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan> = <tspan class="i">β</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> <tspan class="i">m</tspan><tspan class="sub" dy="4"><tspan class="i">t</tspan>−1</tspan><tspan dy="-4">​</tspan> + (1 − <tspan class="i">β</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan>) <tspan class="i">g</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan></text>
<text x="184" y="208" class="t-note" data-w="248">the averaging of momentum, post 24</text>
<text x="184" y="232" class="t-label" data-w="140"><tspan class="i">m</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> = 0.1 · 0.5 = 0.05</text>
<rect x="480" y="112" width="208" height="136" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="496" y="144" class="t-head" data-w="128">Correction of <tspan class="i">m</tspan></text>
<text x="496" y="184" class="t-math" data-w="164"><tspan class="i">m̂</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan> = <tspan class="i">m</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan> / (1 − <tspan class="i">β</tspan><tspan class="sub i" dy="-6">t</tspan><tspan class="sub" dx="-3.61" dy="10">1</tspan><tspan dy="-4">​</tspan>)</text>
<text x="496" y="208" class="t-note" data-w="145">divides by 0.1 at <tspan class="i">t</tspan> = 1</text>
<text x="496" y="232" class="t-label" data-w="155"><tspan class="i">m̂</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> = 0.05 / 0.1 = 0.5</text>
<rect x="168" y="280" width="280" height="136" rx="8" class="card"/>
<text x="184" y="312" class="t-head" data-w="225">Second moment, <tspan class="i">β</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan> = 0.999</text>
<text x="184" y="352" class="t-math" data-w="201"><tspan class="i">v</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan> = <tspan class="i">β</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan> <tspan class="i">v</tspan><tspan class="sub" dy="4"><tspan class="i">t</tspan>−1</tspan><tspan dy="-4">​</tspan> + (1 − <tspan class="i">β</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan>) <tspan class="i">g</tspan><tspan class="sub" dy="-6">2</tspan><tspan class="sub i" dx="-7.01" dy="10">t</tspan><tspan dx="3.98" dy="-4">​</tspan></text>
<text x="184" y="376" class="t-note" data-w="211">the cache of RMSProp, post 26</text>
<text x="184" y="400" class="t-label" data-w="183"><tspan class="i">v</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> = 0.001 · 0.25 = 0.00025</text>
<rect x="480" y="280" width="208" height="136" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="496" y="312" class="t-head" data-w="122">Correction of <tspan class="i">v</tspan></text>
<text x="496" y="352" class="t-math" data-w="151"><tspan class="i">v̂</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan> = <tspan class="i">v</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan> / (1 − <tspan class="i">β</tspan><tspan class="sub i" dy="-6">t</tspan><tspan class="sub" dx="-3.61" dy="10">2</tspan><tspan dy="-4">​</tspan>)</text>
<text x="496" y="376" class="t-note" data-w="161">divides by 0.001 at <tspan class="i">t</tspan> = 1</text>
<text x="496" y="400" class="t-label" data-w="77"><tspan class="i">v̂</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> = 0.25</text>
<rect x="720" y="196" width="200" height="168" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="736" y="228" class="t-head" data-w="134">Update, <tspan class="i">ε</tspan> = 10<tspan class="sub" dy="-6">−7</tspan><tspan dy="6">​</tspan></text>
<text x="736" y="268" class="t-math" data-w="70"><tspan class="i">θ</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan> = <tspan class="i">θ</tspan><tspan class="sub" dy="4"><tspan class="i">t</tspan>−1</tspan><tspan dy="-4">​</tspan></text>
<text x="752" y="292" class="t-math" data-w="184">− <tspan class="i">α</tspan> · <tspan class="i">m̂</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan> / (√<tspan class="i">v̂</tspan><tspan class="sub i" dy="4">t</tspan><tspan dy="-4">​</tspan> + <tspan class="i">ε</tspan>)</text>
<text x="736" y="324" class="t-label" data-w="179">first step: <tspan class="i">α</tspan> · 0.5 / (0.5 + <tspan class="i">ε</tspan>)</text>
<text x="736" y="348" class="t-label" data-w="65">= 1.000 <tspan class="i">α</tspan></text>
<path d="M136,280 L152,280 L152,180 L165,180" class="flow" marker-end="url(#nn-01-adam-update-arrow)"/>
<path d="M136,280 L152,280 L152,348 L165,348" class="flow" marker-end="url(#nn-01-adam-update-arrow)"/>
<path d="M448,180 L477,180" class="flow" marker-end="url(#nn-01-adam-update-arrow)"/>
<path d="M448,348 L477,348" class="flow" marker-end="url(#nn-01-adam-update-arrow)"/>
<path d="M688,180 L704,180 L704,236 L717,236" class="flow" marker-end="url(#nn-01-adam-update-arrow)"/>
<path d="M688,348 L704,348 L704,324 L717,324" class="flow" marker-end="url(#nn-01-adam-update-arrow)"/>
<rect x="40" y="444" width="32" height="20" rx="4" class="f-purple-soft s-purple-line w1"/>
<text x="84" y="460" class="t-label" data-w="56">gradient</text>
<rect x="172" y="444" width="32" height="20" rx="4" class="card"/>
<text x="216" y="460" class="t-label" data-w="258">optimiser state, kept between updates</text>
<rect x="512" y="444" width="32" height="20" rx="4" class="f-blue-soft s-blue-line w1"/>
<text x="556" y="460" class="t-label" data-w="194">bias correction, new in Adam</text>
<rect x="788" y="444" width="32" height="20" rx="4" class="f-orange-soft s-orange-line w1"/>
<text x="832" y="460" class="t-label" data-w="70">parameter</text>
<text x="40" y="504" class="t-note" data-w="575">Without the corrections the first step would be 0.05 / √0.00025 = 3.162 learning rates.</text>
</svg>
