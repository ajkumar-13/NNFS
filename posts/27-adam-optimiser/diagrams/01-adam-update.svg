<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-adam-update-title" aria-describedby="nn-01-adam-update-desc">
<title id="nn-01-adam-update-title">Two averages, two corrections, one update</title>
<desc id="nn-01-adam-update-desc">A flow diagram of the Adam update for one parameter. The gradient g t feeds two lanes. Top, the first moment with beta 1 = 0.9, m t = beta 1 m t minus 1 plus (1 minus beta 1) g t, the averaging of momentum from post 24, then its correction m hat t = m t over (1 minus beta 1 to the t). Bottom, the second moment with beta 2 = 0.999, v t = beta 2 v t minus 1 plus (1 minus beta 2) g t squared, the cache of RMSProp from post 26, then its correction v hat t = v t over (1 minus beta 2 to the t). Both feed the update theta t = theta t minus 1 minus alpha times m hat t over (root of v hat t plus epsilon), epsilon = 10 to the minus 7. For the first update of a constant gradient 0.5: m 1 = 0.05 and v 1 = 0.00025; the corrections divide by 0.1 and 0.001 and give m hat 1 = 0.5 and v hat 1 = 0.25, so the step is alpha times 0.5 over (0.5 plus epsilon), one learning rate. Without the corrections it would be 3.162 learning rates.</desc>
