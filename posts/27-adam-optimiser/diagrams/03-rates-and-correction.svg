<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-rates-and-correction-title" aria-describedby="nn-03-rates-and-correction-desc">
<title id="nn-03-rates-and-correction-title">Larger early steps help at 0.02 and wreck training at 0.1</title>
<desc id="nn-03-rates-and-correction-desc">A chart of the final training accuracy on the spiral after 10,001 epochs, one row per setting, each a band from the lowest to the highest of seeds 0 to 4 with a tick per seed and a dot for seed 0, on an axis from 40 to 100 percent, with the mean and the number of seeds that pass 90 percent at the right. Adam at 0.001: 93.3, 88.0, 88.0, 91.3, 92.3 for seeds 0 to 4, mean 90.6, 3 of 5 past 90 percent; Adam at 0.02: 96.3, 82.3, 81.3, 88.7, 96.3 for seeds 0 to 4, mean 89.0, 2 of 5 past 90 percent; Adam at 0.1: 95.3, 96.3, 89.3, 94.3, 98.7 for seeds 0 to 4, mean 94.8, 5 of 5 past 90 percent; Adam without the correction at 0.02: 96.7, 97.0, 96.3, 93.3, 97.3 for seeds 0 to 4, mean 96.1, 5 of 5 past 90 percent; Adam without the correction at 0.1: 49.0, 41.7, 52.0, 45.3, 45.7 for seeds 0 to 4, mean 46.7, 0 of 5 past 90 percent.</desc>
