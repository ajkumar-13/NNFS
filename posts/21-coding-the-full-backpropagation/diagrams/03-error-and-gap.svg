<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-03-error-and-gap-title" aria-describedby="nn-03-error-and-gap-desc">
<title id="nn-03-error-and-gap-title">A failed line is read together with its gap</title>
<desc id="nn-03-error-and-gap-desc">A scatter plot on two logarithmic axes: across, the largest relative error of a gradient array, from 10 to the minus 12 to 10; up, its largest absolute gap, from 10 to the minus 14 to 10 to the 4. Points are given as relative error and gap. Blue circles, the passing check of section 9 at scale 1: dense2.dweights 3.5 times 10 to the minus 10 and 1.4 times 10 to the minus 11; dense2.dbiases 6.1 times 10 to the minus 11 and 1.6 times 10 to the minus 11; dense1.dweights 3.3 times 10 to the minus 10 and 1.9 times 10 to the minus 11; dense1.dbiases 1.4 times 10 to the minus 11 and 4.7 times 10 to the minus 12. Orange triangles, the check on the script's 0.01 weights: dense2.dweights 4.0 times 10 to the minus 7 and 1.3 times 10 to the minus 11; dense2.dbiases 6.1 times 10 to the minus 7 and 6.5 times 10 to the minus 12; dense1.dweights 1.4 times 10 to the minus 3 and 6.8 times 10 to the minus 8; dense1.dbiases 1.0 times 10 to the minus 1 and 1.1 times 10 to the minus 5. Hollow orange squares, the same without the ten samples near a ReLU corner: dense2.dweights 3.1 times 10 to the minus 7 and 1.2 times 10 to the minus 11; dense2.dbiases 8.9 times 10 to the minus 9 and 1.0 times 10 to the minus 11; dense1.dweights 1.5 times 10 to the minus 6 and 9.6 times 10 to the minus 12; dense1.dbiases 6.3 times 10 to the minus 8 and 1.2 times 10 to the minus 11. Red diamonds, a backward pass without the division by N: all four at a relative error of 1.0, with gaps 3.7 times 10 to the 1, 1.4 times 10 to the 2, 1.7 times 10 to the 1, 9.9 times 10 to the 1. A dotted vertical line marks the pass mark, 10 to the minus 7, with the passing side shaded; a dotted horizontal line marks 6.0 times 10 to the minus 11, the largest gap of the correct code at scale 1 on seeds 0 to 49, labelled above: the two slopes disagree, and below: rounding. Dashed arrows take the two dense1 points of the 0.01 check down to the rounding level once the ten samples are left out, labelled without the 10 samples.</desc>
