l="var(--ce-ink-muted)">wired together correctly and the forward pass</text><text xml:space="preserve" x="62" y="274.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">is sound.</text><text xml:space="preserve" x="62" y="302.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-alert)">Anything far from 1.0986 on iteration zero is a</text><text xml:space="preserve" x="62" y="320.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-alert)">bug that no amount of training will fix.</text><path d="M525.12 86.13C645.2 86.34 769.52 86.59 897.19 84.63C914.41 87.83 918.05 94.61 920.17 108.63C919.5 199.98 920.18 289.62 920.94 342.99C921.15 359.64 913.28 368.2 895.22 366.89C765.96 367.36 637.16 367.48 525.19 365.53C506.26 366.46 498.66 359.47 500.41 340.7C500.32 270.02 501.4 198.06 499.12 110.02C501.04 92.56 508.91 86.61 525.28 87.28C524 86 524 86 524 86" fill="var(--ce-surface)" stroke="none"/><path d="M524.39 86.58C600.8 84.28 679.01 84.93 894.96 87.05M524.02 85.79C601.16 84.75 678.96 84.32 895.94 85.48M896 86C912.07 86.44 920.59 94.76 920.31 109.81M895.3 86.93C911.4 84.56 918.33 92.47 918.89 108M920.47 109.24C920.49 178.06 920.71 247.42 918.62 342.49M920.37 109.16C919.99 181.65 921.05 252.6 919.21 341.4M920 342C920.7 357.79 910.89 364.16 895.32 367.27M918.36 340.11C920.75 359.73 910.24 367.11 896.92 366.71M897.07 365.82C776.53 365.64 658.77 365.48 524 365.09M896.34 365.76C751.76 367.6 607.09 368.5 523.76 365.89M524 366C508.58 365.75 498.27 358.75 498.73 341.96M524.98 366.47C507.42 366.83 499.02 357.44 498.95 344.12M498.53 341.58C502.84 267.33 502.15 193.54 500.21 108.81M499.51 341.74C501.61 293.35 501.48 246.54 499.96 110.82M500 110C498.63 93.25 509.87 87.42 524.69 87.3M498.12 109.39C501.1 91.98 507.78 86.1