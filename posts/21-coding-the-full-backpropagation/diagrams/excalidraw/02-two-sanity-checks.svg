<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">Two checks that confirm the backward pass before training starts</title>
  <desc id="d">Two hand-drawn cards. The first, check one, compares the loss the script prints on step zero, one point nought nine eight six, against chance for three classes, minus the log of one third, which is also one point nought nine eight six. A match means softmax and cross-entropy are wired together correctly and the forward pass is sound; anything far from it on iteration zero is a bug no amount of training will fix. The second, check two, pairs each parameter with its gradient and its shape: dense1.weights with dweights at two by three, dense1.biases with dbiases at one by three, dense2.weights with dweights at three by three, and dense2.biases with dbiases at one by three, for twenty-one parameters and twenty-one gradients, shape for shape, with magnitudes of order one in a thousand to one in ten thousand. A band notes that a backward pass can be wrong in a way that still runs, still returns arrays and still lets the loss drift downwards, and that these two checks cost one print each and rule that out before the training loop is written.</desc>

