",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">21 parameters, 21 gradients, shape for shape.</text><text xml:space="preserve" x="522" y="330.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-alert)">Magnitudes of order 1e−3 to 1e−4. Anything much</text><text xml:space="preserve" x="522" y="348.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-alert)">larger on step zero means the initialisation is wrong.</text><path d="M50.34 392.62C307.18 391.54 564.9 390.99 909.96 392.11C914.89 391.28 922.12 393.66 921.32 401.21C919.66 410.97 918.23 422.76 921.25 441.13C919.88 449.1 918.96 453.82 911.85 452.61C578.69 452.58 250.07 451.93 49.71 451.63C41.15 450.9 41.75 446.15 38.49 443.9C39.67 430.53 40.16 417 38.69 401.68C41.14 397.06 43.38 392.09 47.53 394.07C50 392 50 392 50 392" fill="var(--ce-neutral-1)" stroke="none"/><path d="M49.21 391.21C246.94 395.1 443.49 395.69 910.54 391.41M49.61 391.94C374.13 388.27 698.32 388.61 909.71 391.91M910 392C914.8 393.14 918.03 397.3 920.66 402.58M910.83 392.41C916.41 390.51 919.68 395.77 920.39 400.22M920.09 403.07C919.57 410.65 919.79 418.27 919.11 441.95M920.62 401.68C919.25 413.7 919.03 427.78 919.8 441.53M920 442C920.71 448.77 915.56 451.06 909.55 453.43M919.32 440.91C918.4 447.33 915.22 451.13 910.66 453.02M910.19 452.71C665.31 454.63 419.88 455.74 50.28 451.9M910.29 451.77C697.16 449.21 484.65 448.99 50.19 452.19M50 452C44.55 450.28 40.77 448.21 38.8 441.83M49.42 451.47C44.12 454.15 37.81 447.72 40.56 440.33M41.77 441.04C41.47 431.28 40.51 417.76 39.73 403.86M40.31 441.42C40.41 428.97 39.68 417.34 40.73 402.41M40 402C40.57 396.6 42.9 390.01 50.31 392.36M40 403.68C38.75 396.94 45.26 390.59 52.26 392.03M50 392C50 392 50 392 50 392M50 392C50 392 50 392 50 392" fill="none" stroke="var(--ce-border)" stroke-width="1.2" stroke-linecap="round" stroke-