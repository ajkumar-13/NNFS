.73 160.71 54.34 201.01" fill="none" stroke="var(--nn-ink-muted)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="68" y="110.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-ink-muted)"># Network.</text><text xml:space="preserve" x="68" y="128.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">dense1 = Layer_Dense(2, 3)</text><text xml:space="preserve" x="68" y="145.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">activation1 = Activation_ReLU()</text><text xml:space="preserve" x="68" y="162.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">dense2 = Layer_Dense(3, 3)</text><text xml:space="preserve" x="68" y="179.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">loss_activation = \</text><text xml:space="preserve" x="68" y="196.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">    Activation_Softmax_Loss_CategoricalCrossentropy()</text><path d="M54.31 209.46C53.07 243.41 53.69 275.41 54.58 292.14M54.36 209.76C53.86 234.22 53.97 258.67 53.9 291.93" fill="none" stroke="var(--nn-primary)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="68" y="218.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-primary)"># Forward.</text><text xml:space="preserve" x="68" y="236.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">dense1.forward(X)</text><text xml:space="preserve" x="68" y="253.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">activation1.forward(dense1.output)</text><text xml:space="preserve" x="68" y="270.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">dense2.forward(activation1.output)</text><text xml:space="preserve" x="68" y="287.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">loss = loss_activation.forward(dense2.output, y)</text><path d="M54.32 304.47C52.88 321.58 53.04 339.31 53.16 386.86M54.02 303.83C53.59 321.21 54.05 337.88 53.95 385.57" fill="none" stroke="var(--nn-alert)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="68" y="312.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-alert)"># Backward.</text><text xml:space="preserve" x="68" y="330.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">loss_activation.backward(loss_activation.output, y)</text><text xml:space="preserve" x="68" y="347.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">dense2.backward(loss_activation.dinputs)</text><text xml:space="preserve" x="68" y="364.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">activation1.backward(dense2.dinputs)</text><text xml:space="preserve" x="68" y="381.28" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="9" fill="var(--nn-ink)">dense1.backward(activation1.dinputs)</text><path d="M603.65 84.73C702.72 83.99 802.65 83.27 897.73 84.15C909.7 88.29 917.75 94.24 919.11 109.23C921.47 222.58 918.18 331.54 920.01 391.11C921.27 407.51 910.6 418.1 898.39 413.43C802.71 418.54 713.02 416.65 602.39 417.59C588.4 416.05 581.05 407.98 581.49 