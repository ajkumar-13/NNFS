ont-size="11" fill="var(--nn-accent)">9</text><text xml:space="preserve" x="602" y="281.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--nn-ink)">dense2.dbiases</text><text xml:space="preserve" x="756" y="281.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--nn-ink-muted)">(1, 3)</text><text xml:space="preserve" x="852" y="282.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--nn-accent)">3</text><path d="M595.86 316C688.48 315.78 781.03 315.09 904.09 316.07M595.88 316.12C703.2 315.52 810.48 315.6 903.85 316.19" fill="none" stroke="var(--nn-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="602" y="343.64" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="17" fill="var(--nn-accent)">21 gradients</text><text xml:space="preserve" x="602" y="365.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-muted)">Exactly the 21 parameters Part 09</text><text xml:space="preserve" x="602" y="381.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--nn-ink-muted)">said random search could never find.</text><path d="M49.43 441.85C316.16 439.6 581.49 440.58 910.11 442C915.38 441.75 921.83 443.29 920.27 451.81C922.5 463.43 921.17 473.34 920.15 493.99C920.01 496.97 916.28 503.72 909.82 504.34C609.64 501.47 308.93 501.81 50.15 502.79C43.29 500.49 38.94 499.86 39.58 494.06C38.62 482.33 41.62 472.31 39.52 450.46C38.23 444.5 44.28 439.92 51.75 443.83C50 442 50 442 50 442" fill="var(--nn-neutral-1)" stroke="none"/><path d="M49.22 442.01C258.32 440.81 466.2 442.21 909.4 441.98M50.13 442C300.05 443.84 550.37 443.6 909.75 441.63M9