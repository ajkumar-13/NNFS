<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">The fifteen-line full forward and backward script</title>
  <desc id="d">A hand-drawn code-and-shapes layout. The left card holds the script in three spined blocks. Network instantiates dense1 as Layer_Dense of two and three, an ReLU activation, dense2 as Layer_Dense of three and three, and the fused softmax cross-entropy object. Forward runs dense1, the activation, dense2 and the loss in order. Backward runs the loss, dense2, the activation and dense1 in reverse, each reading the previous call’s dinputs. The right card lists what the script leaves on the instances: dense1.dweights of shape two by three holding six numbers, dense1.dbiases of shape one by three holding three, dense2.dweights of shape three by three holding nine, and dense2.dbiases holding three, totalling twenty-one gradients — exactly the twenty-one parameters Part 09 said random search could never find. A band notes that this is one step, nothing has been updated yet, and Part 22 wraps the same lines in a loop with an optimiser.</desc>

