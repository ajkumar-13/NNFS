<defs>
<marker id="nn-01-forward-backward-script-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="628">Fifteen lines leave four gradient arrays, 21 numbers</text>
<text x="40" y="76" class="t-subtitle" data-w="583">The script of section 8 on the 300 spiral points, and what each line leaves behind.</text>
<rect x="40" y="104" width="616" height="436" rx="8" class="card"/>
<text x="68" y="136" text-anchor="end" class="t-tick" data-w="8">1</text>
<text x="80" y="136" class="t-code f-ink-muted" data-w="86"># Network.</text>
<text x="68" y="160" text-anchor="end" class="t-tick" data-w="8">2</text>
<text x="80" y="160" class="t-code" data-w="223">dense1 = Layer_Dense(2, 3)</text>
<text x="68" y="184" text-anchor="end" class="t-tick" data-w="8">3</text>
<text x="80" y="184" class="t-code" data-w="265">activation1 = Activation_ReLU()</text>
<text x="68" y="208" text-anchor="end" class="t-tick" data-w="8">4</text>
<text x="80" y="208" class="t-code" data-w="223">dense2 = Layer_Dense(3, 3)</text>
<text x="68" y="232" text-anchor="end" class="t-tick" data-w="8">5</text>
<text x="80" y="232" class="t-code" data-w="573">loss_activation = Activation_Softmax_Loss_CategoricalCrossentropy()</text>
<text x="68" y="280" text-anchor="end" class="t-tick" data-w="8">6</text>
<text x="80" y="280" class="t-code f-ink-muted" data-w="86"># Forward.</text>
<text x="68" y="304" text-anchor="end" class="t-tick" data-w="8">7</text>
<text x="80" y="304" class="t-code" data-w="146">dense1.forward(X)</text>
<text x="68" y="328" text-anchor="end" class="t-tick" data-w="8">8</text>
<text x="80" y="328" class="t-code" data-w="291">activation1.forward(dense1.output)</text>
<text x="68" y="352" text-anchor="end" class="t-tick" data-w="8">9</text>
<text x="80" y="352" class="t-code" data-w="291">dense2.forward(activation1.output)</text>
<text x="68" y="376" text-anchor="end" class="t-tick" data-w="16">10</text>
<text x="80" y="376" class="t-code" data-w="410">loss = loss_activation.forward(dense2.output, y)</text>
<text x="68" y="424" text-anchor="end" class="t-tick" data-w="16">11</text>
<text x="80" y="424" class="t-code f-ink-muted" data-w="94"># Backward.</text>
<text x="68" y="448" text-anchor="end" class="t-tick" data-w="16">12</text>
<text x="80" y="448" class="t-code" data-w="436">loss_activation.backward(loss_activation.output, y)</text>
<text x="68" y="472" text-anchor="end" class="t-tick" data-w="16">13</text>
<text x="80" y="472" class="t-code" data-w="342">dense2.backward(loss_activation.dinputs)</text>
<text x="68" y="496" text-anchor="end" class="t-tick" data-w="16">14</text>
<text x="80" y="496" class="t-code" data-w="308">activation1.backward(dense2.dinputs)</text>
<text x="68" y="520" text-anchor="end" class="t-tick" data-w="16">15</text>
<text x="80" y="520" class="t-code" data-w="308">dense1.backward(activation1.dinputs)</text>
<text x="672" y="136" class="t-head" data-w="93">Left behind</text>
<text x="672" y="160" class="t-code f-orange-ink" data-w="60">weights</text>
<text x="736" y="160" class="t-label" data-w="39">(2, 3),</text>
<text x="776" y="160" class="t-code f-orange-ink" data-w="52">biases</text>
<text x="832" y="160" class="t-label" data-w="35">(1, 3)</text>
<text x="672" y="208" class="t-code f-orange-ink" data-w="60">weights</text>
<text x="736" y="208" class="t-label" data-w="39">(3, 3),</text>
<text x="776" y="208" class="t-code f-orange-ink" data-w="52">biases</text>
<text x="832" y="208" class="t-label" data-w="35">(1, 3)</text>
<text x="672" y="184" class="t-note" data-w="98">no parameters</text>
<text x="672" y="232" class="t-note" data-w="98">no parameters</text>
<text x="672" y="304" class="t-label" data-w="76"><tspan class="b">Z</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan>  (300, 3)</text>
<text x="672" y="328" class="t-label" data-w="77"><tspan class="b">A</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan>  (300, 3)</text>
<text x="672" y="352" class="t-label" data-w="76"><tspan class="b">Z</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan>  (300, 3)</text>
<text x="672" y="376" class="t-value f-ink" data-w="106">loss 1.0986104</text>
<text x="672" y="400" class="t-note" data-w="112">ln 3 = 1.0986123</text>
<text x="672" y="448" class="t-code f-purple-ink" data-w="60">dinputs</text>
<text x="736" y="448" class="t-label" data-w="51">(300, 3)</text>
<text x="672" y="472" class="t-code f-purple-ink" data-w="69">dweights</text>
<text x="744" y="472" class="t-label" data-w="39">(3, 3),</text>
<text x="784" y="472" class="t-code f-purple-ink" data-w="60">dbiases</text>
<text x="848" y="472" class="t-label" data-w="35">(1, 3)</text>
<text x="672" y="496" class="t-code f-purple-ink" data-w="60">dinputs</text>
<text x="736" y="496" class="t-label" data-w="125">(300, 3), 456 zeros</text>
<text x="672" y="520" class="t-code f-purple-ink" data-w="69">dweights</text>
<text x="744" y="520" class="t-label" data-w="39">(2, 3),</text>
<text x="784" y="520" class="t-code f-purple-ink" data-w="60">dbiases</text>
<text x="848" y="520" class="t-label" data-w="35">(1, 3)</text>
<text x="40" y="568" class="t-note" data-w="211">Every backward call also stores</text>
<text x="236" y="568" class="t-code f-purple-ink" data-w="60">dinputs</text>
<text x="300" y="568" class="t-note" data-w="123">for the call after it.</text>
<rect x="40" y="604" width="16" height="16" class="f-orange s-orange w1"/>
<text x="72" y="616" class="t-label" data-w="270">parameters: 6 + 3 + 9 + 3 = 21 numbers</text>
<rect x="392" y="604" width="16" height="16" class="f-purple s-purple w1"/>
<text x="424" y="616" class="t-label" data-w="254">gradients: 21 entries, shape for shape</text>
<text x="40" y="684" class="t-note" data-w="438">Each gradient array has the shape of the parameter it belongs to.</text>
</svg>
