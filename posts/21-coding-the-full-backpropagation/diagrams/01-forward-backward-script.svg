<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-forward-backward-script-title" aria-describedby="nn-01-forward-backward-script-desc">
<title id="nn-01-forward-backward-script-title">Fifteen lines leave four gradient arrays, 21 numbers</title>
<desc id="nn-01-forward-backward-script-desc">The script of section 8 as a numbered listing of fifteen lines in three groups, each opened by a comment: # Network., four objects; # Forward., four forward calls; # Backward., four backward calls. Beside each line, what it leaves behind. Network: dense1 = Layer_Dense(2, 3) creates weights (2, 3) and biases (1, 3), dense2 = Layer_Dense(3, 3) creates weights (3, 3) and biases (1, 3), both in orange; activation1 and loss_activation have no parameters. Forward: Z1, A1 and Z2, each (300, 3), and the loss 1.0986104 beside ln 3 = 1.0986123. Backward: loss_activation.backward stores dinputs (300, 3); dense2.backward stores dweights (3, 3) and dbiases (1, 3); activation1.backward stores dinputs (300, 3) with 456 zeros at closed gates; dense1.backward stores dweights (2, 3) and dbiases (1, 3), the gradients in purple. Each gradient array lines up with its parameter's shape. A note says each backward call also stores dinputs for the next call, and a key gives the 21 numbers: 6 + 3 + 9 + 3 parameters and as many gradient entries.</desc>
