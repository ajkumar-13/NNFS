<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-04-ten-seeds-title" aria-describedby="nn-04-ten-seeds-desc">
<title id="nn-04-ten-seeds-title">RMSProp mostly ends higher, and spikes late on most seeds</title>
<desc id="nn-04-ten-seeds-desc">Three dot plots, one row per seed from 0 to 9, AdaGrad (learning rate 1, decay 10 to the minus 4) as a grey circle and RMSProp (learning rate 0.02, decay 10 to the minus 5, rho 0.999) as a blue diamond on each row, 10,001 epochs per run. Final accuracy in percent, seeds 0 to 9: AdaGrad 84.00, 75.67, 81.67, 92.67, 79.67, 84.67, 84.67, 89.67, 83.67, 82.00; RMSProp 90.00, 89.00, 87.33, 91.67, 95.00, 77.33, 89.00, 77.00, 85.67, 85.33; RMSProp is ahead on seven seeds and behind on seeds 3, 5 and 7. Lowest accuracy of the last 1,000 epochs, with a dotted line at 70 percent: AdaGrad 83.67, 75.33, 80.33, 92.33, 78.67, 83.67, 84.33, 89.00, 83.67, 81.67; RMSProp 59.33, 61.67, 66.67, 52.00, 70.00, 66.33, 45.67, 75.67, 57.33, 48.00, below 70 on eight seeds. Highest loss of the last 1,000 epochs, with a dotted line at 1.5: AdaGrad 0.3933, 0.5384, 0.3820, 0.2283, 0.4137, 0.3329, 0.3506, 0.3104, 0.3849, 0.3571; RMSProp 1.6829, 1.8076, 1.5053, 3.6640, 1.6136, 0.7458, 4.7996, 0.5483, 1.5976, 2.9183, above 1.5 on eight seeds.</desc>
