<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-two-modes-title" aria-describedby="nn-01-two-modes-desc">
<title id="nn-01-two-modes-title">Training masks and rescales; evaluation passes through</title>
<desc id="nn-01-two-modes-desc">Three rows of five cells for one Layer_Dropout with drop rate p = 0.2, the draw of section 4. Training, forward: activations a of 1, 1, 1, 1, 1 times the stored mask, the mask of 0 and 1 (1, 1, 1, 1, 0) divided by 1 minus p = 0.8, that is 1.25, 1.25, 1.25, 1.25, 0.00, gives the output 1.25, 1.25, 1.25, 1.25, 0.00, which sums to 5 as the input does; the fifth entry is dropped. Training, backward: dvalues 0.1, minus 0.2, 0.3, 0.4, minus 0.5 times the same stored mask gives dinputs 0.125, minus 0.250, 0.375, 0.500, 0.000. Evaluation with training=False: no mask is drawn and the output is a copy of the input, 1, 1, 1, 1, 1.</desc>
