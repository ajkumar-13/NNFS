<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-thinned-networks-title" aria-describedby="nn-02-thinned-networks-desc">
<title id="nn-02-thinned-networks-title">Each thinned network disagrees; their average does not</title>
<desc id="nn-02-thinned-networks-desc">Left: a network of 2 inputs, 8 ReLU neurons and 3 classes with one dropout mask that keeps 5 of the 8 neurons, one of 56 such masks; the 3 dropped neurons are dashed and have no connections. Right: for each number of kept neurons from 0 to 8, a band from the lowest to the highest share of the 300 spiral points on which a thinned network picks another class than the full network, with a dot at the mean over its masks, and the number of masks and the mean printed beside it: 0 kept, 1 masks, 76.7 to 76.7, mean 76.7 percent; 1 kept, 8 masks, 23.0 to 76.7, mean 64.6 percent; 2 kept, 28 masks, 6.3 to 76.7, mean 54.2 percent; 3 kept, 56 masks, 6.3 to 76.7, mean 45.0 percent; 4 kept, 70 masks, 6.3 to 76.7, mean 36.8 percent; 5 kept, 56 masks, 6.3 to 76.7, mean 29.4 percent; 6 kept, 28 masks, 6.3 to 76.7, mean 22.4 percent; 7 kept, 8 masks, 6.3 to 54.0, mean 15.4 percent; 8 kept, 1 masks, 8.0 to 8.0, mean 8.0 percent. A dotted line marks the mean over all 256 masks, 37.5 percent. The caption states that the logits averaged over the 256 masks equal the full network's to within 8.4e-15.</desc>
