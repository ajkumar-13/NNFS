<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-03-batch-sums-samples-title" aria-describedby="nn-03-batch-sums-samples-desc">
<title id="nn-03-batch-sums-samples-title">Contracting the batch axis adds up the samples</title>
<desc id="nn-03-batch-sums-samples-desc">Top: the batch of section 6.1 as one product. dL/dZ transposed, shape (m, N) = (3, 3), one row per neuron and one column per sample, holds 1, 2, 3 in every row; times X, shape (N, n) = (3, 4), one row per sample, holding 1.0, 2.0, 3.0, 2.5, 2.0, 5.0, minus 1.0, 2.0, minus 1.5, 2.7, 3.3, minus 0.8; equals dL/dW, shape (m, n) = (3, 4), every row 0.5, 20.1, 10.9, 4.1. A bracket joins the two N axes: the batch axis, which the product contracts and sums away. Row 1 of dL/dZ transposed and row 1 of dL/dW are outlined. Bottom: row 1 rebuilt one sample at a time, each under the columns of X: 1 times row 1 of X gives 1.0, 2.0, 3.0, 2.5; 2 times row 2 gives 4.0, 10.0, minus 2.0, 4.0; 3 times row 3 gives minus 4.5, 8.1, 9.9, minus 2.4; their sum is 0.5, 20.1, 10.9, 4.1, row 1 of the product.</desc>
