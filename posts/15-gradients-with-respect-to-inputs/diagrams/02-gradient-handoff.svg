31 420.54 51.34 424.09M908.8 424.09C735.92 420.78 563.28 421.02 51.38 423.87M51 424C41.9 423.91 41.88 422.02 39.32 411.1M50.48 424.04C45.79 423.09 41.86 418.4 38.09 413.29M40.92 411.54C38.72 402.14 40.02 387.95 40.97 367.24M39.75 413.21C39.21 402.09 40.07 392.9 39.22 368.56M40 369C39.44 359.89 44.9 359.46 49.76 357.88M38.01 368.5C40.05 361.92 45.1 355.86 51.97 360.05M51 358C51 358 51 358 51 358M51 358C51 358 51 358 51 358" fill="none" stroke="var(--nn-border)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="480" y="381.96" text-anchor="middle" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--nn-ink)">A layer’s input gradient is the next-earlier layer’s upstream gradient.</text><text xml:space="preserve" x="480" y="404.12" text-anchor="middle" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--nn-ink-muted)">Drop it and backpropagation stops at the first layer boundary it meets, and every earlier weight stays at its initial value.</text><text xml:space="preserve" x="40" y="455.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--nn-ink-muted)">This is why a single-layer example never needs ∂L/∂X, and why a two-layer one cannot work without it.</text>
