<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Where each of a dense layer’s three gradients goes</title>
  <desc id="d">A hand-drawn diagram of one layer’s backward call. The upstream gradient, of shape N by m, arrives from the right into a card holding the three lines of Layer_Dense.backward: the weight gradient from the transposed inputs dotted with the upstream, the bias gradient from a sum along the batch axis, and the input gradient from the upstream dotted with the transposed weights. Three cards on the left receive them, sorted by where they go: the weight gradient of shape n by m stays here and is consumed by the optimiser, the bias gradient of shape one by m likewise, and the input gradient of shape N by n travels left, annotated as being the previous layer’s upstream gradient, with an arrow carrying it on to layer L minus one. A band states that a layer’s input gradient is the next-earlier layer’s upstream gradient, and that dropping it stops backpropagation at the first layer boundary it meets, leaving every earlier weight at its initial value.</desc>

