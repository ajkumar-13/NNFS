<text x="728" y="273" text-anchor="middle" class="t-label"><tspan class="i">z</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan></text>
</g>
<text x="768" y="272" class="t-value f-purple-ink">43.2</text>
<circle cx="728" cy="324" r="20" class="f-green-soft s-green w15"/>
<g data-grid="skip">
