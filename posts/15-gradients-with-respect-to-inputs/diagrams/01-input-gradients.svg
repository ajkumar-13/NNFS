<text x="312" y="328" class="t-note">43.2</text>
<text x="312" y="176" class="t-label f-purple-ink">∂<tspan class="i">L</tspan>/∂<tspan class="i">z</tspan><tspan class="sub i" dy="4">k</tspan><tspan dy="-4">​</tspan></text>
<path d="M368,252 H376 V340 H368" class="brace"/>
<text x="384" y="292" class="t-note"><tspan class="i">w</tspan><tspan class="sub" dy="4">11</tspan><tspan dy="-4">​</tspan> is not</text>
<text x="384" y="312" class="t-note">in <tspan class="i">z</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan> or <tspan class="i">z</tspan><tspan class="sub" dy="4">3</tspan><tspan dy="-4">​</tspan></text>
<text x="176" y="184" text-anchor="middle" class="t-label"><tspan class="f-orange-ink"><tspan class="i">w</tspan><tspan class="sub" dy="4">11</tspan><tspan dy="-4">​</tspan></tspan></text>
<text x="40" y="420" class="t-math">∂<tspan class="i">L</tspan>/∂<tspan class="i">w</tspan><tspan class="sub" dy="4">11</tspan><tspan dy="-4">​</tspan> = ∂<tspan class="i">L</tspan>/∂<tspan class="i">z</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> · <tspan class="i">x</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan></text>
<text x="40" y="452" class="t-math"><tspan class="f-purple-ink">43.2</tspan> · <tspan class="f-blue-ink">1</tspan> = <tspan class="b f-purple-ink">43.2</tspan></text>
<text x="496" y="136" class="t-head">An input: <tspan class="i">x</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> lies on three paths</text>
