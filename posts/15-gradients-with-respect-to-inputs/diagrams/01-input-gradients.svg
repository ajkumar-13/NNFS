<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-input-gradients-title" aria-describedby="nn-01-input-gradients-desc">
<title id="nn-01-input-gradients-title">A weight has one path to the loss, an input has three</title>
<desc id="nn-01-input-gradients-desc">Two copies of the layer of posts 13 and 14: four input nodes x1 to x4 joined to three neurons z1 to z3, every neuron with the upstream gradient 43.2 beside it. Left, the weight w11: one path, from x1 into z1, is drawn in the gradient colour, and its gradient is dL/dz1 times x1, 43.2 times 1 = 43.2; the upstream values of z2 and z3 are muted, with a bracket noting that w11 is not in z2 or z3. Right, the input x1: three paths, into z1, z2 and z3, are drawn in the gradient colour, a column beside the neurons lists the weights on them, wk1 = 0.1, 0.5 and 0.9, and its gradient is the sum over k of dL/dzk times wk1, 43.2 times 0.1 plus 43.2 times 0.5 plus 43.2 times 0.9 = 64.80.</desc>
<style>
