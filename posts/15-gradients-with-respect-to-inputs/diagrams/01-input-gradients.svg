</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title">A weight has one path to the loss, an input has three</text>
<text x="40" y="76" class="t-subtitle">The layer of posts 13 and 14 at <tspan class="i">x</tspan> = (1, 2, 3, 4). Every ReLU gate is open, so each neuron's ∂<tspan class="i">L</tspan>/∂<tspan class="i">z</tspan><tspan class="sub i" dy="4">k</tspan><tspan dy="-4">​</tspan> = 43.2.</text>
<text x="40" y="136" class="t-head">A weight: <tspan class="i">w</tspan><tspan class="sub" dy="4">11</tspan><tspan dy="-4">​</tspan> lies on one path</text>
