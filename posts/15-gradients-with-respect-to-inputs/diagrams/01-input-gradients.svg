<text x="768" y="328" class="t-value f-purple-ink">43.2</text>
<text x="768" y="176" class="t-label f-purple-ink">∂<tspan class="i">L</tspan>/∂<tspan class="i">z</tspan><tspan class="sub i" dy="4">k</tspan><tspan dy="-4">​</tspan></text>
<text x="856" y="176" class="t-label f-orange-ink"><tspan class="i">w</tspan><tspan class="sub" dy="4"><tspan class="i">k</tspan>1</tspan><tspan dy="-4">​</tspan></text>
<text x="856" y="216" class="t-value f-orange-ink">0.1</text>
<text x="856" y="272" class="t-value f-orange-ink">0.5</text>
<text x="856" y="328" class="t-value f-orange-ink">0.9</text>
<text x="496" y="420" class="t-math">∂<tspan class="i">L</tspan>/∂<tspan class="i">x</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> = Σ<tspan class="sub i" dy="4">k</tspan><tspan dy="-4">​</tspan> ∂<tspan class="i">L</tspan>/∂<tspan class="i">z</tspan><tspan class="sub i" dy="4">k</tspan><tspan dy="-4">​</tspan> · <tspan class="i">w</tspan><tspan class="sub" dy="4"><tspan class="i">k</tspan>1</tspan><tspan dy="-4">​</tspan></text>
<text x="496" y="452" class="t-math"><tspan class="f-purple-ink">43.2</tspan> · <tspan class="f-orange-ink">0.1</tspan> + <tspan class="f-purple-ink">43.2</tspan> · <tspan class="f-orange-ink">0.5</tspan> + <tspan class="f-purple-ink">43.2</tspan> · <tspan class="f-orange-ink">0.9</tspan> = <tspan class="b f-purple-ink">64.80</tspan></text>
<text x="40" y="504" class="t-note">Each path adds one product; the input's gradient adds one per neuron it feeds.</text>
