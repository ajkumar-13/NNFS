<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-04-batch-rows-title" aria-describedby="nn-04-batch-rows-desc">
<title id="nn-04-batch-rows-title">Over a batch the input gradient keeps one row per sample</title>
<desc id="nn-04-batch-rows-desc">The batch of three samples of section 5. Left, the upstream gradient dL/dZ, shape (3, 3), one row per sample: 12.00, 10.20 and 5.48 in every column, which is 2 times y-hat over N for y-hat = 18.00, 15.30 and 8.22. Times the array weights, W transposed, shape (3, 4), it gives dL/dX, shape (3, 4): 18.000, 21.600, 25.200, 28.800; 15.300, 18.360, 21.420, 24.480; 8.220, 9.864, 11.508, 13.152. Row 1 of the upstream gradient and row 1 of the result are outlined. Notes: row i of the result uses only row i of dL/dZ; the rows computed one sample at a time differ by at most 3.6e-15 and a central difference on all 12 inputs by 2.8e-09; the weight gradient (4, 3) and the bias gradient (1, 3) instead sum over the three samples.</desc>
