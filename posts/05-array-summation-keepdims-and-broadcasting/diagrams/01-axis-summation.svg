<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-01-axis-summation-title" aria-describedby="nn-01-axis-summation-desc">
<title id="nn-01-axis-summation-title">The axis named in a reduction is the axis that disappears</title>
<desc id="nn-01-axis-summation-desc">The post's array a, shape (3, 3), holding 1 to 9, with axis 0 running down its rows and axis 1 across its columns. With keepdims=True the reduced axis stays at size 1: the column sums 12, 15, 18 sit under a's columns as a row of shape (1, 3) (axis=0), and the row sums 6, 15, 24 sit beside a's rows as a column of shape (3, 1) (axis=1). Without keepdims, np.sum(a, axis=0) gives 12, 15, 18 and np.sum(a, axis=1) gives 6, 15, 24, both drawn as flat strips, lower than the square cells, with the same shape (3,), and np.sum(a) gives the scalar 45, shape (), drawn as a bare number. A note says that flat strips are 1-D arrays and that the 1-D shape does not record which axis was summed.</desc>
