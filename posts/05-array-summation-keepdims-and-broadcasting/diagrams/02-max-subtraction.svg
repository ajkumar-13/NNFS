<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-02-max-subtraction-title" aria-describedby="nn-02-max-subtraction-desc">
<title id="nn-02-max-subtraction-title">Without keepdims the row maxima line up with the columns</title>
<desc id="nn-02-max-subtraction-desc">Two rows, each the 3 by 3 array a minus max_vals as broadcast equals the result. Top, without keepdims: max_vals is 3, 6, 9 with shape (3,), drawn as the first row of the stretched operand and copied down, so every row has 3, 6, 9 subtracted; the result rows are minus 2, minus 4, minus 6; 1, minus 1, minus 3; 4, 2, 0, no error is raised, and the rows do not end in 0, because column j loses the maximum of row j. Bottom, with keepdims=True: max_vals is a column of shape (3, 1) copied across, so row i loses its own maximum, and every row of the result is minus 2, minus 1, 0.</desc>
