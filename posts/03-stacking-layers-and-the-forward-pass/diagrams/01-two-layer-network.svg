</g>
<text x="136" y="220" text-anchor="middle" class="t-label"><tspan class="i">x</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan></text>
<text x="136" y="300" text-anchor="middle" class="t-label"><tspan class="i">x</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan></text>
<text x="136" y="380" text-anchor="middle" class="t-label"><tspan class="i">x</tspan><tspan class="sub" dy="4">3</tspan><tspan dy="-4">​</tspan></text>
<text x="136" y="460" text-anchor="middle" class="t-label"><tspan class="i">x</tspan><tspan class="sub" dy="4">4</tspan><tspan dy="-4">​</tspan></text>
<path d="M672,256 L757,256" class="flow" marker-end="url(#nn-01-two-layer-network-arrow)"/>
<path d="M672,336 L757,336" class="flow" marker-end="url(#nn-01-two-layer-network-arrow)"/>
<path d="M672,416 L757,416" class="flow" marker-end="url(#nn-01-two-layer-network-arrow)"/>
<text x="264" y="136" text-anchor="middle" class="t-label"><tspan class="b">X</tspan>  (<tspan class="i">N</tspan>, 4)</text>
<text x="264" y="160" text-anchor="middle" class="t-note">4 values per sample</text>
<text x="520" y="136" text-anchor="middle" class="t-label"><tspan class="b">Z</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan>  (<tspan class="i">N</tspan>, 3)</text>
<text x="520" y="160" text-anchor="middle" class="t-note">3 values per sample</text>
<text x="704" y="136" text-anchor="middle" class="t-label"><tspan class="b">Z</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan>  (<tspan class="i">N</tspan>, 3)</text>
<text x="704" y="160" text-anchor="middle" class="t-note">the output</text>
<text x="136" y="528" text-anchor="middle" class="t-head">Input</text>
<text x="136" y="556" text-anchor="middle" class="t-note">4 features</text>
<text x="392" y="528" text-anchor="middle" class="t-head">Layer 1: hidden</text>
<text x="392" y="556" text-anchor="middle" class="t-label f-orange-ink"><tspan class="b">W</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> (3, 4),  <tspan class="b">b</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> (3,)</text>
<text x="392" y="580" text-anchor="middle" class="t-note">3 neurons, 4 weights each</text>
<text x="392" y="604" text-anchor="middle" class="t-note">12 + 3 = 15 parameters</text>
<text x="392" y="640" text-anchor="middle" class="t-math"><tspan class="b">Z</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> = <tspan class="b">X</tspan> <tspan class="b">W</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan><tspan class="sub" dy="-7">T</tspan><tspan dy="7">​</tspan> + <tspan class="b">b</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan></text>
<text x="648" y="528" text-anchor="middle" class="t-head">Layer 2: output</text>
<text x="648" y="556" text-anchor="middle" class="t-label f-orange-ink"><tspan class="b">W</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan> (3, 3),  <tspan class="b">b</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan> (3,)</text>
<text x="648" y="580" text-anchor="middle" class="t-note">3 neurons, 3 weights each</text>
<text x="648" y="604" text-anchor="middle" class="t-note">9 + 3 = 12 parameters</text>
<text x="648" y="640" text-anchor="middle" class="t-math"><tspan class="b">Z</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan> = <tspan class="b">Z</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">​</tspan> <tspan class="b">W</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan><tspan class="sub" dy="-7">T</tspan><tspan dy="7">​</tspan> + <tspan class="b">b</tspan><tspan class="sub" dy="4">2</tspan><tspan dy="-4">​</tspan></text>
<text x="848" y="528" text-anchor="middle" class="t-head">Network</text>
<text x="848" y="556" text-anchor="middle" class="t-value">15 + 12 = 27</text>
<text x="848" y="580" text-anchor="middle" class="t-note">parameters</text>
<path d="M784,200 H808" class="s-orange w15 nofill"/>
<text x="816" y="204" class="t-label">Into neuron 1</text>
<text x="784" y="232" class="t-note">4 weights in layer 1</text>
<text x="784" y="252" class="t-note">3 weights in layer 2</text>
<text x="40" y="684" class="t-note">Each layer runs the same call; only the sizes change.</text>
</svg>
