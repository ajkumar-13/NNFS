    --nn-surface: #FFFFFF;
    --nn-ink: #1A1A1A;
    --nn-ink-muted: #5C5C5C;
    --nn-ink-subtle: #9A9A9A;
    --nn-border: #D9D9D4;
    --nn-primary: #5B7FBF;
    --nn-accent: #D98E5F;
    --nn-success: #5C9E78;
    --nn-warn: #B8895A;
    --nn-alert: #C66B5E;
    --nn-neutral-1: #EAEAE4;
    --nn-neutral-2: #CFCFC8;
    --nn-neutral-3: #8E8E88;
    --nn-on-fill: #FFFDF9;
    --nn-on-accent: #1A1A1A;
    --nn-grid: rgba(26, 26, 26, 0.06);
    --nn-contour: rgba(91, 127, 191, 0.10);
    --nn-contour-line: rgba(91, 127, 191, 0.35);
    --nn-rule: #8E8E88;
    --nn-arrow: #6E6E68;
    --nn-neutral-soft: #F2F2EE;
    --nn-blue: #0072B2;
    --nn-blue-ink: #005A8C;
    --nn-blue-soft: #E3F0F8;
    --nn-blue-line: #9CC6E0;
    --nn-orange: #C98500;
    --nn-orange-ink: #8A5B00;
    --nn-orange-soft: #FBF0D9;
    --nn-orange-line: #E5C27A;
    --nn-green: #008F68;
    --nn-green-ink: #006B4E;
    --nn-green-soft: #DFF3EC;
    --nn-green-line: #8FCDB8;
    --nn-red: #A8322A;
    --nn-red-ink: #8F2A23;
    --nn-red-soft: #F8E3E1;
    --nn-red-line: #DDA49F;
    --nn-purple: #A14D8C;
    --nn-purple-ink: #833E72;
    --nn-purple-soft: #F4E4EF;
    --nn-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --nn-bg: #0E0F12;
      --nn-surface: #16181C;
