<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="nn-01-two-layer-network-title" aria-describedby="nn-01-two-layer-network-desc">
<title id="nn-01-two-layer-network-title">Layer 1's output is layer 2's input</title>
<desc id="nn-01-two-layer-network-desc">The post's network drawn left to right: 4 input nodes x1 to x4, 3 neurons in layer 1, the hidden layer, and 3 neurons in layer 2, the output layer. Every neuron is joined to every node of the column before it; the 4 connections into the first neuron of layer 1 and the 3 into the first neuron of layer 2 are drawn in the weight colour. Above the connections are the arrays they carry: X of shape (N, 4), then Z1 of shape (N, 3), then the output Z2 of shape (N, 3). Under layer 1: W1 of shape (3, 4), 3 neurons with 4 weights each, b1 of shape (3,), 12 plus 3 is 15 parameters, and Z1 = X W1 transposed + b1. Under layer 2: W2 of shape (3, 3), 3 neurons with 3 weights each, b2 of shape (3,), 9 plus 3 is 12 parameters, and Z2 = Z1 W2 transposed + b2. The whole network has 15 plus 12, which is 27 parameters. A key reads: into neuron 1, 4 weights in layer 1 and 3 weights in layer 2. A caption line reads: each layer runs the same call; only the sizes change.</desc>
<style>
