<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Dimension flow across two stacked layers</title>
  <desc id="d">A hand-drawn left-to-right shape chain for a batch of N samples through two dense layers. The input X of shape N by four is dotted with W1 transposed of shape four by three, giving Z1 of shape N by three; Z1 is then dotted with W2 transposed of shape three by three, giving Z2 of shape N by three. Two dashed checks are drawn under the pairs they concern: the inner four against four between X and W1 transposed, and the inner three against three between Z1 and W2 transposed. Notes record that b1 of shape three is broadcast over all N rows, and likewise b2. A band states that shape continuity is the one thing stacking adds and that a layer’s weight matrix needs one column per neuron in the layer before it, and a footer recommends printing the shape of Z1 after layer one and checking it against N by m1, so a mismatch surfaces there rather than deep in training.</desc>

