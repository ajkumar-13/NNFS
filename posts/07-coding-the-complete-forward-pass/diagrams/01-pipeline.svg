<text x="40" y="408" class="t-head">The script: four objects, four calls</text>
<rect x="40" y="424" width="352" height="232" rx="8" class="card"/>
<text x="56" y="456" class="t-code" xml:space="preserve">dense1      = Layer_Dense(2, 3)</text>
<text x="56" y="480" class="t-code">activation1 = Activation_ReLU()</text>
<text x="56" y="504" class="t-code" xml:space="preserve">dense2      = Layer_Dense(3, 3)</text>
<text x="56" y="528" class="t-code">activation2 = Activation_Softmax()</text>
<text x="56" y="560" class="t-code">dense1.forward(X)</text>
<text x="56" y="584" class="t-code">activation1.forward(dense1.output)</text>
<text x="56" y="608" class="t-code">dense2.forward(activation1.output)</text>
<text x="56" y="632" class="t-code">activation2.forward(dense2.output)</text>
<text x="424" y="408" class="t-head">What it prints: <tspan class="mono">activation2.output[:5]</tspan></text>
