<text x="440" y="456" class="t-code">[[0.33333334 0.33333334 0.33333334]</text>
<text x="448" y="480" class="t-code" xml:space="preserve">[0.3333332  0.3333332  0.33333364]</text>
<text x="448" y="504" class="t-code" xml:space="preserve">[0.3333329  0.33333293 0.3333342 ]</text>
<text x="448" y="528" class="t-code" xml:space="preserve">[0.3333326  0.33333263 0.33333477]</text>
<text x="448" y="552" class="t-code" xml:space="preserve">[0.33333233 0.3333324  0.33333528]]</text>
<text x="776" y="456" class="t-note">the origin, 1/3 each</text>
<path d="M760,468 H768 V564 H760" class="brace"/>
<text x="776" y="504" class="t-note">rows 1 to 4:</text>
<text x="776" y="524" class="t-note">within 0.000002</text>
<text x="776" y="544" class="t-note">of 1/3</text>
<text x="440" y="596" class="t-note">All 300 rows: every entry between 0.333297 and 0.333402,</text>
<text x="440" y="616" class="t-note">and every row sums to 1.</text>
<text x="40" y="684" class="t-note">Each object stores its result in .output, and the next call reads it from there.</text>
