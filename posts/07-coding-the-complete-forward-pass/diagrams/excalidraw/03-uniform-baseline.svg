<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">The uniform output at initialisation: well-formed, and uninformative</title>
  <desc id="d">Two hand-drawn bar charts of one output row each. The left, labelled at initialisation, is the row this post actually prints: three near-equal bars at roughly nought point three three three across classes nought, one and two. It sums to one, which shows softmax is implemented correctly, but its argmax is right about a third of the time, which is chance. The right, labelled after training, shows nought point nine five, nought point nought three and nought point nought two: also summing to one, with the difference being not well-formedness but that one class now carries most of the mass. A band traces the cause: weights of about nought point nought one times features of about nought point five give logits of about nought point nought one, and softmax of near-equal logits is about one over the class count. A footer notes that the uniform row is exactly what small random weights should produce, and that anything else at initialisation would be the bug.</desc>

