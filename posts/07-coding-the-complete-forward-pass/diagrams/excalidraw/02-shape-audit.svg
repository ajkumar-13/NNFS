<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Shape audit through the complete forward pass</title>
  <desc id="d">A hand-drawn horizontal shape audit for three hundred spiral samples through four stages. Each shape is drawn as two boxes, a batch axis and a feature axis in different colours. X starts at three hundred by two; dense1 takes the feature axis from two to three giving three hundred by three; activation1 leaves it unchanged; dense2 leaves it at three by three; and activation2 leaves it unchanged again, ending at three hundred by three probabilities. A dashed tie runs under the batch axis of all five shapes, labelled as never changing, three hundred rows in and three hundred rows out. A band states that activations never change the shape and dense layers are the only place the feature axis moves, because ReLU is pointwise and softmax normalises within a row, so neither has a neuron count to impose. A footer notes that checking the row count survives the pipeline is the fastest way to catch a transposed array.</desc>

