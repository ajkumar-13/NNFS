<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nn-03-why-uniform-title" aria-describedby="nn-03-why-uniform-desc">
<title id="nn-03-why-uniform-title">Logits in ten-thousandths give probabilities near 1/3</title>
<desc id="nn-03-why-uniform-desc">Left, a dot plot on a log scale from 10 to the minus 5 to 1 of the size of the entries at each stage of the forward pass on the 300 spiral points, the mean absolute entry as a grey circle and the largest as a green diamond: X, mean 0.318836, largest 0.97939; dense1.output, mean 0.004043, largest 0.01746; activation1.output, mean 0.002029, largest 0.01731; dense2.output, the logits, mean 0.000046, largest 0.00023. Right, row 99, the least uniform row of the output: logits minus 0.0002333, minus 0.0002187, 0.0000813 for classes 0, 1 and 2, and probabilities 0.333297, 0.333302, 0.333402, drawn as three bars on a scale from 0 to 1 that look equal. A note gives the largest logit gap, 0.0003146, and e to that gap, 1.000315, the largest probability over the smallest.</desc>
