[project]
name = "binary-classifier"
version = "1.0.0"
description = "A 2-16-16-1 dense network with a sigmoid output and binary cross-entropy, written in NumPy alone, trained on the two-moons dataset."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Ajay" }]
# Pinned exactly, as in every project of the series: the documented figures were measured with
# this NumPy build (docs/adr/0003-pin-numpy-for-bit-reproducibility.md).
dependencies = ["numpy==2.3.5"]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-cov>=7.1", "ruff>=0.16"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binary_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No cache directory: the test command writes nothing into the project but coverage's data file.
addopts = "-q -p no:cacheprovider"
# A NumPy warning (an overflow in exp, say) fails the test that raised it.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Prose is never rewritten by the code formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
