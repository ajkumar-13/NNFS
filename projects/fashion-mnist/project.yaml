id: nn-p03
slug: fashion-mnist
title: "Fashion-MNIST with the same network"
summary: "The MNIST project's dense network, unchanged, trained on the 60,000 Fashion-MNIST clothing images and scored on the 10,000 test images, with a report by class. From a fixed seed it reaches 87.12 percent test accuracy with 118,282 parameters, and the locked environment repeats the run bit for bit."
kind: model
status: released
level: intermediate
after_post: nn-033
uses: [nn-016, nn-019, nn-027, nn-028, nn-030, nn-031, nn-032, nn-033]
problem: "A model that scores 98 percent on MNIST says little about harder images, and a single accuracy figure hides which classes fail. This project changes only the data: it trains the same 784-128-128-10 network, with the same settings and seed, on Fashion-MNIST, and reports the errors class by class as figures that anyone can reproduce and that other work can cite."
users: "Readers who have trained the MNIST project (nn-p01) and need to see that MNIST flatters a model, and the sibling series Convolutional Neural Networks from Scratch, which uses this run as its dense baseline on Fashion-MNIST."
impact: "Trained from seed 0 with the documented command, the 118,282-parameter network classifies 8,712 of the 10,000 Fashion-MNIST test images correctly, a test accuracy of 87.12 percent, 1,088 images fewer than the same network on MNIST. docs/EVALUATION.md records the run and its per-class figures, and the eval command exits with an error if a rerun in the locked environment scores below 0.8712."
stack:
  language: python
  frameworks: [numpy]
runtime:
  deploy: none
  targets: []
commands:
  setup: "uv sync --frozen"
  test: "uv run pytest --cov=src --cov-fail-under=95"
  lint: "uv run ruff check . && uv run ruff format --check ."
  run: "uv run python -m fashion_mnist.train"
  eval: "uv run python -m fashion_mnist.evaluate --min-accuracy 0.8712"
quality:
  coverage_min: 95
  evaluation: docs/EVALUATION.md
